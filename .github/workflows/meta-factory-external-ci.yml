# seed/external_ci.yml — the two-verifier doctrine (M6, I-11, PF-10).
#
# STAGE 0 · trust-chain · R3. The ONLY layer untouchable by the model, the hooks or the local
# engineer: another machine, another actor. It re-DERIVES the verdict on a clean clone and
# compares it against the pinned (committed) verdict. It does not audit stored artifacts — it
# rebuilds them — because local custody is not the root of trust (replicability is).
#
# It is also the trusting-trust defense of self-improvement (SELF-IMPROVEMENT §1), with its HONEST
# scope (H-2, COUNCIL-360 §4.1): the pin anchors VERDICTS (station + [check, exit]), not bytes —
# a compromised local Meta-Factory goes red here iff the compromise changes some re-derived exit.
#
# ALL the logic lives in `meta ci --rederive` (testable CLI). This yaml is one-line transport
# (ADR-005 §4): zero duplicable logic that could diverge.
#
# ───────────────────────────────────────────────────────────────────────────────────────────────
# V3-INC11 P6 — `./meta` now dispatches to v3 (`v3.cli`); the v2 substrate no longer exists.
#
# THE SCOPE OF THIS ACTOR, STATED, because for 22 days it was not (node N-0116). This job
# re-derives ONE of the ten committed pin targets: `dummy`, 5 of 84 stations — SIX PER CENT of the
# pinned surface. It is not, and has never been, "P1 green on another machine". It cannot be:
# `iot` needs Go, `full-stack-kotlin` needs JDK 21 + PostgreSQL + Chromium, and this runner has
# none of them. The remaining 79 stations are re-derived on the development machine and recorded in
# `docs/work/V3-INC11-CUTOVER-INCREMENT.md`.
#
# The number is written here rather than in a doc because this file is where someone reads it while
# deciding whether a green tick means what they think it means. Widening it is a deliberate act:
# add the toolchains to this job and raise the count in the same commit — never one without the
# other, or the scope silently drifts from the sentence again.
# ───────────────────────────────────────────────────────────────────────────────────────────────

name: meta-factory-external-ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rederive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4         # clean clone: .proof/ does not exist (gitignored)
        with:
          # fetch-depth: 0 — MEASURED, V3-INC11 P6. `checkout` defaults to a SHALLOW clone (depth 1),
          # and v3 verifies itself against v2 read at a PINNED COMMIT (`v3/oracle_ref.json`) with
          # `git show`/`git ls-tree`. On a shallow clone that commit is not in the history and
          # nineteen modules die with "fatal: not a tree object" — cli_parity, column_law_parity,
          # deletion_manifest, economy_census, every *_parity and every census.
          # This is node N-0122 arriving on the independence layer before anyone tried to extract
          # v3: after P5 deleted the substrate, THE HISTORY IS THE ORACLE, so an actor without the
          # history cannot verify this repo at all. Locally it was invisible — a dev clone is deep.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # claude-agent-sdk: v3's control plane imports it (the host owns the loop, ADR-031); the
      # `compaction` gate inspects the wired hooks through it. Importing needs no credentials.
      - run: pip install pyyaml pytest hypothesis claude-agent-sdk
      - name: Re-derive the verdict and compare against the pinned one (dummy — 5 of 84 stations)
        # Rebuilds the dummy factory's line from its spec, recomputes every proof_sha and
        # requires the pinned one (factories/<slug>/pinned_verdict.json). Deviation in ANY
        # direction = red (a spontaneous PASS without proof is façade, not improvement).
        # `--factory` defaults to `dummy` in v3 exactly as it did in v2 — see `v3/cli.py`, where
        # that default is deliberately NOT "improved", because widening it here by accident is
        # precisely how this job would start failing for reasons that are not about the code.
        run: ./meta ci --rederive
      - name: PF-6 isolation + docs consistency + suite
        # The skip list is MEASURED, not predicted, and every entry says why it is here:
        #   projection, generality — audit LOCAL evidence (the heavy factories' `.proof/`,
        #     gitignored); a clean clone cannot re-derive it without JDK/PG/Chromium.
        #   rederive              — the suite's own full re-derivation over all 10 targets; the
        #     step above is this actor's re-derivation, at the scope this runner can honestly do.
        #   evidence_liveness     — node N-0102: it resolves `.md` references against the SIBLING
        #     repo `../Agent_Systems_Factory/`, which does not exist here. Its colour is set by the
        #     environment rather than by the commit, which is a defect in the gate, not in the tree.
        #   telemetry_liveness    — audits `.metamem/`, which is gitignored and therefore absent on
        #     every clean clone. It says so itself ("a zero nobody wrote is not a measurement") and
        #     is right to; it is simply not this actor's instrument.
        #   suite                 — re-runs every OTHER gate's red side, including `rederive`'s,
        #     which needs the toolchains this runner does not have. The P2 sweep therefore runs on
        #     the development machine and is recorded in the increment's §Evidencia.
        #
        # WHAT IS DELIBERATELY *NOT* SKIPPED: `codegen_freeze`. It is genuinely RED and it is right
        # to be — commit `ba05918d2` fed `full-stack-kotlin`'s frozen `codegen/` with no waiver
        # (nodes N-0084 / N-0105, and ADR-032 §A6 told INC-11 to expect exactly this as DECLARED
        # debt). It belongs to the FSK level and must be resolved by an FSK increment, not laundered
        # here. A green tick bought by skipping a true red is worth less than an honest red, and the
        # 22-day blindness this job just came out of started with a verdict nobody read — not with
        # a verdict nobody liked.
        # A skip is PRINTED as SKIPPED and never counts as green (`v3.verify.suite`).
        run: ./meta check --skip projection,generality,rederive,evidence_liveness,telemetry_liveness,suite
