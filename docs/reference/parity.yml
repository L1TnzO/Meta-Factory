# parity.yml — el LIBRO DE PROMOCIÓN de mecanismos de SUSTRATO (ADR-014, MAT-0). SINGLE SOURCE.
#
# Un *mecanismo de sustrato* es una capacidad de generación/verificación/gating en `src/metafactory/`
# o `seed/` (un `kind` de check del registry, o una build `action`). ADR-014 §2: un mecanismo NO promueve
# —no cierra su incremento ni una fábrica confía en él como general— hasta estar probado verde en ≥2
# fábricas de dominios RADICALMENTE DISTINTOS. Prototipar en un dominio está permitido (§"gobierna la
# promoción, no la exploración"); declararlo general sin la 2ª prueba, no.
#
# Este archivo declara el CLAIM; el check `verify/checks/generality_parity.py` lo VERIFICA contra los
# artefactos (`.proof/` recomputado) y los specs (toolchain + primitivas), no contra prosa.
#
# Campos por entrada:
#   mechanism : el `kind` de check (registry) o la `action` de build que ES el mecanismo.
#   status    : prototype  -> exploración en ≤N dominios; NO gatea (ADR-014 §2).
#               general    -> PROMOVIDO; el check EXIGE ≥2 `domains` que lo prueben verde y un par
#                             radicalmente distinto (§3: lenguaje de producto disjunto Y mezcla de
#                             primitivas distinta). Si no se cumple -> ROJO.
#   domains   : slugs de las fábricas que lo co-validan (las que el check audita).
#   note      : por qué está donde está / qué lo promovería.
#
# HOY (post-MAT-1): existe un 2º lenguaje radicalmente distinto — la Full-Stack-Factory (TypeScript:
# tsc/node:test/node:sqlite) — que prueba verde los mecanismos compartidos. Por eso `product_env`,
# `generate` e `infra_up` PROMUEVEN a `general` (ts ⟂ python, mezcla de primitivas distinta): el lockstep
# de ADR-014 §6 / MATURITY-PLAN §6, ya ejercido. `mcp_tools` sigue `prototype` (full-stack mínima no hace
# MCP: aún un solo dominio). Volver `general` a mcp_tools ahora -> el check ROJO (honesto).

mechanisms:
  - mechanism: product_env       # DES-8 (C3): proof en el toolchain DEL producto, aislado del de la fábrica.
    status: general
    domains: [dummy, agent-systems-factory, full-stack, iot]
    note: "Probado verde en Python (dummy/ASF), TypeScript (full-stack s0 tsc / s1 node:test) Y Go (iot s0-s2 `go vet`/`go test`, MAT-7). TRES lenguajes disjuntos -> general robusto (la 3ª fábrica heredó el mecanismo sin tocar el sustrato)."

  - mechanism: generate          # ADR-013 (C1): el slot creativo (brief -> via -> artefacto; la columna arbitra).
    status: general
    domains: [dummy, agent-systems-factory, full-stack, iot]
    note: "Scaffolder determinista en 3 lenguajes (ASF emite LangGraph/python, full-stack emite TS, iot emite un gateway Go, MAT-7). El `via` vivo por LLM es MAT-2."

  - mechanism: infra_up          # DES-9 (E1): la infra declarada levanta en el sandbox y un proof la usa.
    status: general
    domains: [dummy, full-stack, agent-systems-factory, iot]
    note: "MAT-3: cableado al M8 del PRODUCTO (bootstrap del toolchain + proof = test del producto). Probado en 3 KINDS de infra y 3 lenguajes: full-stack (node:sqlite socket, el producto persiste/lee), ASF (docker: Postgres checkpointer s3 + Neo4j linaje s2, python) Y iot (broker Go stdlib sobre socket-Unix, store-and-forward vivo, MAT-7). dummy mantiene el socket stdlib."

  - mechanism: mcp_tools         # DES-6 (E2): el MCP generado expone e invoca tools tipadas.
    status: prototype
    domains: [dummy]
    note: "Co-validado stdlib + toolset aritmético por test, pero un solo dominio (Python). Promueve con MCP en un 2º lenguaje."

  - mechanism: eval_gate         # DES-7 (MAT-4): un scorer declarado mide el output del producto y el sustrato BLOQUEA bajo umbral.
    status: general
    domains: [agent-systems-factory, full-stack]
    note: "MAT-4: scorer REAL que bloquea (supera el stub-0.0 de la legacy). Co-validado en 2 toolchains DISJUNTOS: ASF (faithfulness⟂critical_recall, scorer Python) Y full-stack (pass_rate⟂field_accuracy, scorer TypeScript/node). Diente de dos lados (el output degradado flipea el gate) probado en ambos; el sustrato no nombra tech (ADR-012). El scorer mide, el sustrato juzga."

  - mechanism: live_run          # DES-7/8 (MAT-5): corre el PRODUCTO contra un provider REAL y GATEA por propiedades + umbrales (no por bytes).
    status: general
    domains: [agent-systems-factory, full-stack]
    note: "MAT-5: el 'fuego' que la legacy pasó — corrida VIVA vs DeepSeek (endpoint OpenAI-compatible, mismo provider) gateada por PROPIEDADES estructurales + umbrales de cobertura, no por bytes; pin §7 (re-derive sin re-llamar). Co-validado en 2 toolchains DISJUNTOS por el MISMO kind: ASF (s10, grafo LangGraph; prop_hitl interrupt-a-runtime ⟂ prop_grounding contrato S6; driver+scorer Python/urllib stdlib) Y full-stack (s5, resumen NL; prop_summary afirma-el-total; driver+scorer node/fetch TypeScript). Diente de dos lados (el degraded flipea propiedades Y scorer) probado en ambos; el sustrato no nombra el provider (provider_env es DATA, ADR-012)."
