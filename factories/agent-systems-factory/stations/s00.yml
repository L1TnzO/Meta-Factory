id: s00
name: el chasis de una fábrica de sistemas de agentes LangGraph (producto proxy de
  invariante; la línea S0–S8 real es G-8 diferido)
activation: always
builds:
- action: render
  src: factories/agent-systems-factory/domain/agent_system.py
  dest: build/agent_system.py
- action: render
  src: factories/agent-systems-factory/generated/runner.py
  dest: build/runner.py
checks:
- name: compile
  kind: py_compile
  files:
  - build/agent_system.py
  - build/runner.py
- name: runs
  kind: import_runs
  code: 'import sys; sys.path.insert(0, ''build''); import runner; assert runner.run()
    == ''AGENT_SYSTEM_OK'', ''invariante violado: el producto no devuelve el marcador
    AGENT_SYSTEM_OK'''
- name: invariant
  kind: artifact_contains
  file: build/agent_system.py
  marker: AGENT_SYSTEM_OK
