id: s8
name: Sustrato de evaluabilidad (gates de umbral que bloquean)
activation: always
requires_prev: s4
builds: []
checks:
- name: eval_threshold_gate
  kind: eval_gate
  workdir: build/product
  bootstrap:
  - sh
  - -c
  - python3 setup_env.py && PYTHONPATH=src .venv/bin/python src/agent_system/generated/eval/produce_output.py
  scorer:
  - .venv/bin/python
  - src/agent_system/generated/eval/scorer.py
  output: eval/output.json
  degraded: eval/degraded.json
  thresholds:
    faithfulness: 0.7
    critical_recall: 0.9
