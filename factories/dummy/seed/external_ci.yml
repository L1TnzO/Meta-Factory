# seed/external_ci.yml — the two-verifier doctrine FOR THE dummy FACTORY (M6, I-11, PF-10).
#
# STAGE 0 · trust-chain · R3. The ONLY layer untouchable by the model, the hooks or the local
# engineer: another machine, another actor. It re-DERIVES the dummy factory's verdict on a clean
# clone and compares it against its pinned verdict (`factories/dummy/pinned_verdict.json`,
# committed). It does not audit stored artifacts — it rebuilds them — because local custody is not
# the root of trust (replicability is). It is the CI that `column.md` places ABOVE the column's
# three local locks: a compromised local produces a proof_sha the clean runner does NOT reproduce → red.
#
# Parametrized per factory (D1): it re-derives THIS factory (`--factory dummy`), no other. ALL the
# logic lives in `meta ci --rederive` (testable CLI); this yaml is one-line transport (ADR-005 §4) with
# the slug as DATA — zero duplicable logic that could diverge. The checkout is the Meta-Factory repo
# (the dummy factory lives in `factories/dummy/` and is re-derived with its engine).

name: dummy-external-ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rederive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4         # clean clone: factories/dummy/.proof/ does not exist (gitignored)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - name: Re-derive dummy's verdict and compare against the pinned one
        # Rebuilds dummy's product line from its spec, recomputes every proof_sha and requires
        # the pinned one (factories/dummy/pinned_verdict.json). Deviation in ANY direction = red
        # (a spontaneous PASS without proof is façade, not improvement).
        run: ./meta ci --rederive --factory dummy
