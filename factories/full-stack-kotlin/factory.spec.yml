# full-stack-kotlin.factory.spec.yml — Full-Stack Kotlin/TS/PG Factory (BLUEPRINT, status: planned).
# Una fábrica de grado-producción para apps web world-class bajo CRITERIOS DUROS DE INGENIERÍA.
# Autoridad del diseño + handoff de build: docs/work/FULLSTACK-KOTLIN-INCREMENT.md (leelo PRIMERO).
#
# Pila (PLAN, ADR-012 — NUNCA hardcodear en src/metafactory/): Kotlin (JVM) backend · TypeScript/React
# frontend · PostgreSQL + jOOQ (SQL chequeado en compilación) + Flyway (migraciones versionadas).
# Contrato OpenAPI como FUENTE ÚNICA → stubs Kotlin + client TS generados (drift imposible).
#
# Este spec PASA `validate` + `design-review` (exit 0): es un blueprint de diseño COMPLETO (13 primitivas
# requeridas, cada una con una tech; cada requisito con un verifier real). NADA está `built` todavía: el
# motor lo construye por incrementos, estación por estación, probado por bloqueo (SAFE-7). El próximo
# orquestador rellena los `builds`/`checks` ejecutables y sube `status` a `built` SÓLO con `proof` real.

# ── L0 · identidad ──
factory:
  name: "Full-Stack Kotlin/TS/PG Factory"
  slug: full-stack-kotlin
  maturity: skeleton

# ── L1 · dominio ──
domain:
  produces: >-
    una app web full-stack de grado-producción: contrato OpenAPI tipado como fuente única, backend Kotlin,
    frontend TypeScript/React, base de datos PostgreSQL con esquema versionado (Flyway) y queries chequeados
    en compilación (jOOQ), verificada ENTERA en su propio toolchain bajo criterios duros de ingeniería
    (dureza estática, frescura de API, seguridad de la cadena de suministro, calidad de experiencia,
    observabilidad), 100%-generada desde este spec.
  target_framework: { name: kotlin, provider_agnostic: true }

  # Las primitivas DES que ESTE dominio requiere (paso 2 del skill). design-review exige una tech por cada
  # una (abajo, en capabilities) y un verifier por cada requisito (L5). DES-10..13 las destapó este dominio.
  required_primitives: [DES-1, DES-2, DES-3, DES-4, DES-5, DES-6, DES-7, DES-8, DES-9, DES-10, DES-11, DES-12, DES-13]

  # Blueprint del PRODUCTO de ejemplo — lo lee el codegen (factories/full-stack-kotlin/codegen/, ADR-012).
  # Representativo: una app de gestión (User/Project/Task) con relaciones. El codegen real es del build.
  product:
    package_name: webapp
    api_title: "Project Tracker API"
    entities:
      - name: User
        fields:
          - { name: email, type: string, unique: true }
          - { name: name, type: string }
      - name: Project
        fields:
          - { name: name, type: string }
          - { name: owner_id, type: ref, to: User }
      - name: Task
        fields:
          - { name: title, type: string }
          - { name: done, type: boolean }
          - { name: project_id, type: ref, to: Project }

  # Restricciones — dónde esta pila es INSEGURA para un dominio (DATA hoy; darle dientes M0 = incremento
  # de sustrato futuro chico, ver INCREMENT §8). El producto no debe planearse para estos dominios.
  constraints:
    excluded_domains:
      - { domain: "tiempo-real-duro / safety-critical", reason: "el GC del JVM no da latencia determinista", future_factory: "Rust/Ada/C" }
      - { domain: "ML / numérico pesado / entrenamiento", reason: "ecosistema equivocado para JVM/TS", future_factory: "Python/C++/CUDA" }
      - { domain: "embebido / kernel / drivers", reason: "necesita sin-GC", future_factory: "Rust/C (parte: IoT-Go)" }
      - { domain: "mobile nativo (UI iOS/Android)", reason: "esto es web full-stack", future_factory: "Mobile-Factory" }
      - { domain: "HFT / ultra-baja-latencia", reason: "el GC es inaceptable", future_factory: "C++/Rust" }
      - { domain: "smart contracts / on-chain", reason: "VM y lenguaje distintos", future_factory: "Solidity/Move" }
      - { domain: "big-data ETL / streaming pesado", reason: "runtime distinto", future_factory: "Spark/dbt (data-pipeline)" }
    affirmative_fit: "apps web transaccionales/CRUD, dashboards, SaaS, herramientas internas, APIs de negocio"

  # Capabilities (L1): cada una con su primitiva DES + la tech que el PLAN eligió. status: planned (nada
  # construido aún). El `artifact` y el `proof` documentan el objetivo del build (la hoja del árbol C4).
  capabilities:
    - id: andamiaje_regenerable
      invariant: "el producto entero es derivable de este spec; regenerar es idempotente (100%-generado, sin código humano que proteger)"
      primitive: DES-1
      tech: "OpenAPI-codegen + Gradle/npm desde el blueprint (domain.product); scaffolder determinista en factories/full-stack-kotlin/codegen/"
      artifact: build/product/openapi.yaml
      proof: "s0: regenerar desde el spec produce un árbol idéntico (idempotente); un blueprint incompleto → s0 rojo"
      status: built
    - id: contrato_tipado_fuente_unica
      invariant: "el contrato OpenAPI es la FUENTE ÚNICA; el server Kotlin y el client TS se generan de ahí y un drift de tipos rompe la compilación de ambos lados"
      primitive: DES-6
      tech: "OpenAPI → stubs Kotlin (server) + client TS generado; kotlinc + tsc --strict sobre lo generado"
      artifact: build/product/openapi.yaml
      proof: "s0: kotlinc + tsc --strict verdes sobre el código generado del contrato; cambiar el contrato sin regenerar un lado → rojo"
      status: built
    - id: aislamiento_producto
      invariant: "el producto corre en SU propio toolchain (Gradle/npm), aislado del de la fábrica; importar la fábrica dentro del product_env falla (DES-9, SAFE-2)"
      primitive: DES-9
      tech: "workspace Gradle + workspace npm propios; env scrubbed (sin PYTHONPATH/clases de la fábrica)"
      artifact: build/product/settings.gradle.kts
      proof: "s0: el build del producto corre con su toolchain; un intento de cargar la fábrica adentro → rojo"
      status: built
    - id: datos_esquema_chequeado
      invariant: "el esquema PostgreSQL está versionado (migraciones Flyway con prefijo de versión) y los queries se chequean contra el schema EN COMPILACIÓN: un query a una columna inexistente = error de compilación (la DB grita)"
      primitive: DES-12
      tech: "Flyway (migraciones versionadas) + jOOQ (tipos derivados del schema por DDLDatabase, sin DB viva — hermético); kotlinc falla ante un query a una columna inexistente"
      artifact: build/product/src/main/resources/db/migration/V1__init.sql
      proof: "s1 schema_checked: jOOQ DDLDatabase deriva los tipos de db/migration/*.sql + compileKotlin; borrar una columna usada → Unresolved reference (compile rojo); regen → verde"
      status: built
    - id: datos_durables_vivos
      invariant: "el PRODUCTO persiste/lee contra una PostgreSQL VIVA: un round-trip create+list del producto corre contra la DB levantada (no un mock); DB caída → rojo (DES-4, M8 del producto)"
      primitive: DES-4
      tech: "PostgreSQL real (contenedor pineado por digest) bajo infra_up; el cliente es un runner del PRODUCTO (Flyway migrate + jOOQ create/list) tipado al schema"
      artifact: build/product/src/main/kotlin/webapp/DbRoundTrip.kt
      proof: "s1 db_roundtrip_live: infra_up levanta PostgreSQL + bootstrapea el toolchain del producto; round-trip vivo + reversibilidad (Flyway clean); DB caída → rojo (diente de dos lados)"
      status: built
    - id: dureza_estatica
      invariant: "el código falla FUERTE por calidad: sin `any` (TS) ni warnings (Kotlin), exhaustividad obligatoria, complejidad acotada, errores no tragados — un escape-hatch → build rojo"
      primitive: DES-10
      tech: "detekt (+ reglas ktlint vía detekt-formatting) + `-Werror` (Kotlin) · ESLint strict + @typescript-eslint/no-explicit-any + ts-reset (TS)"
      artifact: build/product/config/detekt.yml
      proof: "s2: los linters corren en el toolchain del producto; introducir un `any` (TS)/excepción tragada (Kotlin) → rojo; el probe negativo embebido lo exige cada corrida"
      status: built
    - id: frescura_de_api
      invariant: "el código generado usa SÓLO superficie de API no-deprecada y pineada; un símbolo deprecado se bloquea de forma DETERMINISTA, sin LLM (I-3)"
      primitive: DES-11
      tech: "oráculo de superficie pineado (config/api-surface.lock: versiones pineadas + deny-list por versión) + linter determinista (tools/currency_lint.py, stdlib, sin LLM)"
      artifact: build/product/config/api-surface.lock
      proof: "s3: el linter de currency cruza el código contra el lock; usar un símbolo deprecado/fuera del pin → rojo; el probe sucio embebido DEBE morder cada corrida"
      status: built
    - id: seguridad_cadena_suministro
      invariant: "el producto no shippea dependencias con vulnerabilidades conocidas ni secretos hardcodeados — gateado DETERMINISTAMENTE en el toolchain del producto (sin red, sin LLM, I-3)"
      primitive: DES-13
      tech: "SBOM CycloneDX-lite de deps directas (sbom.json) + oráculo de advisories pineado (config/supply-chain.lock: coordinate@rango-vulnerable→CVE por ecosistema + patrones de secretos) + scanner determinista stdlib (tools/supply_chain_scan.py); el feed vivo OSV/npm-audit y el SBOM transitivo quedan declared-deferred"
      artifact: build/product/sbom.json
      proof: "s4 supply_chain_gate: el scanner cruza el SBOM vs advisories + escanea secretos → 0; una dep en rango vulnerable (postgresql<42.7.2/CVE-2024-1597) o un secreto (AKIA…) → rojo; el probe sucio embebido DEBE morder cada corrida (diente de dos lados, fail-closed)"
      status: built
    - id: rutas_protegidas
      invariant: "ninguna ruta protegida por el contrato se alcanza sin pasar por el guard de auth (punto de control no-salteable, verificado por alcanzabilidad estática sobre el árbol de rutas declarado)"
      primitive: DES-3
      tech: "guard de auth (auth/AuthGuard.kt) + registro de rutas (routes/RouteTable.kt: las escrituras dentro de authenticated{}); analizador estático determinista (tools/route_check.py modo auth, stdlib, sin levantar server) cruza las rutas Kotlin contra el contrato. Ktor server vivo = declared-deferred (s7/s9)"
      artifact: build/product/src/main/kotlin/webapp/auth/AuthGuard.kt
      proof: "s5 auth_reachability: route_check.py (auth) exige que toda op con `security` en el contrato esté dentro de authenticated{}; rerutear un POST fuera del guard → UNGUARDED (rojo); el probe sucio embebido DEBE morder cada corrida (fail-closed)"
      status: built
    - id: topologia_rutas_verificable
      invariant: "el mapa de rutas es chequeable estáticamente contra el contrato OpenAPI (sin levantar el server): una ruta sin contrato o un contrato sin ruta → rojo"
      primitive: DES-2
      tech: "analizador estático determinista (tools/route_check.py modo topology, stdlib) que extrae las rutas Kotlin por tokens y las cruza contra openapi.yaml (fuente única, DES-6)"
      artifact: build/product/src/main/kotlin/webapp/routes/RouteTable.kt
      proof: "s5 route_topology: route_check.py (topology) exige set(rutas) == set(contrato); una ruta sin contrato → EXTRA / un contrato sin ruta → MISSING (rojo); el probe sucio embebido DEBE morder cada corrida (fail-closed)"
      status: built
    - id: logica_dominio_generada
      invariant: "la lógica de negocio se GENERA por un LLM vivo (claude -p, slot generate) y un contract test la EJERCITA en el toolchain del producto; un stub no pasa (el anti-patrón de domain vacío de F1 bloquea); el artefacto se pinea (§7) y re-derive lo verifica sin LLM"
      primitive: DES-8
      tech: "claude -p (slot generate, ADR-013) como `via` (wrapper codegen/gen_llm.py); contract gate = un main() de aserciones corrido por gradle `run` (idiom JavaExec del producto, igual que roundtrip s1); el módulo domain_gen vive decoupleado de build/product (tracked) → el LLM-artefacto Summary.kt se pinea (skip_if_exists). Kotest+Testcontainers+Playwright = pirámide s7 (declared-deferred, ADR-012)"
      artifact: domain_gen/src/main/kotlin/domain/Summary.kt
      proof: "s6: gradle run compila Model.kt + el Summary.kt GENERADO + SummaryContract.kt y corre el contract main; un stub o una implementación incorrecta → rojo; pin re-verificado sin LLM"
      status: built
    - id: pruebas_piramidales
      invariant: "la verificación corre en el toolchain DEL producto en una pirámide: unit + integración (DB viva) + contrato + e2e; un test roto bloquea"
      primitive: DES-8
      tech: "Kotest (unit) + Testcontainers (integración PG) + el contrato OpenAPI + Playwright (e2e)"
      artifact: build/product/src/test/
      proof: "s7: la pirámide corre verde en el toolchain del producto; romper cualquier nivel → rojo"
      status: planned
    - id: calidad_experiencia
      invariant: "la accesibilidad (WCAG) y la performance se miden con gates que BLOQUEAN bajo umbral"
      primitive: DES-7
      tech: "axe-core (a11y) + Lighthouse CI (perf budget) + presupuesto de bundle-size"
      artifact: build/product/lighthouserc.json
      proof: "s8: los gates corren; un score a11y/perf bajo el presupuesto → rojo; un output degradado debe flipear el gate"
      status: planned
    - id: observabilidad_producto
      invariant: "el producto EMITE observabilidad: logs estructurados + tracing OTel con correlation-id + endpoints /health y /ready; verificado que emite (no que renderiza)"
      primitive: DES-5
      tech: "logs estructurados (JSON) + OpenTelemetry (tracing) + /health·/ready"
      artifact: build/product/src/main/kotlin/observability/
      proof: "s9: una request produce un trace con correlation-id y un log estructurado; /health responde; quitar la instrumentación → rojo"
      status: planned
    - id: build_hermetico_reproducible
      invariant: "el build es hermético y reproducible: toolchain pineado; re-derivar en clon limpio da un resultado idéntico; el producto shippea su propia mini-columna (CI que re-corre los gates)"
      primitive: DES-1
      tech: "Gradle wrapper pineado + npm lockfile + imagen Docker base pineada; CI del producto que re-corre los gates"
      artifact: build/product/Dockerfile
      proof: "s10: ci --rederive reconstruye idéntico en clon limpio (== pineado); el CI del producto re-corre todos los gates verdes"
      status: planned

  # La LÍNEA DE PRODUCTO como DATO (C2/I-2). status: planned — los `builds`/`checks` ejecutables los
  # rellena el build (plantilla: specs/full-stack.factory.spec.yml). Acá se declara el CONTRATO SDD
  # (proof_checks) que los requisitos citan en verified_by. depends_on arma el DAG; s10 es fan-in (P2/H2).
  station_sequence:
    - id: s0
      name: "scaffold + contrato OpenAPI (fuente única) + aislamiento — DES-1/6/9"
      activation: always
      status: built
      proof_checks:
        - { name: contract_single_source, cmd: "kotlinc + tsc --strict sobre el código generado del contrato; drift → rojo", runs_in: product_env, toolchain: "openapi-codegen", status: built }
        - { name: scaffold_idempotent, cmd: "regenerar desde el spec produce un árbol idéntico", runs_in: factory_env, toolchain: "metafactory", status: built }
        - { name: isolation_boundary, cmd: "el producto corre en su toolchain; cargar la fábrica adentro → rojo", runs_in: product_env, toolchain: "gradle-npm", status: built }
      builds:
        - action: generate
          dest: build/product/MANIFEST.txt
          brief: "Generá el producto Full-Stack Kotlin en build/product/ desde domain.product: openapi.yaml (contrato fuente única), build Gradle pineado con openApiGenerate (models Kotlin), handler+app que usan los models, client TS con openapi-typescript, wrapper Gradle vendorizado. compileKotlin y tsc --strict deben pasar."
          via: [python3, codegen/scaffold_product.py]
      checks:
        - name: contract_single_source
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) ./gradlew compileKotlin -q --console=plain"]
        - name: contract_client_ts
          kind: product_env
          workdir: build/product/frontend
          bootstrap: [npm, install, --no-audit, --no-fund, --loglevel=error]
          cmd: ["sh", "-c", "./node_modules/.bin/openapi-typescript ../openapi.yaml -o gen/api.ts && ./node_modules/.bin/tsc -p tsconfig.json"]
        - name: scaffold_idempotent
          kind: command
          cmd: [python3, codegen/scaffold_product.py, --check-idempotent]
        - name: isolation_boundary
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "python3 -c 'import metafactory' 2>/dev/null && { echo LEAK; exit 1; } || exit 0"]
    - id: s1
      name: "capa de datos: schema versionado (Flyway) + jOOQ tipado (DES-12) + PostgreSQL VIVA por infra_up (DES-4)"
      activation: always
      depends_on: [s0]
      # DES-12 hermético: jOOQ (DDLDatabase) deriva los tipos del schema versionado db/migration/*.sql y
      # compileKotlin gatea — un drift de columna → Unresolved reference (sin DB viva). DES-4: el round-trip
      # del PRODUCTO (Flyway migrate + jOOQ create/list) corre contra una PostgreSQL VIVA (contenedor pineado
      # por digest) que infra_up levanta; DB caída → rojo (diente de dos lados, MAT-3). El codegen (s0) ya
      # emite migración + Repository + DbRoundTrip → builds: [] (la estación sólo PRUEBA).
      proof_checks:
        - { name: schema_checked, cmd: "jooqCodegen (DDLDatabase de db/migration/*.sql) + compileKotlin; un drift de columna → Unresolved reference", runs_in: product_env, toolchain: "jooq-kotlinc", status: built }
        - { name: db_roundtrip_live, cmd: "round-trip create+list del producto (Flyway+jOOQ) contra PostgreSQL viva; DB caída → rojo", runs_in: product_env, toolchain: "gradle-postgres", status: built }
      builds: []
      checks:
        - name: schema_checked
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) ./gradlew jooqCodegen compileKotlin -q --console=plain"]
        - name: db_roundtrip_live
          kind: infra_up
          workdir: build/product
          bootstrap: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) exec ./gradlew classes -q --console=plain"]
          up: ["sh", "-c", "docker rm -f fsk_s1_pg >/dev/null 2>&1; exec docker run --rm --name fsk_s1_pg -e POSTGRES_PASSWORD=metafactory -p 55434:5432 postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb"]
          proof: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) exec ./gradlew roundtrip -q --console=plain"]
          down: ["docker", "rm", "-f", "fsk_s1_pg"]
          timeout: 120
    - id: s2
      name: "dureza estática: detekt (+ reglas ktlint) + `-Werror` (Kotlin) · ESLint strict + no-explicit-any + ts-reset (TS) — DES-10"
      activation: always
      depends_on: [s1]
      # DES-10 — el producto falla FUERTE por CALIDAD (no sólo tipos). Kotlin: detekt corre el análisis de
      # calidad + las reglas ktlint (detekt-formatting, UN tool) sobre el código AUTORADO (src/main/kotlin;
      # los fuentes generados openapi/jOOQ quedan fuera por construcción) con maxIssues:0, y `-Werror`
      # (allWarningsAsErrors) vuelve error TODO warning de kotlinc. TS: ESLint strict + no-explicit-any sobre
      # src/ (gen/ fuera). Cada check lleva su DIENTE NEGATIVO EMBEBIDO (no-decorativo, cada corrida): el MISMO
      # linter sobre un fixture sucio (probe/, fuera de src → no se shippea) DEBE morder — se exige el hallazgo
      # por grep (SwallowedException / no-explicit-any), fail-closed. El codegen (s0) ya emite la config + los
      # probes → builds: [] (la estación sólo PRUEBA). Sustrato intacto: product_env corre DATA (ADR-012).
      proof_checks:
        - { name: static_hardness_kotlin, cmd: "detekt (maxIssues:0) + compileKotlin (-Werror) sobre el producto; detektProbe sobre probe/ DEBE morder (SwallowedException) o decorativo→rojo", runs_in: product_env, toolchain: "detekt-kotlinc", status: built }
        - { name: static_hardness_ts, cmd: "eslint strict+no-explicit-any sobre src/; eslint sobre probe/ DEBE morder (no-explicit-any) o decorativo→rojo", runs_in: product_env, toolchain: "eslint", status: built }
      builds: []
      checks:
        - name: static_hardness_kotlin
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "JH=$(dirname $(dirname $(readlink -f $(command -v javac)))); JAVA_HOME=$JH ./gradlew detekt compileKotlin -q --console=plain || exit 1; JAVA_HOME=$JH ./gradlew detektProbe --console=plain 2>&1 | grep -q SwallowedException || { echo FSK_HARDNESS_DECORATIVE_KOTLIN; exit 1; }; echo FSK_HARDNESS_OK_KOTLIN"]
        - name: static_hardness_ts
          kind: product_env
          workdir: build/product/frontend
          bootstrap: ["npm", "install", "--no-audit", "--no-fund", "--loglevel=error"]
          cmd: ["sh", "-c", "./node_modules/.bin/eslint 'src/**/*.ts' || exit 1; ./node_modules/.bin/eslint 'probe/**/*.ts' 2>&1 | grep -q no-explicit-any || { echo FSK_HARDNESS_DECORATIVE_TS; exit 1; }; echo FSK_HARDNESS_OK_TS"]
    - id: s3
      name: "frescura de API: oráculo de superficie pineado + linter determinista (sin LLM) — DES-11"
      activation: always
      depends_on: [s2]
      # DES-11 — el código generado usa SÓLO superficie no-deprecada y pineada; lo viejo se bloquea de forma
      # DETERMINISTA (I-3, sin LLM). El codegen (s0) emite el ORÁCULO config/api-surface.lock (versiones
      # pineadas + deny-list de símbolos deprecados/stale por versión) + el linter stdlib tools/currency_lint.py
      # (parte de la mini-columna del PRODUCTO, s10) → builds: [] (la estación sólo PRUEBA). UN linter
      # language-agnostic cruza Kotlin (src/main/kotlin) Y TS (frontend/src) contra UN lock — el anti-overfit
      # más fuerte (un mecanismo general por DATA, dos lenguajes). Eje DISTINTO de s2 (calidad): acá frescura;
      # cubre lo que el compilador CALLA (java.util.Date legacy en Kotlin; .substr() en TS). Diente NEGATIVO
      # EMBEBIDO (no-decorativo, cada corrida): el MISMO linter sobre fixtures sucios (probe/currency,
      # frontend/probe-currency, FUERA de src → no se shippean) DEBE morder — se exige el hallazgo por grep
      # (toUpperCase Kotlin + substr TS), fail-closed. Sustrato intacto: product_env corre DATA (ADR-012).
      proof_checks:
        - { name: currency_gate, cmd: "el linter determinista cruza src/main/kotlin+frontend/src vs config/api-surface.lock → 0; sobre probe/currency+frontend/probe-currency DEBE morder (toUpperCase+substr) o decorativo→rojo", runs_in: product_env, toolchain: "currency-linter", status: built }
      builds: []
      checks:
        - name: currency_gate
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "python3 tools/currency_lint.py src/main/kotlin frontend/src || exit 1; out=$(python3 tools/currency_lint.py probe/currency frontend/probe-currency 2>&1); echo \"$out\" | grep -q toUpperCase || { echo FSK_CURRENCY_DECORATIVE_KOTLIN; exit 1; }; echo \"$out\" | grep -q substr || { echo FSK_CURRENCY_DECORATIVE_TS; exit 1; }; echo FSK_CURRENCY_OK"]
    - id: s4
      name: "seguridad de la cadena de suministro: SBOM + oráculo de advisories pineado + scanner determinista (sin red, sin LLM) — DES-13"
      activation: always
      depends_on: [s3]
      # DES-13 — el producto no shippea deps con vulnerabilidades conocidas ni secretos hardcodeados, gateado
      # de forma DETERMINISTA (I-3, sin red). El codegen (s0) emite el SBOM sbom.json (CycloneDX-lite de deps
      # directas), el ORÁCULO config/supply-chain.lock (advisories reales coordinate@rango→CVE + patrones de
      # secretos) y el scanner stdlib tools/supply_chain_scan.py (parte de la mini-columna del PRODUCTO, s10)
      # → builds: [] (la estación sólo PRUEBA). UN scanner general por DATA cubre DOS ejes: deps vulnerables
      # (cruza el SBOM vs los advisories) + secretos (escanea src/main/kotlin+frontend/src) — anti-overfit (un
      # mecanismo, dos ejes/ecosistemas). Eje DISTINTO de s2 (calidad) y s3 (frescura): acá seguridad de la
      # cadena. Diente NEGATIVO EMBEBIDO (no-decorativo, cada corrida): el MISMO scanner sobre fixtures sucios
      # (probe/security/vuln-sbom.json con lodash/postgresql@42.7.1; probe/security/leak.txt con AKIA…, FUERA de
      # src → no se shippean) DEBE morder — se exige el hallazgo por grep (lodash + aws-access-key), fail-closed.
      # Sustrato intacto: product_env corre DATA (ADR-012). Feed vivo (OSV/npm audit) + SBOM transitivo =
      # declared-deferred (mismo shape que el MCP-recall de s3).
      proof_checks:
        - { name: supply_chain_gate, cmd: "el scanner cruza sbom.json vs config/supply-chain.lock (deps) + escanea src/main/kotlin+frontend/src (secretos) → 0; sobre probe/security DEBE morder (lodash + aws-access-key) o decorativo→rojo", runs_in: product_env, toolchain: "supply-chain-scanner", status: built }
      builds: []
      checks:
        - name: supply_chain_gate
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "python3 tools/supply_chain_scan.py deps sbom.json || exit 1; python3 tools/supply_chain_scan.py secrets src/main/kotlin frontend/src || exit 1; dout=$(python3 tools/supply_chain_scan.py deps probe/security/vuln-sbom.json 2>&1); echo \"$dout\" | grep -q lodash || { echo FSK_SUPPLYCHAIN_DECORATIVE_DEPS; exit 1; }; sout=$(python3 tools/supply_chain_scan.py secrets probe/security 2>&1); echo \"$sout\" | grep -q aws-access-key || { echo FSK_SUPPLYCHAIN_DECORATIVE_SECRETS; exit 1; }; echo FSK_SUPPLYCHAIN_OK"]
    - id: s5
      name: "auth no-salteable + topología de rutas: guard (DES-3) + AST de rutas vs contrato (DES-2), estático sin levantar server"
      activation: always
      depends_on: [s4]
      # DES-3/DES-2 — el producto gana DOS gates de rutas, ambos ESTÁTICOS (sin levantar HTTP) y DETERMINISTAS
      # (I-3, sin LLM, sin red). El codegen (s0) emite el guard auth/AuthGuard.kt + el registro routes/
      # RouteTable.kt (Kotlin REAL: las escrituras dentro de authenticated{} → guarded) + el analizador stdlib
      # tools/route_check.py (parte de la mini-columna del PRODUCTO, s10) → builds: [] (la estación sólo PRUEBA).
      # UN analizador general por DATA cubre DOS ejes: alcanzabilidad de auth (toda op con `security` en el
      # contrato está dentro del guard) + topología (set de rutas == contrato). El contrato openapi.yaml es la
      # FUENTE de "qué está protegido" (DES-6). Eje DISTINTO de s2/s3/s4 (calidad/frescura/seguridad-de-cadena):
      # acá RUTAS. Diente NEGATIVO EMBEBIDO (no-decorativo, cada corrida): el MISMO analizador sobre fixtures
      # sucios (probe/routes/phantom.kt con una ruta sin contrato; probe/routes/unguarded.kt con un POST fuera
      # del guard, FUERA de src → no se shippean) DEBE morder — se exige el hallazgo por grep (EXTRA + UNGUARDED),
      # fail-closed. Sustrato intacto: product_env corre DATA (ADR-012). Ktor server vivo + e2e = declared-deferred
      # (s7 pirámide / s9 observabilidad), mismo shape que el feed-vivo diferido de s4.
      proof_checks:
        - { name: auth_reachability, cmd: "route_check.py (auth) exige que toda op con `security` en el contrato esté dentro de authenticated{}; un POST fuera del guard → UNGUARDED; sobre probe/routes/unguarded.kt DEBE morder (UNGUARDED) o decorativo→rojo", runs_in: product_env, toolchain: "route-analyzer", status: built }
        - { name: route_topology, cmd: "route_check.py (topology) exige set(rutas Kotlin) == set(contrato openapi.yaml); ruta sin contrato → EXTRA / contrato sin ruta → MISSING; sobre probe/routes/phantom.kt DEBE morder (EXTRA) o decorativo→rojo", runs_in: product_env, toolchain: "route-analyzer", status: built }
      builds: []
      checks:
        - name: auth_reachability
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "python3 tools/route_check.py auth openapi.yaml src/main/kotlin || exit 1; out=$(python3 tools/route_check.py auth openapi.yaml probe/routes/unguarded.kt 2>&1); echo \"$out\" | grep -q UNGUARDED || { echo FSK_AUTH_DECORATIVE; exit 1; }; echo FSK_AUTH_OK"]
        - name: route_topology
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "python3 tools/route_check.py topology openapi.yaml src/main/kotlin || exit 1; out=$(python3 tools/route_check.py topology openapi.yaml probe/routes/phantom.kt 2>&1); echo \"$out\" | grep -q EXTRA || { echo FSK_TOPOLOGY_DECORATIVE; exit 1; }; echo FSK_TOPOLOGY_OK"]
    - id: s6
      name: "lógica de dominio GENERADA por claude -p (LLM vivo) bajo contract test Kotlin — DES-8 (patrón MAT-2)"
      activation: always
      depends_on: [s5]
      # DES-8 — la lógica de NEGOCIO la GENERA un LLM vivo (claude -p, slot generate, ADR-013, wrapper
      # codegen/gen_llm.py) y un contract test la EJERCITA en el toolchain del producto (Kotlin/gradle). El
      # módulo domain_gen/ vive DECOUPLEADO de build/product/ (tracked, factory root) → s2/s3/s4/s5 (que
      # escanean src/main/kotlin+frontend/src DENTRO del producto) NO lo tocan; el LLM-artefacto Summary.kt se
      # PINEA (skip_if_exists ⇒ committeado = fuente) y ci --rederive lo re-verifica SIN re-invocar al LLM (§7):
      # determinismo en la VERIFICACIÓN, no en la generación (I-3). Un stub no pasa el contract test (el
      # anti-patrón de domain vacío de F1 BLOQUEA). El modelo (Model.kt), el contract (SummaryContract.kt) y el
      # build gradle se EMITEN deterministas (write); el ÚNICO artefacto no-determinista es Summary.kt. El LLM
      # genera la LÓGICA; los TIPOS son el contrato fijo (robustez + foco DES-8). Divergencia de tech registrada
      # (ADR-012): el diseño §5 dijo "Kotest"; el contract gate es un main() de aserciones corrido por gradle
      # `run` (el MISMO idiom JavaExec que el producto usa para `roundtrip`, s1) — sin sumar un framework de test
      # (Kotest = dep pesada a vetar en el SBOM de s4). La pirámide Kotest+Testcontainers+Playwright queda
      # declared-deferred (s7), mismo shape que Ktor→estático de s5. Sustrato intacto: el seam generate (C1) y el
      # check product_env (C3, ya general) corren DATA (ADR-012) — git diff src/+seed = 0 (composición, MAT-2).
      proof_checks:
        - { name: domain_logic_contract, cmd: "gradle run en domain_gen: compila Model.kt + el Summary.kt GENERADO por claude -p + SummaryContract.kt y corre el contract main(); un stub o lógica incorrecta → rojo; el pin (skip_if_exists) se re-verifica sin LLM (§7)", runs_in: product_env, toolchain: "kotlin-gradle", status: built }
      builds:
        - action: write
          dest: domain_gen/settings.gradle.kts
          content: |
            rootProject.name = "domain_gen"
        - action: write
          dest: domain_gen/build.gradle.kts
          content: |
            // domain_gen — módulo Kotlin AUTOCONTENIDO (decoupleado de build/product) que ejercita la lógica
            // de dominio GENERADA por el LLM (Summary.kt) bajo un contract test. Mismas versiones que el
            // producto (Kotlin 2.4.0 / gradle 9.5.1 / JDK 21) → cache de ~/.gradle caliente → ci --rederive
            // sin red. application/run corre el main() del contract (idiom JavaExec, igual que `roundtrip` s1).
            plugins {
                kotlin("jvm") version "2.4.0"
                application
            }
            repositories { mavenCentral() }
            // -Werror (dureza, DES-10): la lógica LLM-generada compila bajo la MISMA barra que el producto.
            kotlin {
                jvmToolchain(21)
                compilerOptions { allWarningsAsErrors = true }
            }
            application { mainClass.set("domain.SummaryContractKt") }
        - action: write
          dest: domain_gen/src/main/kotlin/domain/Model.kt
          content: |
            package domain

            /** Una tarea de un proyecto (espejo del dominio Task del blueprint domain.product). */
            data class Task(val title: String, val done: Boolean)

            /** Estado de avance de un proyecto. sealed ⇒ el `when` que lo consume es exhaustivo (dureza, DES-10). */
            sealed interface ProjectStatus {
                data object NotStarted : ProjectStatus
                data object InProgress : ProjectStatus
                data object Completed : ProjectStatus
            }

            /** Resumen de avance derivado de las tareas de un proyecto (lo que `summarize` produce). */
            data class ProjectSummary(
                val total: Int,
                val done: Int,
                val pending: List<String>,
                val status: ProjectStatus,
            )
        - action: write
          dest: domain_gen/src/main/kotlin/domain/SummaryContract.kt
          content: |
            package domain

            import kotlin.system.exitProcess

            /** El contract test (DES-8): EJERCITA la lógica generada (summarize). Un stub o una implementación
             *  incorrecta hace exitProcess(1) → gradle `run` rojo. Es el tooth de MAT-2: domain vacío BLOQUEA. */
            private fun ensure(cond: Boolean, msg: String) {
                if (!cond) {
                    System.err.println("CONTRACT FAIL: $msg")
                    exitProcess(1)
                }
            }

            fun main() {
                val mixed = listOf(
                    Task("disenar el schema", true),
                    Task("implementar el handler", false),
                    Task("documentar la API", false),
                )
                val s = summarize(mixed)
                ensure(s.total == 3, "total esperado 3, fue ${s.total}")
                ensure(s.done == 1, "done esperado 1, fue ${s.done}")
                ensure(
                    s.pending == listOf("implementar el handler", "documentar la API"),
                    "pending order: ${s.pending}",
                )
                ensure(s.status == ProjectStatus.InProgress, "status esperado InProgress, fue ${s.status}")

                val empty = summarize(emptyList())
                ensure(empty.total == 0 && empty.done == 0 && empty.pending.isEmpty(), "empty counts: $empty")
                ensure(empty.status == ProjectStatus.NotStarted, "empty status: ${empty.status}")

                val allDone = summarize(listOf(Task("a", true), Task("b", true)))
                ensure(allDone.status == ProjectStatus.Completed, "allDone status: ${allDone.status}")
                ensure(allDone.pending.isEmpty(), "allDone pending: ${allDone.pending}")

                val noneDone = summarize(listOf(Task("x", false), Task("y", false)))
                ensure(noneDone.status == ProjectStatus.NotStarted, "noneDone status: ${noneDone.status}")
                ensure(noneDone.pending == listOf("x", "y"), "noneDone pending: ${noneDone.pending}")

                println("FSK_DOMAIN_CONTRACT_OK")
            }
        - action: generate
          dest: domain_gen/src/main/kotlin/domain/Summary.kt
          skip_if_exists: true
          brief: |
            Generá UN archivo Kotlin (package `domain`) con la lógica de resumen de avance de un proyecto.
            NO redefinas los tipos: el archivo Model.kt (mismo package `domain`) YA define, y los usás tal cual:
              data class Task(val title: String, val done: Boolean)
              sealed interface ProjectStatus { data object NotStarted; data object InProgress; data object Completed }
              data class ProjectSummary(val total: Int, val done: Int, val pending: List<String>, val status: ProjectStatus)
            Implementá EXACTAMENTE esta función pública (misma firma):
              fun summarize(tasks: List<Task>): ProjectSummary
            Contrato (cumplilo al pie):
              - total   = cantidad total de tareas.
              - done    = cantidad de tareas con done == true.
              - pending = los `title` de las tareas con done == false, EN EL ORDEN de entrada.
              - status  = ProjectStatus.NotStarted  si done == 0
                          ProjectStatus.Completed   si total > 0 && done == total
                          ProjectStatus.InProgress  en cualquier otro caso
            Requisitos del código:
              - La PRIMERA línea debe ser exactamente: package domain
              - Sin imports externos ni dependencias; Kotlin idiomático que compile con `kotlinc -Werror`
                (sin warnings, sin imports ni variables sin usar, sin `when` no-exhaustivo).
              - Referenciá ProjectStatus.NotStarted / InProgress / Completed por su nombre completo.
            Salida: SOLO el código Kotlin del archivo. NADA de explicaciones ni fences markdown.
          via: ["python3", "codegen/gen_llm.py"]
      checks:
        - name: domain_logic_contract
          kind: product_env
          workdir: domain_gen
          bootstrap: []
          cmd: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) ./gradlew run -q --console=plain || exit 1; echo FSK_DOMAIN_OK"]
    # s7–s10 DIFERIDAS (se construyen por incremento, "capacidad por capacidad"). La línea COMPLETA con su
    # DAG, proof_checks y DES por estación vive en docs/work/FULLSTACK-KOTLIN-INCREMENT.md §6 (autoridad) y en
    # git @ c318aaf (la spec de DISEÑO). Cada futuro incremento RE-AÑADE su estación acá (activa + built) con
    # su depends_on y sus requirements. El spec buildable refleja lo CONSTRUIDO (SAFE-7), no la aspiración.

  provision_modes: [scaffold]
  proof_check_types: [product_env, infra_up, eval_gate]

# ── L3 · MAQUINARIA: declarada como DATO (ADR-012), status declared-deferred (especificada; su emit/codegen
# lo hace el build). La COLUMNA (Cerrojos 1/2/3 + settings) NO va acá: es L4 substrate, heredada verbatim. ──
machinery:
  harness:
    tech: "Claude Code: agents (writer/reviewer/triage con sombras deterministas) + commands + skills, emitidos del spec (D2)"
    primitive: DES-1
    status: built
    agents:
      - name: writer
        description: "Escribe DIFFs acotados de la fábrica full-stack-kotlin (implementación, no decisiones)."
        model: sonnet
        tools: [Read, Edit, Write, Bash, Grep, Glob]
        shadows:
          - { prohibits: "no escribe ni edita veredictos en .proof/", shadow: ".claude/hooks/proof_protect.py" }
          - { prohibits: "no declara verde: passed lo computa SOLO el verifier desde exit codes", shadow: "seed/verifier.py" }
          - { prohibits: "no commitea un veredicto corrupto/no probado (la activa recompone verde)", shadow: ".claude/hooks/commit_guard.py" }
          - { prohibits: "no cierra el turno con la activa tampereada o roja", shadow: ".claude/hooks/stop_proof.py" }
        body: |
          # writer — el slot de implementación de la fábrica {{slug}}
          Recibís un DIFF a producir (no una decisión). Trabajás contra la línea y dejás que la gate sea la
          autoridad: nunca afirmás verde, lo demostrás.
          ## Qué NO hacés (con sombra determinista, no prosa)
          - No tocás `.proof/` (sombra: proof_protect). No declarás "pasa" (sombra: verifier.py).
          - No commitees trabajo no probado ni cerrás con la activa rota (sombras: commit_guard, stop_proof).
      - name: reviewer
        description: "Revisa DIFFs que tocan la cadena de confianza; no aprueba sin re-derivar."
        model: opus
        tools: [Read, Bash, Grep, Glob]
        shadows:
          - { prohibits: "no aprueba sin que el CI externo re-derive la línea (dos verificadores)", shadow: "seed/external_ci.yml" }
          - { prohibits: "no declara verde: el verifier es la única autoridad del proof_sha", shadow: "seed/verifier.py" }
        body: |
          # reviewer — revisión de la cadena de confianza de {{slug}}
          Recibís un DIFF que toca verifier/hooks/seed/gates. Revisás con ojos propios; nunca emitís un
          veredicto — reportás evidencia re-derivada y delegás el juicio al orquestador.
      - name: triage
        description: "Triage de un log rojo: causa raíz en ≤5 líneas. Solo lectura."
        model: haiku
        tools: [Read, Bash, Grep, Glob]
        shadows:
          - { prohibits: "no escribe ni edita artefactos de prueba en .proof/", shadow: ".claude/hooks/proof_protect.py" }
        body: |
          # triage — diagnóstico rápido de log rojo en {{slug}}
          Recibís un log de gate rojo. Tu único producto es una causa raíz en ≤5 líneas. No arreglás, no
          aprobás, no escribís.
    commands:
      - name: gen-check
        description: "Corre el selftest del codegen del producto (parsea el blueprint, lista los archivos; no escribe)."
        run: ["python3", "codegen/scaffold_product.py", "--selftest"]
        body: |
          # /gen-check — verificá el codegen de la fábrica {{slug}}
          Corré el selftest del scaffolder: parsea el blueprint (domain.product) y lista los archivos del
          producto que emitiría. Exit 0 = el generador es invocable y el blueprint está completo.
    skills:
      - name: verificar-fabrica
        description: "Cómo re-verificar la fábrica por bloqueo (no por prosa)."
        body: |
          # verificar — re-verificá {{slug}} por bloqueo
          Corré `meta product-run --factory {{slug}}` y leé el bus de veredictos (≤ max_lines), nunca el
          dump de tests. Los dos verificadores: `meta ci --rederive --factory {{slug}}`.
  mcp:
    tech: "server MCP de recall scopeado al PIN (Context7-tuneado): SÓLO los docs de las versiones pineadas de Kotlin/Ktor/jOOQ/React/etc., recall bajo demanda (E2); alimenta el oráculo de currency (DES-11)"
    primitive: DES-11
    status: declared-deferred
  infra:
    tech: "PostgreSQL real vía Testcontainers (docker) bajo infra_up; health por reintento, teardown SIEMPRE (E1/MAT-3)"
    primitive: DES-9
    status: declared-deferred
    services:
      - { name: postgres, kind: container, endpoint: "tcp:5432", marker: PG_UP }

# ── L4 · sustrato (heredado verbatim, no negociable) ──
factory_substrate:
  anti_rubber_stamp_column: true
  verdict_bus: { max_lines: 10 }
  generated_domain_boundary: false   # 100%-generado (ADR-011): sin código humano → boundary opta-out (H2)
  memory_schema: adr021
  rtm: { required: true }
  two_verifier_ci: { rederive: true, pinned_verdict: true }
  placement_law: true
  context_budget: { claude_md_max_lines: 120 }

# ── L5 · requisitos (espina SDD; id estable + satisfied_by a una estación activa + capability + verified_by) ──
requirements:
  functional:
    - id: REQ-F-001
      statement: "el contrato OpenAPI es la fuente única; server Kotlin y client TS se generan de ahí y un drift de tipos rompe la compilación (DES-6)"
      acceptance: "contract_single_source verde; un drift sin regenerar un lado → rojo"
      satisfied_by: [s0]
      verified_by: [contract_single_source]
      capability: contrato_tipado_fuente_unica
    - id: REQ-F-002
      statement: "el producto es 100%-generado desde el spec y regenerar es idempotente (DES-1)"
      acceptance: "scaffold_idempotent verde; regenerar produce un árbol idéntico"
      satisfied_by: [s0]
      verified_by: [scaffold_idempotent]
      capability: andamiaje_regenerable
    - id: REQ-F-003
      statement: "el esquema PostgreSQL está versionado (Flyway) y los queries son chequeados EN COMPILACIÓN por jOOQ: un query a una columna inexistente = compile error (DES-12)"
      acceptance: "schema_checked verde; borrar una columna usada por un query → Unresolved reference (compile rojo); regen → verde"
      satisfied_by: [s1]
      verified_by: [schema_checked]
      capability: datos_esquema_chequeado
    - id: REQ-F-004
      statement: "el producto persiste/lee contra una PostgreSQL VIVA (round-trip create+list); una DB caída lo pone en rojo (DES-4)"
      acceptance: "db_roundtrip_live verde contra la DB viva; con la DB caída el round-trip del producto → rojo (diente de dos lados)"
      satisfied_by: [s1]
      verified_by: [db_roundtrip_live]
      capability: datos_durables_vivos
    - id: REQ-F-005
      statement: "ninguna ruta protegida por el contrato se alcanza sin el guard de auth (punto de control no-salteable, verificado por alcanzabilidad estática, DES-3)"
      acceptance: "auth_reachability verde sobre las rutas autoradas; rerutear un POST fuera de authenticated{} → UNGUARDED (rojo); el probe sucio embebido DEBE morder cada corrida (UNGUARDED) o el gate es decorativo → rojo"
      satisfied_by: [s5]
      verified_by: [auth_reachability]
      capability: rutas_protegidas
    - id: REQ-F-006
      statement: "el mapa de rutas es chequeable estáticamente contra el contrato OpenAPI: una ruta sin contrato o un contrato sin ruta → rojo (DES-2)"
      acceptance: "route_topology verde (set de rutas == contrato); declarar una ruta sin contrato → EXTRA (rojo); el probe sucio embebido DEBE morder cada corrida (EXTRA) o el gate es decorativo → rojo"
      satisfied_by: [s5]
      verified_by: [route_topology]
      capability: topologia_rutas_verificable
    - id: REQ-F-007
      statement: "la lógica de dominio se GENERA por un LLM vivo (claude -p, slot generate) bajo contract test; un stub no pasa; el artefacto se pinea y re-derive lo verifica sin LLM (DES-8, MAT-2, §7)"
      acceptance: "domain_logic_contract verde sobre la lógica generada; un stub o lógica incorrecta → rojo; el pin (skip_if_exists) se re-verifica sin re-invocar al LLM"
      satisfied_by: [s6]
      verified_by: [domain_logic_contract]
      capability: logica_dominio_generada
    # REQ-F-008 DIFERIDA con s7–s10 (cada una se re-añade cuando su estación se construye). Texto
    # completo en docs/work/FULLSTACK-KOTLIN-INCREMENT.md y en git @ c318aaf (spec de DISEÑO).
  nonfunctional:
    - id: REQ-NF-001
      statement: "el producto corre aislado en su propio toolchain; importar la fábrica adentro falla (DES-9, SAFE-2)"
      acceptance: "isolation_boundary verde; cargar la fábrica en el product_env → rojo"
      satisfied_by: [s0]
      verified_by: [isolation_boundary]
      capability: aislamiento_producto
    - id: REQ-NF-002
      statement: "el código del producto falla FUERTE por calidad: detekt (+ ktlint) con maxIssues:0 y `-Werror` (Kotlin), ESLint strict + no-explicit-any (TS); un escape-hatch o un `any` → build rojo (DES-10)"
      acceptance: "static_hardness_kotlin y static_hardness_ts verdes sobre el producto; el probe sucio embebido DEBE morder cada corrida (SwallowedException / no-explicit-any) o el gate es decorativo → rojo"
      satisfied_by: [s2]
      verified_by: [static_hardness_kotlin, static_hardness_ts]
      capability: dureza_estatica
    - id: REQ-NF-003
      statement: "el código generado usa sólo superficie de API no-deprecada y pineada; lo viejo se bloquea de forma DETERMINISTA, sin LLM (DES-11, I-3)"
      acceptance: "currency_gate verde sobre el código autorado; un símbolo deprecado/fuera-de-pin → rojo; el probe sucio embebido DEBE morder cada corrida (toUpperCase / substr) o el gate es decorativo → rojo"
      satisfied_by: [s3]
      verified_by: [currency_gate]
      capability: frescura_de_api
    - id: REQ-NF-004
      statement: "el producto no shippea dependencias con vulnerabilidades conocidas ni secretos hardcodeados; un CVE conocido o un secreto → build rojo de forma DETERMINISTA, sin red ni LLM (DES-13, I-3)"
