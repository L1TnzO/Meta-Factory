          cmd: ["sh", "-c", "python3 tools/route_check.py ownership openapi.yaml src/main/kotlin || exit 1; if [ -f probe/routes/wrong_owner.kt ]; then out=$(python3 tools/route_check.py ownership openapi.yaml probe/routes/wrong_owner.kt 2>&1); echo \"$out\" | grep -q OWNER_MISMATCH || { echo FSK_OWNERSHIP_DECORATIVE; exit 1; }; fi; echo FSK_OWNERSHIP_OK"]
    - id: s6
      name: "lógica de dominio GENERADA por claude -p (LLM vivo) bajo contract test Kotlin — DES-8 (patrón MAT-2)"
      activation: always
      depends_on: [s5]
      # DES-8 — la lógica de NEGOCIO la GENERA un LLM vivo (claude -p, slot generate, ADR-013, wrapper
      # codegen/gen_llm.py) y un contract test la EJERCITA en el toolchain del producto (Kotlin/gradle). El
      # módulo domain_gen/ vive DECOUPLEADO de build/product/ (tracked, factory root) → s2/s3/s4/s5 (que
      # escanean src/main/kotlin+frontend/src DENTRO del producto) NO lo tocan; el LLM-artefacto Summary.kt se
      # PINEA (skip_if_exists ⇒ committeado = fuente) y ci --rederive lo re-verifica SIN re-invocar al LLM (§7):
      # determinismo en la VERIFICACIÓN, no en la generación (I-3). Un stub no pasa el contract test (el
      # anti-patrón de domain vacío de F1 BLOQUEA). El modelo (Model.kt), el contract (SummaryContract.kt) y el
      # build gradle se EMITEN deterministas (write); el ÚNICO artefacto no-determinista es Summary.kt. El LLM
      # genera la LÓGICA; los TIPOS son el contrato fijo (robustez + foco DES-8). Divergencia de tech registrada
      # (ADR-012): el diseño §5 dijo "Kotest"; el contract gate es un main() de aserciones corrido por gradle
      # `run` (el MISMO idiom JavaExec que el producto usa para `roundtrip`, s1) — sin sumar un framework de test
      # (Kotest = dep pesada a vetar en el SBOM de s4). La pirámide Kotest+Testcontainers+Playwright queda
      # declared-deferred (s7), mismo shape que Ktor→estático de s5. Sustrato intacto: el seam generate (C1) y el
      # check product_env (C3, ya general) corren DATA (ADR-012) — git diff src/+seed = 0 (composición, MAT-2).
      proof_checks:
        - { name: domain_logic_contract, cmd: "gradle run en domain_gen: compila Model.kt + el Summary.kt GENERADO por claude -p + SummaryContract.kt y corre el contract main(); un stub o lógica incorrecta → rojo; el pin (skip_if_exists) se re-verifica sin LLM (§7)", runs_in: product_env, toolchain: "kotlin-gradle", status: built }
      builds:
        - action: write
          dest: domain_gen/settings.gradle.kts
          content: |
            rootProject.name = "domain_gen"
        - action: write
          dest: domain_gen/build.gradle.kts
          content: |
            // domain_gen — módulo Kotlin AUTOCONTENIDO (decoupleado de build/product) que ejercita la lógica
            // de dominio GENERADA por el LLM (Summary.kt) bajo un contract test. Mismas versiones que el
            // producto (Kotlin 2.4.0 / gradle 9.5.1 / JDK 21) → cache de ~/.gradle caliente → ci --rederive
            // sin red. application/run corre el main() del contract (idiom JavaExec, igual que `roundtrip` s1).
            plugins {
                kotlin("jvm") version "2.4.0"
                application
            }
            repositories { mavenCentral() }
            // -Werror (dureza, DES-10): la lógica LLM-generada compila bajo la MISMA barra que el producto.
            kotlin {
                jvmToolchain(21)
                compilerOptions { allWarningsAsErrors = true }
            }
            application { mainClass.set("domain.SummaryContractKt") }
        - action: write
          dest: domain_gen/src/main/kotlin/domain/Model.kt
          content: |
            package domain

            /** Una tarea de un proyecto (espejo del dominio Task del blueprint domain.product). */
            data class Task(val title: String, val done: Boolean)

            /** Estado de avance de un proyecto. sealed ⇒ el `when` que lo consume es exhaustivo (dureza, DES-10). */
            sealed interface ProjectStatus {
                data object NotStarted : ProjectStatus
                data object InProgress : ProjectStatus
                data object Completed : ProjectStatus
            }

            /** Resumen de avance derivado de las tareas de un proyecto (lo que `summarize` produce). */
            data class ProjectSummary(
                val total: Int,
                val done: Int,
                val pending: List<String>,
                val status: ProjectStatus,
            )
        - action: write
          dest: domain_gen/src/main/kotlin/domain/SummaryContract.kt
          content: |
            package domain

            import kotlin.system.exitProcess

            /** El contract test (DES-8): EJERCITA la lógica generada (summarize). Un stub o una implementación
             *  incorrecta hace exitProcess(1) → gradle `run` rojo. Es el tooth de MAT-2: domain vacío BLOQUEA. */
            private fun ensure(cond: Boolean, msg: String) {
                if (!cond) {
                    System.err.println("CONTRACT FAIL: $msg")
                    exitProcess(1)
                }
            }

            fun main() {
                val mixed = listOf(
                    Task("disenar el schema", true),
                    Task("implementar el handler", false),
                    Task("documentar la API", false),
                )
                val s = summarize(mixed)
                ensure(s.total == 3, "total esperado 3, fue ${s.total}")
                ensure(s.done == 1, "done esperado 1, fue ${s.done}")
                ensure(
                    s.pending == listOf("implementar el handler", "documentar la API"),
                    "pending order: ${s.pending}",
                )
                ensure(s.status == ProjectStatus.InProgress, "status esperado InProgress, fue ${s.status}")

                val empty = summarize(emptyList())
                ensure(empty.total == 0 && empty.done == 0 && empty.pending.isEmpty(), "empty counts: $empty")
                ensure(empty.status == ProjectStatus.NotStarted, "empty status: ${empty.status}")

                val allDone = summarize(listOf(Task("a", true), Task("b", true)))
                ensure(allDone.status == ProjectStatus.Completed, "allDone status: ${allDone.status}")
                ensure(allDone.pending.isEmpty(), "allDone pending: ${allDone.pending}")

                val noneDone = summarize(listOf(Task("x", false), Task("y", false)))
                ensure(noneDone.status == ProjectStatus.NotStarted, "noneDone status: ${noneDone.status}")
                ensure(noneDone.pending == listOf("x", "y"), "noneDone pending: ${noneDone.pending}")

                println("FSK_DOMAIN_CONTRACT_OK")
            }
        - action: generate
          dest: domain_gen/src/main/kotlin/domain/Summary.kt
          skip_if_exists: true
          brief: |
            Generá UN archivo Kotlin (package `domain`) con la lógica de resumen de avance de un proyecto.
            NO redefinas los tipos: el archivo Model.kt (mismo package `domain`) YA define, y los usás tal cual:
              data class Task(val title: String, val done: Boolean)
              sealed interface ProjectStatus { data object NotStarted; data object InProgress; data object Completed }
              data class ProjectSummary(val total: Int, val done: Int, val pending: List<String>, val status: ProjectStatus)
            Implementá EXACTAMENTE esta función pública (misma firma):
              fun summarize(tasks: List<Task>): ProjectSummary
            Contrato (cumplilo al pie):
              - total   = cantidad total de tareas.
              - done    = cantidad de tareas con done == true.
              - pending = los `title` de las tareas con done == false, EN EL ORDEN de entrada.
              - status  = ProjectStatus.NotStarted  si done == 0
                          ProjectStatus.Completed   si total > 0 && done == total
                          ProjectStatus.InProgress  en cualquier otro caso
            Requisitos del código:
              - La PRIMERA línea debe ser exactamente: package domain
              - Sin imports externos ni dependencias; Kotlin idiomático que compile con `kotlinc -Werror`
                (sin warnings, sin imports ni variables sin usar, sin `when` no-exhaustivo).
              - Referenciá ProjectStatus.NotStarted / InProgress / Completed por su nombre completo.
            Salida: SOLO el código Kotlin del archivo. NADA de explicaciones ni fences markdown.
          via: ["python3", "codegen/gen_llm.py"]
      checks:
        - name: domain_logic_contract
          kind: product_env
          workdir: domain_gen
          bootstrap: []
          cmd: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) ./gradlew run -q --console=plain || exit 1; echo FSK_DOMAIN_OK"]
    - id: s7
      name: "pirámide de tests GRADUADA en el toolchain del producto: unit + integración (PG viva) + unit TS — DES-8"
      activation: always
      depends_on: [s6]
      # DES-8 — la verificación corre en el toolchain del producto como una pirámide GRADUADA que BLOQUEA por
      # nivel: tier UNIT (Kotest, src/test, SIN infra) testea el comportamiento de la lógica autorada del
      # producto (AuthGuard/RouteTable/Store — cobertura que s5 estático no da); tier INTEGRACIÓN (Kotest,
      # src/integrationTest) corre los queries jOOQ de Repository contra una PostgreSQL VIVA por infra_up (la
      # capa Testcontainers; DB caída → rojo, diente de dos lados); tier UNIT TS (node:test, stdlib, dual-
      # lenguaje como s2–s4) testea el client. Cada check lleva un DIENTE NEGATIVO EMBEBIDO (no-decorativo): el
      # `testProbe` (un test que DEBE fallar) mata la fachada "0 tests → BUILD SUCCESSFUL"; un probe TS análogo
      # del lado node. El codegen (s0) emite las suites + el build de test → builds: [] (la estación sólo
      # PRUEBA). Eje DISTINTO de s1–s6: ningún gate previo corre una suite GRADUADA con framework que bloquea
      # por nivel. Sustrato intacto: product_env + infra_up corren DATA (ADR-012). Playwright/e2e (browser +
      # server HTTP vivo) = declared-deferred (necesita red + el server vivo de s9), divergencia registrada
      # ADR-012 (mismo shape que Ktor→estático de s5 y Kotest→main() de s6).
      proof_checks:
        - { name: pyramid_unit, cmd: "gradle test (suite unit Kotest: AuthGuard/RouteTable/Store) verde; gradle testProbe DEBE reportar el test FAILED (grep) o decorativo→rojo (fail-closed)", runs_in: product_env, toolchain: "kotest-junit5", status: built }
        - { name: pyramid_integration, cmd: "gradle integrationTest (Repository vs PostgreSQL viva por infra_up); DB caída → rojo (diente de dos lados)", runs_in: product_env, toolchain: "kotest-postgres", status: built }
        - { name: pyramid_unit_ts, cmd: "node:test del client TS (summarize) verde; un probe TS que DEBE fallar o decorativo→rojo (fail-closed)", runs_in: product_env, toolchain: "node-test", status: built }
        - { name: workflow_enforced, cmd: "gradle workflowTest: el guard canTransition de cada enum con transitions — transición válida pasa Y no-declarada rechazada (diente de dos lados, DES-3); romper el guard → rojo", runs_in: product_env, toolchain: "kotest-junit5", status: built }
      builds: []
      checks:
        - name: pyramid_unit
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "JH=$(dirname $(dirname $(readlink -f $(command -v javac)))); JAVA_HOME=$JH ./gradlew test -q --console=plain || exit 1; JAVA_HOME=$JH ./gradlew testProbe --console=plain 2>&1 | grep -q 'ProbeShouldFailTest.*FAILED' || { echo FSK_PYRAMID_DECORATIVE; exit 1; }; echo FSK_PYRAMID_UNIT_OK"]
        - name: pyramid_integration
          kind: infra_up
          workdir: build/product
          bootstrap: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) exec ./gradlew integrationTestClasses -q --console=plain"]
          up: ["sh", "-c", "docker rm -f fsk_s7_pg >/dev/null 2>&1; exec docker run --rm --name fsk_s7_pg -e POSTGRES_PASSWORD=metafactory -p 5435:5432 postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb"]
          proof: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) exec ./gradlew integrationTest -q --console=plain"]
          down: ["docker", "rm", "-f", "fsk_s7_pg"]
          timeout: 120
        - name: pyramid_unit_ts
          kind: product_env
          workdir: build/product/frontend
          bootstrap: []
          cmd: ["sh", "-c", "node --experimental-strip-types --disable-warning=ExperimentalWarning --test test/client.test.ts || exit 1; node --experimental-strip-types --disable-warning=ExperimentalWarning --test probe-test/fail.test.ts >/dev/null 2>&1 && { echo FSK_PYRAMID_TS_DECORATIVE; exit 1; }; echo FSK_PYRAMID_UNIT_TS_OK"]
        - name: workflow_enforced
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) ./gradlew workflowTest -q --console=plain || exit 1; ls build/test-results/workflowTest/*.xml >/dev/null 2>&1 || { echo FSK_WORKFLOW_NO_TESTS; exit 1; }; echo FSK_WORKFLOW_OK"]
    - id: s8
      name: "calidad de experiencia: a11y (axe-core en jsdom) + perf (presupuesto de bundle-size con esbuild) bajo eval_gate — DES-7"
      activation: always
      depends_on: [s7]
      # DES-7 — el producto gana gates de calidad de EXPERIENCIA que BLOQUEAN bajo umbral, DETERMINISTAS y
      # HERMÉTICOS (sin browser, sin red post-npm-install). COMPONEN el mecanismo de sustrato eval_gate (MAT-4,
      # ya general): el sustrato ORQUESTA un scorer declarado (lee METAFACTORY_EVAL_OUTPUT, imprime
      # SCORE:<m>=<float>) y JUZGA contra thresholds; el diente de dos lados es NATIVO (el degraded DEBE
      # flipear, doctrina MAT-4). a11y: axe-core (el motor WCAG estándar) corre HEADLESS en jsdom (sin browser)
      # sobre la UI generada del blueprint (frontend/ui/index.html) → a11y_pass_rate ≥ 1.0 (cero violaciones);
      # un fixture de UI mala (eval/probe/bad_ui.html), auditado EN VIVO en el bootstrap, flipea (6 violaciones
      # WCAG reales). perf: esbuild (el bundler estándar) bundlea+minifica el entry real (src/app.ts) y mide los
      # bytes vs un presupuesto declarado (eval/budget.json) → perf_budget_ratio (budget/bytes) ≥ 1.0; un entry
      # bloated (eval/probe/bloated.ts), bundleado EN VIVO, flipea. El codegen (s0) emite la UI + los drivers +
      # los scorers + los probes → builds: [] (la estación sólo PRUEBA). Sustrato intacto: eval_gate corre DATA
      # (ADR-012) — git diff src/+seed = 0 (composición §6, como s0–s7; 3er toolchain de eval_gate: node FSK).
      # Divergencia de tech registrada (ADR-012): el diseño §5 dijo "axe + Lighthouse CI + bundle-size"; se
      # entrega axe (HEADLESS, motor real) + el presupuesto de bundle-size; Lighthouse (lab metrics: server HTTP
      # vivo + Chrome headless por red) = declared-deferred, su propio incremento con el server vivo de s9 —
      # MISMO shape que Playwright→e2e de s7 y Ktor→estático de s5.
      proof_checks:
        - { name: a11y_gate, cmd: "eval_gate: axe-core+jsdom audita la UI generada → a11y_pass_rate ≥ 1.0 (cero violaciones); un fixture de UI mala flipea (degraded) o decorativo→rojo", runs_in: product_env, toolchain: "axe-jsdom", status: built }
        - { name: perf_budget_gate, cmd: "eval_gate: esbuild bundlea el entry → perf_budget_ratio (budget/bytes) ≥ 1.0; un entry bloated flipea (degraded) o decorativo→rojo", runs_in: product_env, toolchain: "esbuild", status: built }
      builds: []
      checks:
        - name: a11y_gate
          kind: eval_gate
          workdir: build/product/frontend
          bootstrap: ["sh", "-c", "npm install --no-audit --no-fund --loglevel=error && node eval/a11y_audit.mjs"]
          scorer: ["node", "eval/a11y_scorer.mjs"]
          output: "eval/a11y_output.json"
          degraded: "eval/a11y_degraded.json"
          thresholds: {a11y_pass_rate: 1.0}
        - name: perf_budget_gate
          kind: eval_gate
          workdir: build/product/frontend
          bootstrap: ["sh", "-c", "npm install --no-audit --no-fund --loglevel=error && node eval/perf_measure.mjs"]
          scorer: ["node", "eval/perf_scorer.mjs"]
          output: "eval/perf_output.json"
          degraded: "eval/perf_degraded.json"
          thresholds: {perf_budget_ratio: 1.0}
    - id: s9
      name: "observabilidad del producto: server HTTP vivo + tracing OTel + logs estructurados con correlation-id (DES-5)"
      activation: always
      depends_on: [s8]
      # DES-5 — el producto EMITE observabilidad y se verifica contra un server HTTP VIVO (no se "renderiza" un
      # config): una request real produce un trace OTel con correlation-id + un log estructurado con ese mismo
      # correlation-id (la clave de unión), y /health·/ready responden. COMPONE el mecanismo de sustrato infra_up
      # (E1/MAT-3, ya general) con un 4º servicio: el PROPIO server del producto (los 3 previos eran contenedores
      # PostgreSQL). El codegen (s0) emite la capa de obs (observability/{FileSpanExporter,Observability,ObsServer}
      # .kt: server del JDK com.sun.net.httpserver — stdlib, NO Ktor — + OTel SDK real con SpanExporter a archivo)
      # + tools/obs_check.py (el proof client, mini-columna s10) → builds: [] (la estación sólo PRUEBA). El
      # bootstrap buildea el launcher (installDist), `up` lo levanta en background (proceso java plano, kill-eable
      # por grupo), el proof hace las requests y lee los spans/logs emitidos. Diente de dos lados NATIVO de
      # infra_up (server caído → el proof no conecta → rojo); + diente vivo "sin instrumentación → el cid no se
      # emite → rojo". Sustrato intacto: infra_up corre DATA (ADR-012) — git diff src/+seed = 0 (composición §6,
      # como s0–s8). Divergencia de tech registrada (ADR-012): el diseño §5 nombró "OTel + /health·/ready" y notas
      # previas nominaron Ktor; se entrega el motor OTel REAL + un server HTTP vivo del JDK (mínima superficie).
      # El server Ktor COMPLETO + e2e (Playwright, s7) + Lighthouse (s8) quedan declared-deferred, su propio
      # incremento sobre este primer server vivo (mismo shape que Ktor→estático de s5 y Lighthouse→esbuild de s8).
      # R2/FSK-S15 — endpoints VIVOS + control de acceso a RUNTIME (DES-3): un 2º check infra_up en s9 compone
      # el server HTTP del producto (AppServer.kt, com.sun.net.httpserver) con una PostgreSQL VIVA (5º servicio
      # por infra_up, idiom MAT-3: bootstrap levanta el contenedor PG detached + installDist; `up` corre el
      # server por `java -cp` del dist — proceso java plano, kill-eable por grupo). El server monta GET/POST/PUT
      # de la entidad con dueño e INVOCA los guards generados (Auth→RBAC→ownership) + Repository contra la PG
      # viva; el proof client (urllib) asevera el veredicto de autorización de DOS+ lados (403 por rol / 403 por
      # dueño / 200 dueño / 200 bypass). Diente nativo de infra_up: server caído → el proof no conecta → rojo;
      # diente de control: saboteado un guard, el 403 se vuelve 200 → el proof falla. Transforma la trilogía de
      # control de acceso (s5 estático + s7 unit) en "enforzada a runtime". Opt-in: sólo con owned_by (el codegen
      # no emite AppServer si no hay dueño). Sustrato intacto: infra_up corre DATA (ADR-012), git diff src/+seed=0.
      # FSK-FRONTEND-CONSUME — el frontend CONSUME el backend vivo (DES-6): un 3er check infra_up en s9
      # (frontend_consume_live) compone el MISMO AppServer (puerto/PG propios por env, fsk_s9_fe_pg) con el CLIENTE
      # TS GENERADO. El cliente (frontend/src/client.ts) gana create<E>/get<E> que hacen `fetch` REAL (type-bound
      # al contrato: Pick<components[schemas][<E>]> → drift rompe tsc en s2); un consumer node
      # (frontend/consume_check.ts) los IMPORTA y corre el round-trip e2e (create<E> POST → get<E> GET → aseverar
      # cada campo type-correct) por `node --experimental-strip-types`. El frontend deja de ser funciones puras que
      # nunca llaman al server. Diente nativo de infra_up (server caído → fetch tira → rojo) + central (un cliente
      # que ignora la respuesta → mismatch → rojo). FSK-FRONTEND-RENDER-LIST extiende ESE check: el server lista
      # las filas (GET /<plural> → {count,rows[]}), list<E> las trae y render<E>List las renderiza → el html
      # refleja la lista VIVA (REQ-F-018). Render EN BROWSER (mount/eventos) + el form que postea + deploy + e2e
      # Playwright = declared-deferred. Opt-in: sin owned_by no se emite. Sustrato intacto: infra_up corre DATA (ADR-012), git diff src/+seed=0.
      proof_checks:
        - { name: observability_live, cmd: "infra_up levanta el server HTTP del producto; obs_check.py hace /health+/ready+una request con X-Correlation-Id y exige que el span OTel y el log estructurado emitidos lleven el cid; server caído → rojo (diente nativo); quitar la instrumentación → cid ausente → rojo", runs_in: product_env, toolchain: "kotlin-otel-httpserver", status: built }
        - { name: access_control_live, cmd: "infra_up levanta la PostgreSQL viva + el server HTTP del producto (AppServer); access_control_check.py hace requests REALES y asevera (1) el veredicto de acceso: POST rol prohibido→403 / permitido→201, PUT/DELETE fila ajena por no-dueño→403 / por dueño→200 / por bypass→200; (2) el ROUND-TRIP de mutación (FSK-S16): POST→count+1, PUT por dueño→GET /{id} ve el valor nuevo, DELETE por dueño→count vuelve y GET /{id}→404; (3) el ROUND-TRIP del CUERPO (FSK-CRUD-BODY-PARSING): POST {valores ≠ samples} → GET /{id} trae EXACTAMENTE esos valores type-correct, y body JSON inválido / tipo equivocado → 400; saboteá un guard → 403 se vuelve 200 → rojo; una mutación decorativa (200 que no toca la DB) → el round-trip rojo; un server que ignora el body (mete samples) → GET ≠ posteado → rojo; server caído → rojo (diente nativo)", runs_in: product_env, toolchain: "kotlin-httpserver-pg", status: built }
        - { name: frontend_consume_live, cmd: "infra_up levanta la PostgreSQL viva + el server HTTP del producto (AppServer en puerto/PG propios); el CLIENTE TS GENERADO (frontend/src/client.ts: create<E>/get<E>/list<E>, fetch real) + el render generado (frontend/src/app.ts: render<E>List) lo CONSUMEN+RENDERIZAN vía un consumer node (frontend/consume_check.ts, `node --experimental-strip-types`) → e2e: (a) round-trip create<E>(body ≠ samples) POSTea → get<E>(id) GETea → cada campo posteado vuelve EXACTO y type-correct (un cliente que ignora la respuesta → mismatch → rojo); (b) LISTA VIVA → list<E>(base) trae la colección → render<E>List la renderiza → el html refleja CADA fila viva incl. la recién creada (un render que dropea/garbla/hardcodea filas, o un list<E> truncado → html ≠ lista viva → rojo); body de tipo equivocado → 400 → el cliente lo propaga; server caído → fetch tira → rojo (diente nativo)", runs_in: product_env, toolchain: "ts-client-httpserver-pg", status: built }
      builds: []
      checks:
        - name: observability_live
          kind: infra_up
          workdir: build/product
          bootstrap: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) exec ./gradlew installDist -q --console=plain"]
          up: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) exec ./build/install/{{package_name}}/bin/{{package_name}}"]
          proof: ["python3", "tools/obs_check.py", "http://127.0.0.1:18593", "obs/spans.jsonl", "obs/access.jsonl", "fsk-trace-001"]
          down: []
          timeout: 120
        - name: access_control_live
          kind: infra_up
          workdir: build/product
          bootstrap: ["sh", "-c", "set -e; export JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))); ./gradlew installDist -q --console=plain; docker rm -f fsk_s9_ac_pg >/dev/null 2>&1 || true; docker run -d --name fsk_s9_ac_pg -e POSTGRES_PASSWORD=metafactory -p 5436:5432 postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb >/dev/null"]
          up: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))); exec \"$JAVA_HOME/bin/java\" -cp 'build/install/{{package_name}}/lib/*' {{package_name}}.endpoints.AppServerKt"]
          proof: ["python3", "tools/access_control_check.py", "http://127.0.0.1:18594"]
          down: ["docker", "rm", "-f", "fsk_s9_ac_pg"]
          timeout: 120
        - name: frontend_consume_live
          kind: infra_up
          workdir: build/product
          # 3er check infra_up de s9 (FSK-FRONTEND-CONSUME): el CLIENTE TS generado consume el server vivo e2e.
          # Puerto/contenedor PG PROPIOS (18595/5437/fsk_s9_fe_pg) ≠ access_control_live (18594/5436/fsk_s9_ac_pg)
          # para no colisionar. El AppServer es el MISMO binario; los puertos se inyectan por env (FSK_AC_PORT /
          # FSK_PG_URL). El proof corre `node --experimental-strip-types` sobre el consumer (sin npm install:
          # client.ts sólo usa fetch global + imports type-only stripped → sin node_modules).
          bootstrap: ["sh", "-c", "set -e; export JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))); ./gradlew installDist -q --console=plain; docker rm -f fsk_s9_fe_pg >/dev/null 2>&1 || true; docker run -d --name fsk_s9_fe_pg -e POSTGRES_PASSWORD=metafactory -p 5437:5432 postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb >/dev/null"]
          up: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))); export FSK_AC_PORT=18595 FSK_PG_URL=jdbc:postgresql://localhost:5437/postgres; exec \"$JAVA_HOME/bin/java\" -cp 'build/install/{{package_name}}/lib/*' {{package_name}}.endpoints.AppServerKt"]
          proof: ["sh", "-c", "cd frontend && exec node --experimental-strip-types --disable-warning=ExperimentalWarning consume_check.ts http://127.0.0.1:18595"]
          down: ["docker", "rm", "-f", "fsk_s9_fe_pg"]
          timeout: 120
    - id: s10
      name: "build hermético reproducible + mini-columna del producto (fan-in DAG) — DES-1"
      activation: always
      depends_on: [s2, s3, s4, s7, s8, s9]
      # DES-1 — la ÚLTIMA estación de la línea FSK. Prueba que el build del producto es HERMÉTICO (offline) y
      # REPRODUCIBLE (el artefacto compilado webapp.jar sale byte-idéntico entre dos builds limpios offline —
      # la propiedad que s0 NO da: s0 prueba que el ÁRBOL FUENTE regenera idéntico, no que el OUTPUT COMPILADO
      # sea reproducible) y que el producto SHIPPEA su propia MINI-COLUMNA (ci.sh: un CI que re-corre sus gates
      # estáticos offline — "el producto hereda probar por bloqueo", SAFE-3). NO-CIRCULAR: el eje no es
      # `ci --rederive` (mecanismo del sustrato, ya verde desde s0) sino la reproducibilidad del jar + la
      # mini-columna del PRODUCTO. El codegen (s0) emite la config de repro del build.gradle.kts + ci.sh +
      # tools/hermetic_check.py + el Dockerfile (base pineada por @sha256:) → builds: [] (sólo PRUEBA). COMPONE
      # el kind product_env (ya general): hermetic_check.py (stdlib, determinista, SIN RED) buildea el jar dos
      # veces offline y exige SHA256 idéntico, EJERCITA ci.sh (--check), y un diente fail-closed EMBEBIDO
      # (ci.sh --probe re-corre un gate sobre un probe sucio shippeado y DEBE morder, o decorativo→rojo).
      # PRIMER fan-in DAG de la línea FSK (depends_on múltiple; s0–s9 eran cadena lineal): co-valida el gating
      # multi-predecesor (P2/H2) en una línea REAL — el engine queda SHUT si CUALQUIER predecesor está shut.
      # Sustrato intacto: product_env corre DATA (ADR-012) — git diff src/+seed = 0 (composición §6, como s0–s9).
      # Divergencia de tech registrada (ADR-012): el diseño §5 nombró "imagen Docker base pineada"; se entrega
      # la propiedad REAL (build offline byte-reproducible + mini-columna + toolchain pineado por digest/sha256)
      # con superficie mínima. El build+push de la IMAGEN Docker reproducible (red+daemon) queda declared-deferred
      # (su propio incremento) — se SHIPPEA el Dockerfile y el gate verifica su pin por grep, no construye la
      # imagen. Mismo shape EXACTO que Ktor→estático (s5), Playwright→deferred (s7), Lighthouse→esbuild (s8).
      proof_checks:
        - { name: hermetic_build, cmd: "hermetic_check.py: build del jar ×2 offline → SHA256 idéntico (reproducible+hermético); la mini-columna ci.sh re-corre sus gates offline (--check); ci.sh --probe sobre un probe sucio DEBE morder (fail-closed); Dockerfile/wrapper pineados; flip de preserveFileTimestamps → jars difieren → rojo; romper un predecesor → s10 SHUT (fan-in)", runs_in: product_env, toolchain: "gradle-jdk", status: built }
      builds: []
      checks:
        - name: hermetic_build
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) python3 tools/hermetic_check.py"]

  provision_modes: [scaffold]
  proof_check_types: [product_env, infra_up, eval_gate]

# ── L3 · MAQUINARIA: declarada como DATO (ADR-012), status declared-deferred (especificada; su emit/codegen
# lo hace el build). La COLUMNA (Cerrojos 1/2/3 + settings) NO va acá: es L4 substrate, heredada verbatim. ──
machinery:
  harness:
    tech: "Claude Code: agents (writer/reviewer/triage con sombras deterministas) + commands + skills, emitidos del spec (D2)"
    primitive: DES-1
    status: built
    agents:
      - name: writer
        description: "Escribe DIFFs acotados de la fábrica full-stack-kotlin (implementación, no decisiones)."
        model: sonnet
        tools: [Read, Edit, Write, Bash, Grep, Glob]
        shadows:
          - { prohibits: "no escribe ni edita veredictos en .proof/", shadow: ".claude/hooks/proof_protect.py" }
          - { prohibits: "no declara verde: passed lo computa SOLO el verifier desde exit codes", shadow: "seed/verifier.py" }
          - { prohibits: "no commitea un veredicto corrupto/no probado (la activa recompone verde)", shadow: ".claude/hooks/commit_guard.py" }
          - { prohibits: "no cierra el turno con la activa tampereada o roja", shadow: ".claude/hooks/stop_proof.py" }
        body: |
          # writer — el slot de implementación de la fábrica {{slug}}
          Recibís un DIFF a producir (no una decisión). Trabajás contra la línea y dejás que la gate sea la
          autoridad: nunca afirmás verde, lo demostrás.
          ## Qué NO hacés (con sombra determinista, no prosa)
          - No tocás `.proof/` (sombra: proof_protect). No declarás "pasa" (sombra: verifier.py).
          - No commitees trabajo no probado ni cerrás con la activa rota (sombras: commit_guard, stop_proof).
      - name: reviewer
        description: "Revisa DIFFs que tocan la cadena de confianza; no aprueba sin re-derivar."
        model: opus
        tools: [Read, Bash, Grep, Glob]
        shadows:
          - { prohibits: "no aprueba sin que el CI externo re-derive la línea (dos verificadores)", shadow: "seed/external_ci.yml" }
          - { prohibits: "no declara verde: el verifier es la única autoridad del proof_sha", shadow: "seed/verifier.py" }
        body: |
          # reviewer — revisión de la cadena de confianza de {{slug}}
          Recibís un DIFF que toca verifier/hooks/seed/gates. Revisás con ojos propios; nunca emitís un
          veredicto — reportás evidencia re-derivada y delegás el juicio al orquestador.
      - name: triage
        description: "Triage de un log rojo: causa raíz en ≤5 líneas. Solo lectura."
        model: haiku
        tools: [Read, Bash, Grep, Glob]
        shadows:
          - { prohibits: "no escribe ni edita artefactos de prueba en .proof/", shadow: ".claude/hooks/proof_protect.py" }
        body: |
          # triage — diagnóstico rápido de log rojo en {{slug}}
          Recibís un log de gate rojo. Tu único producto es una causa raíz en ≤5 líneas. No arreglás, no
          aprobás, no escribís.
    commands:
      - name: gen-check
        description: "Corre el selftest del codegen del producto (parsea el blueprint, lista los archivos; no escribe)."
        run: ["python3", "codegen/scaffold_product.py", "--selftest"]
        body: |
          # /gen-check — verificá el codegen de la fábrica {{slug}}
          Corré el selftest del scaffolder: parsea el blueprint (domain.product) y lista los archivos del
          producto que emitiría. Exit 0 = el generador es invocable y el blueprint está completo.
    skills:
      - name: verificar-fabrica
        description: "Cómo re-verificar la fábrica por bloqueo (no por prosa)."
        body: |
          # verificar — re-verificá {{slug}} por bloqueo
          Corré `meta product-run --factory {{slug}}` y leé el bus de veredictos (≤ max_lines), nunca el
          dump de tests. Los dos verificadores: `meta ci --rederive --factory {{slug}}`.
  mcp:
    tech: "server MCP de recall scopeado al PIN (Context7-tuneado): SÓLO los docs de las versiones pineadas de Kotlin/Ktor/jOOQ/React/etc., recall bajo demanda (E2); alimenta el oráculo de currency (DES-11)"
    primitive: DES-11
    status: declared-deferred
  infra:
    tech: "PostgreSQL real vía Testcontainers (docker) bajo infra_up; health por reintento, teardown SIEMPRE (E1/MAT-3)"
    primitive: DES-9
    status: declared-deferred
    services:
      - { name: postgres, kind: container, endpoint: "tcp:5432", marker: PG_UP }

# ── L4 · sustrato (heredado verbatim, no negociable) ──
factory_substrate:
  anti_rubber_stamp_column: true
  verdict_bus: { max_lines: 10 }
  generated_domain_boundary: false   # 100%-generado (ADR-011): sin código humano → boundary opta-out (H2)
  memory_schema: adr021
  rtm: { required: true }
  two_verifier_ci: { rederive: true, pinned_verdict: true }
  placement_law: true
  context_budget: { claude_md_max_lines: 120 }

# ── L5 · requisitos (espina SDD; id estable + satisfied_by a una estación activa + capability + verified_by) ──
requirements:
  functional:
    - id: REQ-F-001
      statement: "el contrato OpenAPI es la fuente única; server Kotlin y client TS se generan de ahí y un drift de tipos rompe la compilación (DES-6)"
      acceptance: "contract_single_source verde; un drift sin regenerar un lado → rojo"
      satisfied_by: [s0]
      verified_by: [contract_single_source]
      capability: contrato_tipado_fuente_unica
    - id: REQ-F-002
      statement: "el producto es 100%-generado desde el spec y regenerar es idempotente (DES-1)"
      acceptance: "scaffold_idempotent verde; regenerar produce un árbol idéntico"
      satisfied_by: [s0]
      verified_by: [scaffold_idempotent]
      capability: andamiaje_regenerable
    - id: REQ-F-003
      statement: "el esquema PostgreSQL está versionado (Flyway) y los queries son chequeados EN COMPILACIÓN por jOOQ: un query a una columna inexistente = compile error (DES-12)"
      acceptance: "schema_checked verde; borrar una columna usada por un query → Unresolved reference (compile rojo); regen → verde"
