# full-stack-kotlin.factory.spec.yml — Full-Stack Kotlin/TS/PG Factory (BLUEPRINT, status: planned).
# Una fábrica de grado-producción para apps web world-class bajo CRITERIOS DUROS DE INGENIERÍA.
# Autoridad del diseño + handoff de build: docs/work/FULLSTACK-KOTLIN-INCREMENT.md (leelo PRIMERO).
#
# Pila (PLAN, ADR-012 — NUNCA hardcodear en src/metafactory/): Kotlin (JVM) backend · TypeScript/React
# frontend · PostgreSQL + jOOQ (SQL chequeado en compilación) + Flyway (migraciones versionadas).
# Contrato OpenAPI como FUENTE ÚNICA → stubs Kotlin + client TS generados (drift imposible).
#
# Este spec PASA `validate` + `design-review` (exit 0): es un blueprint de diseño COMPLETO (13 primitivas
# requeridas, cada una con una tech; cada requisito con un verifier real). NADA está `built` todavía: el
# motor lo construye por incrementos, estación por estación, probado por bloqueo (SAFE-7). El próximo
# orquestador rellena los `builds`/`checks` ejecutables y sube `status` a `built` SÓLO con `proof` real.

# ── L0 · identidad ──
factory:
  name: "Full-Stack Kotlin/TS/PG Factory"
  slug: full-stack-kotlin
  maturity: skeleton

# ── L1 · dominio ──
domain:
  produces: >-
    una app web full-stack de grado-producción: contrato OpenAPI tipado como fuente única, backend Kotlin,
    frontend TypeScript/React, base de datos PostgreSQL con esquema versionado (Flyway) y queries chequeados
    en compilación (jOOQ), verificada ENTERA en su propio toolchain bajo criterios duros de ingeniería
    (dureza estática, frescura de API, seguridad de la cadena de suministro, calidad de experiencia,
    observabilidad), 100%-generada desde este spec.
  target_framework: { name: kotlin, provider_agnostic: true }

  # Las primitivas DES que ESTE dominio requiere (paso 2 del skill). design-review exige una tech por cada
  # una (abajo, en capabilities) y un verifier por cada requisito (L5). DES-10..13 las destapó este dominio.
  required_primitives: [DES-1, DES-2, DES-3, DES-4, DES-5, DES-6, DES-7, DES-8, DES-9, DES-10, DES-11, DES-12, DES-13]

  # Blueprint del PRODUCTO de ejemplo — lo lee el codegen (factories/full-stack-kotlin/codegen/, ADR-012).
  # Representativo: una app de gestión (User/Project/Task) con relaciones. El codegen real es del build.
  product:
    package_name: webapp
    api_title: "Project Tracker API"
    # RBAC (R2/FSK-S13, DES-3): autorización por rol sobre las escrituras. `roles` = el universo de roles del
    # producto; `write_roles` por entidad = quién puede POST-ear esa entidad. El codegen emite un enum Role
    # type-safe + RoleGuard (cruza el rol del token contra el set requerido), el contrato marca x-required-roles
    # y route_check.py (modo rbac) lo verifica. `viewer` es read-only (no escribe ninguna entidad).
    roles: [admin, editor, viewer]
    # ownership / autorización a nivel de FILA (R2/FSK-S14, DES-3): un actor no-privilegiado sólo modifica las
    # filas que le PERTENECEN; `owner_bypass_roles` = los roles que IGNORAN ownership (admin administra todo). El
    # codegen emite OwnershipGuard.canModify + OwnershipPolicy (entidad→campo dueño), el contrato marca x-owned-by
    # y route_check.py (modo ownership) lo verifica. Compone sobre RBAC (rol×entidad) + auth (autenticación).
    owner_bypass_roles: [admin]
    entities:
      - name: User
        write_roles: [admin]          # sólo admin crea usuarios
        fields:
          - { name: email, type: string, unique: true }
          - { name: name, type: string }
      - name: Project
        write_roles: [admin, editor]
        owned_by: owner_id            # el dueño de la fila es el User que owner_id referencia (ownership)
        fields:
          - { name: name, type: string }
          - { name: owner_id, type: ref, to: User }
          - { name: budget, type: number }
      - name: Task
        write_roles: [admin, editor]
        fields:
          - { name: title, type: string }
          - { name: done, type: boolean }
          - { name: project_id, type: ref, to: Project }
          # priority es un WORKFLOW (R2/FSK-S12, DES-3): la prioridad sólo cambia de a un paso (no low↔high de
          # golpe). initial + transitions → guard canTransition DETERMINISTA, type-bound al enum del contrato.
          - name: priority
            type: enum
            values: [low, medium, high]
            initial: low
            transitions: { low: [medium], medium: [low, high], high: [medium] }
          - { name: estimate, type: int }
          - { name: due, type: date }
          - { name: notes, type: string, required: false }

  # Restricciones — dónde esta pila es INSEGURA para un dominio (DATA hoy; darle dientes M0 = incremento
  # de sustrato futuro chico, ver INCREMENT §8). El producto no debe planearse para estos dominios.
  constraints:
    excluded_domains:
      - { domain: "tiempo-real-duro / safety-critical", reason: "el GC del JVM no da latencia determinista", future_factory: "Rust/Ada/C" }
      - { domain: "ML / numérico pesado / entrenamiento", reason: "ecosistema equivocado para JVM/TS", future_factory: "Python/C++/CUDA" }
      - { domain: "embebido / kernel / drivers", reason: "necesita sin-GC", future_factory: "Rust/C (parte: IoT-Go)" }
      - { domain: "mobile nativo (UI iOS/Android)", reason: "esto es web full-stack", future_factory: "Mobile-Factory" }
      - { domain: "HFT / ultra-baja-latencia", reason: "el GC es inaceptable", future_factory: "C++/Rust" }
      - { domain: "smart contracts / on-chain", reason: "VM y lenguaje distintos", future_factory: "Solidity/Move" }
      - { domain: "big-data ETL / streaming pesado", reason: "runtime distinto", future_factory: "Spark/dbt (data-pipeline)" }
    affirmative_fit: "apps web transaccionales/CRUD, dashboards, SaaS, herramientas internas, APIs de negocio"

  # Capabilities (L1): cada una con su primitiva DES + la tech que el PLAN eligió. status: planned (nada
  # construido aún). El `artifact` y el `proof` documentan el objetivo del build (la hoja del árbol C4).
  capabilities:
    - id: andamiaje_regenerable
      invariant: "el producto entero es derivable de este spec; regenerar es idempotente (100%-generado, sin código humano que proteger)"
      primitive: DES-1
      tech: "OpenAPI-codegen + Gradle/npm desde el blueprint (domain.product); scaffolder determinista en factories/full-stack-kotlin/codegen/"
      artifact: build/product/openapi.yaml
      proof: "s0: regenerar desde el spec produce un árbol idéntico (idempotente); un blueprint incompleto → s0 rojo"
      status: built
    - id: contrato_tipado_fuente_unica
      invariant: "el contrato OpenAPI es la FUENTE ÚNICA; el server Kotlin y el client TS se generan de ahí y un drift de tipos rompe la compilación de ambos lados"
      primitive: DES-6
      tech: "OpenAPI → stubs Kotlin (server) + client TS generado; kotlinc + tsc --strict sobre lo generado"
      artifact: build/product/openapi.yaml
      proof: "s0: kotlinc + tsc --strict verdes sobre el código generado del contrato; cambiar el contrato sin regenerar un lado → rojo"
      status: built
    - id: aislamiento_producto
      invariant: "el producto corre en SU propio toolchain (Gradle/npm), aislado del de la fábrica; importar la fábrica dentro del product_env falla (DES-9, SAFE-2)"
      primitive: DES-9
      tech: "workspace Gradle + workspace npm propios; env scrubbed (sin PYTHONPATH/clases de la fábrica)"
      artifact: build/product/settings.gradle.kts
      proof: "s0: el build del producto corre con su toolchain; un intento de cargar la fábrica adentro → rojo"
      status: built
    - id: datos_esquema_chequeado
      invariant: "el esquema PostgreSQL está versionado (migraciones Flyway con prefijo de versión) y los queries se chequean contra el schema EN COMPILACIÓN: un query a una columna inexistente = error de compilación (la DB grita)"
      primitive: DES-12
      tech: "Flyway (migraciones versionadas) + jOOQ (tipos derivados del schema por DDLDatabase, sin DB viva — hermético); kotlinc falla ante un query a una columna inexistente"
      artifact: build/product/src/main/resources/db/migration/V1__init.sql
      proof: "s1 schema_checked: jOOQ DDLDatabase deriva los tipos de db/migration/*.sql + compileKotlin; borrar una columna usada → Unresolved reference (compile rojo); regen → verde"
      status: built
    - id: datos_durables_vivos
      invariant: "el PRODUCTO persiste/lee contra una PostgreSQL VIVA: un round-trip create+list del producto corre contra la DB levantada (no un mock); DB caída → rojo (DES-4, M8 del producto)"
      primitive: DES-4
      tech: "PostgreSQL real (contenedor pineado por digest) bajo infra_up; el cliente es un runner del PRODUCTO (Flyway migrate + jOOQ create/list) tipado al schema"
      artifact: build/product/src/main/kotlin/{{package_name}}/DbRoundTrip.kt
      proof: "s1 db_roundtrip_live: infra_up levanta PostgreSQL + bootstrapea el toolchain del producto; round-trip vivo + reversibilidad (Flyway clean); DB caída → rojo (diente de dos lados)"
      status: built
    - id: dureza_estatica
      invariant: "el código falla FUERTE por calidad: sin `any` (TS) ni warnings (Kotlin), exhaustividad obligatoria, complejidad acotada, errores no tragados — un escape-hatch → build rojo"
      primitive: DES-10
      tech: "detekt (+ reglas ktlint vía detekt-formatting) + `-Werror` (Kotlin) · ESLint strict + @typescript-eslint/no-explicit-any + ts-reset (TS)"
      artifact: build/product/config/detekt.yml
      proof: "s2: los linters corren en el toolchain del producto; introducir un `any` (TS)/excepción tragada (Kotlin) → rojo; el probe negativo embebido lo exige cada corrida"
      status: built
    - id: frescura_de_api
      invariant: "el código generado usa SÓLO superficie de API no-deprecada y pineada; un símbolo deprecado se bloquea de forma DETERMINISTA, sin LLM (I-3)"
      primitive: DES-11
      tech: "oráculo de superficie pineado (config/api-surface.lock: versiones pineadas + deny-list por versión) + linter determinista (tools/currency_lint.py, stdlib, sin LLM)"
      artifact: build/product/config/api-surface.lock
      proof: "s3: el linter de currency cruza el código contra el lock; usar un símbolo deprecado/fuera del pin → rojo; el probe sucio embebido DEBE morder cada corrida"
      status: built
    - id: seguridad_cadena_suministro
      invariant: "el producto no shippea dependencias con vulnerabilidades conocidas ni secretos hardcodeados — gateado DETERMINISTAMENTE en el toolchain del producto (sin red, sin LLM, I-3)"
      primitive: DES-13
      tech: "SBOM CycloneDX-lite de deps directas (sbom.json) + oráculo de advisories pineado (config/supply-chain.lock: coordinate@rango-vulnerable→CVE por ecosistema + patrones de secretos) + scanner determinista stdlib (tools/supply_chain_scan.py); el feed vivo OSV/npm-audit y el SBOM transitivo quedan declared-deferred"
      artifact: build/product/sbom.json
      proof: "s4 supply_chain_gate: el scanner cruza el SBOM vs advisories + escanea secretos → 0; una dep en rango vulnerable (postgresql<42.7.2/CVE-2024-1597) o un secreto (AKIA…) → rojo; el probe sucio embebido DEBE morder cada corrida (diente de dos lados, fail-closed)"
      status: built
    - id: rutas_protegidas
      invariant: "ninguna ruta protegida por el contrato se alcanza sin pasar por el guard de auth (punto de control no-salteable, verificado por alcanzabilidad estática sobre el árbol de rutas declarado)"
      primitive: DES-3
      tech: "guard de auth (auth/AuthGuard.kt) + registro de rutas (routes/RouteTable.kt: las escrituras dentro de authenticated{}); analizador estático determinista (tools/route_check.py modo auth, stdlib, sin levantar server) cruza las rutas Kotlin contra el contrato. Ktor server vivo = declared-deferred (s7/s9)"
      artifact: build/product/src/main/kotlin/{{package_name}}/auth/AuthGuard.kt
      proof: "s5 auth_reachability: route_check.py (auth) exige que toda op con `security` en el contrato esté dentro de authenticated{}; rerutear un POST fuera del guard → UNGUARDED (rojo); el probe sucio embebido DEBE morder cada corrida (fail-closed)"
      status: built
    - id: topologia_rutas_verificable
      invariant: "el mapa de rutas es chequeable estáticamente contra el contrato OpenAPI (sin levantar el server): una ruta sin contrato o un contrato sin ruta → rojo"
      primitive: DES-2
      tech: "analizador estático determinista (tools/route_check.py modo topology, stdlib) que extrae las rutas Kotlin por tokens y las cruza contra openapi.yaml (fuente única, DES-6)"
      artifact: build/product/src/main/kotlin/{{package_name}}/routes/RouteTable.kt
      proof: "s5 route_topology: route_check.py (topology) exige set(rutas) == set(contrato); una ruta sin contrato → EXTRA / un contrato sin ruta → MISSING (rojo); el probe sucio embebido DEBE morder cada corrida (fail-closed)"
      status: built
    - id: logica_dominio_generada
      invariant: "la lógica de negocio se GENERA por un LLM vivo (claude -p, slot generate) y un contract test la EJERCITA en el toolchain del producto; un stub no pasa (el anti-patrón de domain vacío de F1 bloquea); el artefacto se pinea (§7) y re-derive lo verifica sin LLM"
      primitive: DES-8
      tech: "claude -p (slot generate, ADR-013) como `via` (wrapper codegen/gen_llm.py); contract gate = un main() de aserciones corrido por gradle `run` (idiom JavaExec del producto, igual que roundtrip s1); el módulo domain_gen vive decoupleado de build/product (tracked) → el LLM-artefacto Summary.kt se pinea (skip_if_exists). Kotest+Testcontainers+Playwright = pirámide s7 (declared-deferred, ADR-012)"
      artifact: domain_gen/src/main/kotlin/domain/Summary.kt
      proof: "s6: gradle run compila Model.kt + el Summary.kt GENERADO + SummaryContract.kt y corre el contract main; un stub o una implementación incorrecta → rojo; pin re-verificado sin LLM"
      status: built
    - id: pruebas_piramidales
      invariant: "la verificación corre en el toolchain DEL producto en una pirámide GRADUADA: unit (sin infra) + integración (PostgreSQL viva) + contrato; un test roto bloquea — y un probe negativo embebido prueba que el runner no es decorativo (0 tests → verde es fachada)"
      primitive: DES-8
      tech: "Kotest sobre JUnit Platform: tier unit (src/test, sin infra) + tier integración (src/integrationTest, Repository vs PostgreSQL viva por infra_up, como Testcontainers); tier unit TS por node:test (stdlib, dual-lenguaje); diente negativo embebido (gradle testProbe: un test que DEBE fallar). Contrato ya cubierto por s0 (compile) + s6 (contract main). Playwright/e2e (browser + server HTTP vivo) = declared-deferred (ADR-012, mismo shape que Ktor→estático de s5): necesita red para el binario de browser y un server vivo, diferido a s9"
      artifact: build/product/src/test/
      proof: "s7 pyramid_unit: gradle test (suite unit) verde + testProbe DEBE reportar FAILED (o decorativo→rojo); s7 pyramid_integration: gradle integrationTest contra PostgreSQL viva (DB caída→rojo); s7 pyramid_unit_ts: node:test del client verde + un probe TS que DEBE fallar; romper cualquier nivel → rojo"
      status: built
    - id: workflow_enforced
      invariant: "un campo enum con ciclo de vida declara su máquina de estado (initial + transitions) y un guard DETERMINISTA (sin LLM, I-3) la enforza: una transición declarada es válida, una no declarada se rechaza por construcción (no-salteable, DES-3)"
      primitive: DES-3
      tech: "gramática del blueprint (domain.product): un enum gana initial/transitions opcionales (R2/FSK-S12) → el codegen emite un guard type-safe (workflow/<Entity><Field>Workflow.kt: canTransition derivado del mapa, type-bound al enum class del contrato) + un test de DOS lados (tier workflowTest, Kotest). El contrato documenta la máquina como x-initial/x-transitions (DES-6, inspectable). Opt-in: un enum sin transitions no emite nada (FSK-S11 intacto)"
      artifact: build/product/src/main/kotlin/{{package_name}}/workflow/
      proof: "s7 workflow_enforced: gradle workflowTest verde — una transición declarada VÁLIDA pasa Y una INVÁLIDA es rechazada (diente de dos lados); romper canTransition (aceptar todo) → falla el lado inválido (o rechazar todo → falla el válido) → rojo; tamper del `enum:` del contrato → el guard no compila (DES-6)"
      status: built
    - id: rbac_enforced
      invariant: "una operación de ESCRITURA declara qué roles la pueden ejecutar (write_roles) y un guard DETERMINISTA (sin LLM, I-3) lo enforza: un rol autorizado escribe, uno no-autorizado se rechaza por construcción — autorización por rol encima de la autenticación de s5 (RBAC, no-salteable, DES-3)"
      primitive: DES-3
      tech: "gramática del blueprint (domain.product): `roles` (universo) + `write_roles` por entidad (R2/FSK-S13) → el codegen emite un enum Role type-safe (auth/Role.kt) + RoleGuard (auth/RoleGuard.kt: authorize(token, required) cruza el rol del token contra el set requerido) + el RouteTable registra cada escritura con su Set<Role> + un test de DOS lados (tier unit, Kotest). El contrato documenta los roles requeridos como x-required-roles (DES-6, inspectable); route_check.py (modo rbac) cruza el set del contrato contra el registrado en el Kotlin. Opt-in: una entidad sin write_roles (o un producto sin roles) → sólo autenticación (FSK-S5 intacto)"
      artifact: build/product/src/main/kotlin/{{package_name}}/auth/RoleGuard.kt
      proof: "s5 rbac_enforced: route_check.py (rbac) exige que cada op con x-required-roles esté registrada en el RouteTable con ESE set de roles; un set distinto (tamper del contrato sin tocar el Kotlin, o viceversa) → ROLE_MISMATCH (rojo); el probe sucio embebido (probe/routes/wrong_roles.kt, roles equivocados) DEBE morder (ROLE_MISMATCH) o decorativo→rojo. El test de dos lados (tier unit, RoleGuardTest) ejercita el guard en runtime: rol permitido ✓ / no-permitido ✗; romper RoleGuard → rojo"
      status: built
    - id: ownership_enforced
      invariant: "una entidad declara qué campo identifica al DUEÑO de cada fila (owned_by) y un guard DETERMINISTA (sin LLM, I-3) lo enforza: un actor no-privilegiado sólo modifica las filas que le PERTENECEN (su principal == el dueño); un rol de owner_bypass_roles bypassa — autorización a nivel de FILA (ownership / ABAC acotado, no-salteable, DES-3) encima del RBAC de s5"
      primitive: DES-3
      tech: "gramática del blueprint (domain.product): `owned_by` por entidad (el campo ref dueño) + `owner_bypass_roles` (R2/FSK-S14) → el codegen emite OwnershipGuard.canModify (auth/OwnershipGuard.kt, genérico type-safe sobre Role) + el registro OwnershipPolicy (auth/OwnershipPolicy.kt: entidad→campo dueño, derivado del blueprint) + un test de DOS+ lados (tier unit, Kotest, type-bound al model del contrato). El contrato documenta el dueño como x-owned-by (DES-6, inspectable); route_check.py (modo ownership) cruza el campo del contrato contra el registrado en el Kotlin. Opt-in: una entidad sin owned_by → sólo RBAC (FSK-S13 intacto)"
      artifact: build/product/src/main/kotlin/{{package_name}}/auth/OwnershipGuard.kt
      proof: "s5 ownership_enforced: route_check.py (ownership) exige que cada entidad con x-owned-by esté registrada en OwnershipPolicy con ESE campo; un campo distinto (tamper del contrato sin tocar el Kotlin, o viceversa) → OWNER_MISMATCH (rojo); el probe sucio embebido (probe/routes/wrong_owner.kt, campo equivocado) DEBE morder (OWNER_MISMATCH) o decorativo→rojo. El test de dos+ lados (tier unit, OwnershipGuardTest) ejercita el guard en runtime: el dueño modifica ✓ / un no-dueño es rechazado ✗ / un rol de bypass bypassa ✓; romper OwnershipGuard → rojo"
      status: built
    - id: calidad_experiencia
      invariant: "la accesibilidad (WCAG) y la performance se miden con gates que BLOQUEAN bajo umbral; un output degradado DEBE flipear el gate (no decorativo)"
      primitive: DES-7
      tech: "eval_gate (DES-7, ya general): a11y = axe-core (motor WCAG) HEADLESS en jsdom (sin browser) sobre la UI generada; perf = presupuesto de bundle-size con esbuild (bundle minificado del entry). Lighthouse (lab metrics: server HTTP vivo + Chrome headless por red) = declared-deferred (ADR-012, shape de Playwright→e2e de s7)"
      artifact: build/product/frontend/ui/index.html
      proof: "s8 a11y_gate: axe+jsdom audita la UI generada → a11y_pass_rate ≥ 1.0 (cero violaciones); un fixture de UI mala flipea (degraded). s8 perf_budget_gate: esbuild mide el bundle → perf_budget_ratio (budget/bytes) ≥ 1.0; un entry bloated flipea. Un scorer decorativo → rojo"
      status: built
    - id: observabilidad_producto
      invariant: "el producto EMITE observabilidad: logs estructurados + tracing OTel con correlation-id + endpoints /health y /ready; verificado que emite (no que renderiza)"
      primitive: DES-5
      tech: "server HTTP vivo del JDK (com.sun.net.httpserver, stdlib — NO Ktor, divergencia ADR-012) instrumentado con OpenTelemetry SDK real (SpanExporter a archivo) + logs estructurados JSON, ambos con correlation-id + /health·/ready; verificado por requests reales contra el server vivo (infra_up). Ktor completo + e2e Playwright (s7) + Lighthouse (s8) = declared-deferred"
      artifact: build/product/src/main/kotlin/{{package_name}}/observability/ObsServer.kt
      proof: "s9 observability_live (infra_up): levanta el server HTTP del producto; el proof hace /health+/ready+una request instrumentada y exige que el span OTel y el log estructurado emitidos lleven el correlation-id; server caído → rojo (diente nativo); quitar la instrumentación → el cid no aparece → rojo"
      status: built
    - id: control_acceso_runtime
      invariant: "el control de acceso se ENFORZA a RUNTIME: un server HTTP vivo monta las rutas del contrato para la entidad con dueño e INVOCA los guards generados (auth → RBAC → ownership) + persiste/lee contra la PostgreSQL viva (Repository); ninguna request real saltea el control"
      primitive: DES-3
      tech: "server HTTP vivo del JDK (com.sun.net.httpserver, stdlib — NO Ktor, divergencia ADR-012) que monta GET/POST/PUT de la entidad con dueño e invoca RoleGuard (RBAC) + OwnershipGuard (principal del token vs dueño de la fila cargado de la PG viva via Repository) ANTES de ejecutar; verificado e2e por un proof client urllib (requests reales) que asevera el veredicto de autorización de DOS+ lados. JWT/identidad real + frontend que consume (React) + e2e Playwright = declared-deferred (token estático Bearer <rol>:<principal>)"
      artifact: build/product/src/main/kotlin/{{package_name}}/endpoints/AppServer.kt
      proof: "s9 access_control_live (infra_up): levanta la PostgreSQL viva + el server HTTP del producto; el proof client hace requests REALES y exige POST rol prohibido → 403 / permitido → 201 · PUT fila ajena por no-dueño → 403 / por dueño → 200 / por rol de bypass → 200; saboteá un guard → el 403 se vuelve 200 → rojo; server caído → rojo (diente nativo de infra_up)"
      status: built
    - id: crud_mutacion_runtime
      invariant: "el server vivo no sólo DECIDE el acceso: MUTA el estado real bajo ese control — POST inserta una fila (dueño = el principal del actor), PUT actualiza una columna escalar, DELETE la borra; todo type-bound al schema (DES-12) y observable end-to-end (un GET posterior ve el cambio). Un 200/201 que no muta es el anti-patrón decorativo que el round-trip caza"
      primitive: DES-3
      tech: "el server HTTP vivo (com.sun.net.httpserver) ejecuta la mutación DESPUÉS del veredicto OK de los guards (RBAC + ownership): POST inserta vía Repository.insert<E>(ownerId = principal del token; columnas UNIQUE con valor único en runtime para no chocar con el seed) tipado jOOQ y devuelve el id; PUT actualiza la 1ª columna string no-unique no-dueño vía Repository.update<E><Col>; DELETE borra vía Repository.delete<E>; + rutas vivas GET /<plural>/{id} (lee la fila) y DELETE /<plural>/{id}. El body-parsing de JSON real ya NO es deferral: lo cubre entrada_tipada_runtime (REQ-F-016). CRUD de entidades SIN dueño ya NO es deferral total: la 1ª ownerless servible lo cubre crud_ownerless_runtime (REQ-F-019, RBAC-only); el resto de las ownerless + refs-en-el-body = declared-deferred"
      artifact: build/product/src/main/kotlin/{{package_name}}/Repository.kt
      proof: "s9 access_control_live (infra_up): el proof client hace el ROUND-TRIP e2e — POST (rol permitido, dueño sembrado) → count+1 · PUT (por el dueño) → GET /{id} ve el valor nuevo · DELETE (por el dueño) → count vuelve, GET /{id} → 404; + los dientes de acceso siguen (rol prohibido → 403 y count NO cambia; no-dueño → 403 y la fila NO cambia). Una mutación decorativa (200/201 que no toca la DB) → el round-trip falla (verificado vivo: UPDATE que matchea 0 filas → el value-check rojo)"
      status: built
    - id: entrada_tipada_runtime
      invariant: "el server vivo acepta el CUERPO real del request y lo persiste TYPE-COERCED por el schema (DES-12): POST inserta una fila con los valores del body (no samples fijos), GET /<plural>/{id} devuelve la fila COMPLETA type-correct (un int es int, un string es string), PUT actualiza la columna escalar al valor del body (PATCH-like). El input es fail-closed: body malformado / tipo equivocado / required ausente → 400 (no 500, no se traga). El dueño viene del token (no del body) → no rompe el FK"
      primitive: DES-12
      tech: "el server HTTP vivo (com.sun.net.httpserver) parsea el cuerpo con kotlinx.serialization.json (dep INTENCIONAL de la fábrica → sin hand-roll, no viola ADR-012): cada campo escalar requerido no-dueño se coerce a su tipo Kotlin (String/Int/Double/Boolean/LocalDate/enum∈values) en un data class <E>Input; un número crudo donde va string (o viceversa), un enum fuera de su universo, un JSON roto o un required ausente → excepción → 400. Repository.insert<E> persiste los valores del body type-bound jOOQ (DES-12); GET /<plural>/{id} lee la fila completa y la serializa type-correct. Refs requeridos no-dueño en el body + PUT-total (replace) vs PATCH-split + UNIQUE-from-body → 409 = declared-deferred"
      artifact: build/product/src/main/kotlin/{{package_name}}/endpoints/AppServer.kt
      proof: "s9 access_control_live (infra_up): el proof client postea un cuerpo con valores DISTINTOS de los samples → GET /<plural>/{id} trae EXACTAMENTE esos valores type-correct (un server que ignora el body mete samples ≠ lo posteado → rojo; verificado vivo: saboteado un campo → 'esperaba ready, obtuvo pending' → rojo); body JSON inválido / tipo equivocado → 400 (no 201, no 500); PUT con el body → GET ve el valor del body; + los dientes de FSK-S16 (count round-trip) y de acceso (403 sin mutar) intactos"
      status: built
    - id: crud_ownerless_runtime
      invariant: "la capa VIVA deja de ser opt-in a `owned_by`: una entidad SIN dueño también tiene CRUD vivo a runtime, gobernado por RBAC-only (no hay dueño que cargar → sin OwnershipGuard). El server monta una 2ª entidad (la 1ª ownerless servible) con POST/GET-lista/GET-{id}/DELETE: un rol prohibido → 403 sin INSERT, un rol permitido → 201 + INSERT de los escalares del cuerpo; el DOMINIO ENTERO (no sólo la entidad con dueño) empieza a ser usable a runtime"
      primitive: DES-3
      tech: "el AppServer (com.sun.net.httpserver) monta TAMBIÉN la 1ª entidad ownerless con write_roles cuyos campos requeridos son TODOS escalares (heurística DATA-agnóstica, ADR-012: User/Holder/Company en los 3 productos): handlers SUFIJADOS por entidad (doPost<E>/listAll<E>/getOne<E>/doDelete<E>/handle<E>) con verdict RBAC-only (RoleGuard.authorize, sin OwnershipGuard ni ownerId del token); INSERT de TODOS los escalares del cuerpo vía Repository.insert<E>(ctx, input) tipado jOOQ (sin la firma de dueño); codec del cuerpo COMPARTIDO sobre la unión de entidades servidas (helpers prim/str/parse<E>Input emitidos una vez, sin colisión). Refs requeridos en el body (espinazo relacional) + PUT/update ownerless + CRUD de TODAS las ownerless (no sólo la 1ª) + producto sólo-ownerless (sin entidad-ancla con dueño) = declared-deferred (eje hermano)"
      artifact: build/product/src/main/kotlin/{{package_name}}/endpoints/AppServer.kt
      proof: "s9 access_control_live (infra_up: el MISMO check, extendido): el proof client ejercita la entidad ownerless de DOS lados — POST rol PROHIBIDO → 403 y el count NO cambia / rol PERMITIDO → 201 + count+1; el round-trip del cuerpo (POST {valores ≠ samples} → GET /<plural>/{id} type-correct); body tipo equivocado → 400; DELETE rol prohibido → 403 (sin borrar) / permitido → 200 y GET /{id} → 404. Saboteá el guard RBAC ownerless (que un rol prohibido pase) → SÓLO access_control_live rojo (hermanos s9 verdes) → verificado vivo; server caído → rojo (diente nativo de infra_up)"
      status: built
    - id: frontend_consume_live
      invariant: "el frontend CONSUME el backend vivo: el cliente TS GENERADO hace fetch REAL contra el AppServer (PG viva detrás) y el round-trip e2e cruza el MISMO protocolo de cable que el server generado — contrato → client.fetch → server vivo → PG → respuesta → client.parse; el frontend deja de ser funciones puras que nunca llaman al server"
      primitive: DES-6
      tech: "el cliente generado (frontend/src/client.ts) gana create<E>/get<E> que hacen `fetch` REAL contra el AppServer; type-bound al contrato (Pick<components[\"schemas\"][<E>], …> → un drift del contrato rompe tsc --strict en s2, DES-6) y res.json() narrow desde `unknown` (ts-reset, sin `any`, DES-10). `fetch` global (DOM lib / Node 18+, sin dep nueva → no viola ADR-012). Un consumer node (frontend/consume_check.ts) IMPORTA esas funciones y corre el round-trip contra el server vivo por `node --experimental-strip-types` (idiom de s7, sin paso de compilación). El render de la lista viva lo cubre REQ-F-018 (frontend_render_live); render EN BROWSER (mount/eventos) + el form que postea, deploy (Dockerfile vivo) + e2e Playwright (browser) = declared-deferred — este eslabón es la CAPA CLIENTE que consume"
      artifact: build/product/frontend/src/client.ts
      proof: "s9 frontend_consume_live (infra_up: PG viva + AppServer en puerto/PG propios): el cliente generado create<E>(body ≠ samples) POSTea → get<E>(id) GETea → cada campo posteado vuelve EXACTO y type-correct; un cliente que devuelve un literal / ignora la respuesta del server → mismatch → rojo; un body de tipo equivocado → 400 → el cliente lo propaga (un cliente que no chequea res.ok lo traga → rojo); server caído → fetch tira → rojo (diente nativo de infra_up). Opt-in: sin owned_by no se emite el cliente vivo (FSK-S15 intacto)"
      status: built
    - id: frontend_render_live
      invariant: "la UI RENDERIZA la lista VIVA: el server LISTA las filas (GET /<plural> → {count,rows[]}), el cliente generado las TRAE (list<E>) y la función de render generada (render<E>List) las renderiza a markup que refleja la COLECCIÓN viva de la PG; el render deja de ser una función pura que nadie alimenta con datos del server"
      primitive: DES-6
      tech: "el server (AppServer) extiende GET /<plural> a {\"count\":N,\"rows\":[<rowJson>,…]} — backward-compat (count SIGUE primero → access_control_check.py intacto), cada fila vía Repository.all<E>RowsJson (mapea all<E>s → <e>RowJson, REUSA la serialización type-correct, DES-12). El cliente (frontend/src/client.ts) gana list<E>(base): Promise<<E>[]> (GET → .rows; res.json() narrow desde `unknown` a `unknown[]` sin `any`, ts-reset/DES-10; el callsite castea a <E>[] type-bound al contrato). El render generado (frontend/src/app.ts: render<E>List, ya type-bound a components[\"schemas\"][<E>], DES-6) renderiza el 1er campo string/enum de la entidad CON DUEÑO (la única con capa viva). El consumer node (consume_check.ts) trae la lista viva y asevera que el markup la refleja. Render EN BROWSER (mount/eventos) + el form que postea, deploy (Dockerfile vivo) + e2e Playwright = declared-deferred"
      artifact: build/product/frontend/src/app.ts
      proof: "s9 frontend_consume_live (infra_up: el MISMO check que CONSUME, extendido): tras el round-trip create<E>→get<E>, el consumer hace list<E>(base) → render<E>List(rows) y asevera que el html refleja la LISTA VIVA — la fila recién creada está en la lista traída (un list<E> truncado/stale → rojo) y el markup contiene el campo renderizado de CADA fila viva (un render que dropea/garbla/hardcodea filas → html ≠ lista viva → rojo); server caído → fetch tira → rojo (diente nativo). Opt-in: sin owned_by no se emite"
      status: built
    - id: build_hermetico_reproducible
      invariant: "el build es hermético y reproducible: toolchain pineado; el artefacto compilado sale byte-idéntico entre builds limpios offline; el producto shippea su propia mini-columna (CI que re-corre los gates)"
      primitive: DES-1
      tech: "reproducibilidad DECLARADa del build Gradle (AbstractArchiveTask: preserveFileTimestamps=false, reproducibleFileOrder=true → jar byte-idéntico) + mini-columna del producto ci.sh (re-corre los gates estáticos offline) + proof tools/hermetic_check.py (jar ×2 offline byte-idéntico + ci.sh --check/--probe + pin del Dockerfile/wrapper); toolchain pineado (Gradle wrapper sha256, JDK 21, base Docker por @sha256:). Build+push de la imagen Docker reproducible = declared-deferred (red+daemon, ADR-012)"
      artifact: build/product/ci.sh
      proof: "s10 hermetic_build (product_env): build del jar ×2 offline → SHA256 idéntico (reproducible+hermético, lo que s0 NO da); la mini-columna ci.sh re-corre sus gates offline (--check); diente fail-closed (ci.sh --probe sobre un probe sucio DEBE morder); flip de preserveFileTimestamps → jars difieren → rojo. Fan-in DAG (depends_on s2,s3,s4,s7,s8,s9): romper un predecesor → s10 SHUT"
      status: built

  # La LÍNEA DE PRODUCTO como DATO (C2/I-2). status: planned — los `builds`/`checks` ejecutables los
  # rellena el build (plantilla: specs/full-stack.factory.spec.yml). Acá se declara el CONTRATO SDD
  # (proof_checks) que los requisitos citan en verified_by. depends_on arma el DAG; s10 es fan-in (P2/H2).
  station_sequence:
    - id: s0
      name: "scaffold + contrato OpenAPI (fuente única) + aislamiento — DES-1/6/9"
      activation: always
      status: built
      proof_checks:
        - { name: contract_single_source, cmd: "kotlinc + tsc --strict sobre el código generado del contrato; drift → rojo", runs_in: product_env, toolchain: "openapi-codegen", status: built }
        - { name: scaffold_idempotent, cmd: "regenerar desde el spec produce un árbol idéntico", runs_in: factory_env, toolchain: "metafactory", status: built }
        - { name: isolation_boundary, cmd: "el producto corre en su toolchain; cargar la fábrica adentro → rojo", runs_in: product_env, toolchain: "gradle-npm", status: built }
      builds:
        - action: generate
          dest: build/product/MANIFEST.txt
          brief: "Generá el producto Full-Stack Kotlin en build/product/ desde domain.product: openapi.yaml (contrato fuente única), build Gradle pineado con openApiGenerate (models Kotlin), handler+app que usan los models, client TS con openapi-typescript, wrapper Gradle vendorizado. compileKotlin y tsc --strict deben pasar."
          via: [python3, codegen/scaffold_product.py]
      checks:
        - name: contract_single_source
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) ./gradlew compileKotlin -q --console=plain"]
        - name: contract_client_ts
          kind: product_env
          workdir: build/product/frontend
          bootstrap: [npm, install, --no-audit, --no-fund, --loglevel=error]
          cmd: ["sh", "-c", "./node_modules/.bin/openapi-typescript ../openapi.yaml -o gen/api.ts && ./node_modules/.bin/tsc -p tsconfig.json"]
        - name: scaffold_idempotent
          kind: command
          # El generador (codegen/) vive en la FÁBRICA (chassis), no en cada instancia (R1/ADR-015): para el
          # producto default cwd==fábrica → `codegen/`; para una instancia cwd==products/<p>/ → `../../codegen`.
          # Resolución relativa (sin path absoluto, portable). METAFACTORY_ROOT default==cwd lee el blueprint correcto.
          cmd: ["sh", "-c", "cg=codegen; [ -d \"$cg\" ] || cg=../../codegen; python3 \"$cg/scaffold_product.py\" --check-idempotent"]
        - name: isolation_boundary
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "python3 -c 'import metafactory' 2>/dev/null && { echo LEAK; exit 1; } || exit 0"]
    - id: s1
      name: "capa de datos: schema versionado (Flyway) + jOOQ tipado (DES-12) + PostgreSQL VIVA por infra_up (DES-4)"
      activation: always
      depends_on: [s0]
      # DES-12 hermético: jOOQ (DDLDatabase) deriva los tipos del schema versionado db/migration/*.sql y
      # compileKotlin gatea — un drift de columna → Unresolved reference (sin DB viva). DES-4: el round-trip
      # del PRODUCTO (Flyway migrate + jOOQ create/list) corre contra una PostgreSQL VIVA (contenedor pineado
      # por digest) que infra_up levanta; DB caída → rojo (diente de dos lados, MAT-3). El codegen (s0) ya
      # emite migración + Repository + DbRoundTrip → builds: [] (la estación sólo PRUEBA).
      proof_checks:
        - { name: schema_checked, cmd: "jooqCodegen (DDLDatabase de db/migration/*.sql) + compileKotlin; un drift de columna → Unresolved reference", runs_in: product_env, toolchain: "jooq-kotlinc", status: built }
        - { name: db_roundtrip_live, cmd: "round-trip create+list del producto (Flyway+jOOQ) contra PostgreSQL viva; DB caída → rojo", runs_in: product_env, toolchain: "gradle-postgres", status: built }
      builds: []
      checks:
        - name: schema_checked
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) ./gradlew jooqCodegen compileKotlin -q --console=plain"]
        - name: db_roundtrip_live
          kind: infra_up
          workdir: build/product
          bootstrap: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) exec ./gradlew classes -q --console=plain"]
          up: ["sh", "-c", "docker rm -f fsk_s1_pg >/dev/null 2>&1; exec docker run --rm --name fsk_s1_pg -e POSTGRES_PASSWORD=metafactory -p 5434:5432 postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb"]
          proof: ["sh", "-c", "JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) exec ./gradlew roundtrip -q --console=plain"]
          down: ["docker", "rm", "-f", "fsk_s1_pg"]
          timeout: 120
    - id: s2
      name: "dureza estática: detekt (+ reglas ktlint) + `-Werror` (Kotlin) · ESLint strict + no-explicit-any + ts-reset (TS) — DES-10"
      activation: always
      depends_on: [s1]
      # DES-10 — el producto falla FUERTE por CALIDAD (no sólo tipos). Kotlin: detekt corre el análisis de
      # calidad + las reglas ktlint (detekt-formatting, UN tool) sobre el código AUTORADO (src/main/kotlin;
      # los fuentes generados openapi/jOOQ quedan fuera por construcción) con maxIssues:0, y `-Werror`
      # (allWarningsAsErrors) vuelve error TODO warning de kotlinc. TS: ESLint strict + no-explicit-any sobre
      # src/ (gen/ fuera). Cada check lleva su DIENTE NEGATIVO EMBEBIDO (no-decorativo, cada corrida): el MISMO
      # linter sobre un fixture sucio (probe/, fuera de src → no se shippea) DEBE morder — se exige el hallazgo
      # por grep (SwallowedException / no-explicit-any), fail-closed. El codegen (s0) ya emite la config + los
      # probes → builds: [] (la estación sólo PRUEBA). Sustrato intacto: product_env corre DATA (ADR-012).
      proof_checks:
        - { name: static_hardness_kotlin, cmd: "detekt (maxIssues:0) + compileKotlin (-Werror) sobre el producto; detektProbe sobre probe/ DEBE morder (SwallowedException) o decorativo→rojo", runs_in: product_env, toolchain: "detekt-kotlinc", status: built }
        - { name: static_hardness_ts, cmd: "eslint strict+no-explicit-any sobre src/; eslint sobre probe/ DEBE morder (no-explicit-any) o decorativo→rojo", runs_in: product_env, toolchain: "eslint", status: built }
      builds: []
      checks:
        - name: static_hardness_kotlin
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "JH=$(dirname $(dirname $(readlink -f $(command -v javac)))); JAVA_HOME=$JH ./gradlew detekt compileKotlin -q --console=plain || exit 1; JAVA_HOME=$JH ./gradlew detektProbe --console=plain 2>&1 | grep -q SwallowedException || { echo FSK_HARDNESS_DECORATIVE_KOTLIN; exit 1; }; echo FSK_HARDNESS_OK_KOTLIN"]
        - name: static_hardness_ts
          kind: product_env
          workdir: build/product/frontend
          bootstrap: ["npm", "install", "--no-audit", "--no-fund", "--loglevel=error"]
          cmd: ["sh", "-c", "./node_modules/.bin/eslint 'src/**/*.ts' || exit 1; ./node_modules/.bin/eslint 'probe/**/*.ts' 2>&1 | grep -q no-explicit-any || { echo FSK_HARDNESS_DECORATIVE_TS; exit 1; }; echo FSK_HARDNESS_OK_TS"]
    - id: s3
      name: "frescura de API: oráculo de superficie pineado + linter determinista (sin LLM) — DES-11"
      activation: always
      depends_on: [s2]
      # DES-11 — el código generado usa SÓLO superficie no-deprecada y pineada; lo viejo se bloquea de forma
      # DETERMINISTA (I-3, sin LLM). El codegen (s0) emite el ORÁCULO config/api-surface.lock (versiones
      # pineadas + deny-list de símbolos deprecados/stale por versión) + el linter stdlib tools/currency_lint.py
      # (parte de la mini-columna del PRODUCTO, s10) → builds: [] (la estación sólo PRUEBA). UN linter
      # language-agnostic cruza Kotlin (src/main/kotlin) Y TS (frontend/src) contra UN lock — el anti-overfit
      # más fuerte (un mecanismo general por DATA, dos lenguajes). Eje DISTINTO de s2 (calidad): acá frescura;
      # cubre lo que el compilador CALLA (java.util.Date legacy en Kotlin; .substr() en TS). Diente NEGATIVO
      # EMBEBIDO (no-decorativo, cada corrida): el MISMO linter sobre fixtures sucios (probe/currency,
      # frontend/probe-currency, FUERA de src → no se shippean) DEBE morder — se exige el hallazgo por grep
      # (toUpperCase Kotlin + substr TS), fail-closed. Sustrato intacto: product_env corre DATA (ADR-012).
      proof_checks:
        - { name: currency_gate, cmd: "el linter determinista cruza src/main/kotlin+frontend/src vs config/api-surface.lock → 0; sobre probe/currency+frontend/probe-currency DEBE morder (toUpperCase+substr) o decorativo→rojo", runs_in: product_env, toolchain: "currency-linter", status: built }
      builds: []
      checks:
        - name: currency_gate
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "python3 tools/currency_lint.py src/main/kotlin frontend/src || exit 1; out=$(python3 tools/currency_lint.py probe/currency frontend/probe-currency 2>&1); echo \"$out\" | grep -q toUpperCase || { echo FSK_CURRENCY_DECORATIVE_KOTLIN; exit 1; }; echo \"$out\" | grep -q substr || { echo FSK_CURRENCY_DECORATIVE_TS; exit 1; }; echo FSK_CURRENCY_OK"]
    - id: s4
      name: "seguridad de la cadena de suministro: SBOM + oráculo de advisories pineado + scanner determinista (sin red, sin LLM) — DES-13"
      activation: always
      depends_on: [s3]
      # DES-13 — el producto no shippea deps con vulnerabilidades conocidas ni secretos hardcodeados, gateado
      # de forma DETERMINISTA (I-3, sin red). El codegen (s0) emite el SBOM sbom.json (CycloneDX-lite de deps
      # directas), el ORÁCULO config/supply-chain.lock (advisories reales coordinate@rango→CVE + patrones de
      # secretos) y el scanner stdlib tools/supply_chain_scan.py (parte de la mini-columna del PRODUCTO, s10)
      # → builds: [] (la estación sólo PRUEBA). UN scanner general por DATA cubre DOS ejes: deps vulnerables
      # (cruza el SBOM vs los advisories) + secretos (escanea src/main/kotlin+frontend/src) — anti-overfit (un
      # mecanismo, dos ejes/ecosistemas). Eje DISTINTO de s2 (calidad) y s3 (frescura): acá seguridad de la
      # cadena. Diente NEGATIVO EMBEBIDO (no-decorativo, cada corrida): el MISMO scanner sobre fixtures sucios
      # (probe/security/vuln-sbom.json con lodash/postgresql@42.7.1; probe/security/leak.txt con AKIA…, FUERA de
      # src → no se shippean) DEBE morder — se exige el hallazgo por grep (lodash + aws-access-key), fail-closed.
      # Sustrato intacto: product_env corre DATA (ADR-012). Feed vivo (OSV/npm audit) + SBOM transitivo =
      # declared-deferred (mismo shape que el MCP-recall de s3).
      proof_checks:
        - { name: supply_chain_gate, cmd: "el scanner cruza sbom.json vs config/supply-chain.lock (deps) + escanea src/main/kotlin+frontend/src (secretos) → 0; sobre probe/security DEBE morder (lodash + aws-access-key) o decorativo→rojo", runs_in: product_env, toolchain: "supply-chain-scanner", status: built }
      builds: []
      checks:
        - name: supply_chain_gate
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "python3 tools/supply_chain_scan.py deps sbom.json || exit 1; python3 tools/supply_chain_scan.py secrets src/main/kotlin frontend/src || exit 1; dout=$(python3 tools/supply_chain_scan.py deps probe/security/vuln-sbom.json 2>&1); echo \"$dout\" | grep -q lodash || { echo FSK_SUPPLYCHAIN_DECORATIVE_DEPS; exit 1; }; sout=$(python3 tools/supply_chain_scan.py secrets probe/security 2>&1); echo \"$sout\" | grep -q aws-access-key || { echo FSK_SUPPLYCHAIN_DECORATIVE_SECRETS; exit 1; }; echo FSK_SUPPLYCHAIN_OK"]
    - id: s5
      name: "auth no-salteable + topología de rutas: guard (DES-3) + AST de rutas vs contrato (DES-2), estático sin levantar server"
      activation: always
      depends_on: [s4]
      # DES-3/DES-2 — el producto gana TRES gates de rutas, todos ESTÁTICOS (sin levantar HTTP) y DETERMINISTAS
      # (I-3, sin LLM, sin red). El codegen (s0) emite el guard auth/AuthGuard.kt + el registro routes/
      # RouteTable.kt (Kotlin REAL: las escrituras dentro de authenticated{} → guarded) + el analizador stdlib
      # tools/route_check.py (parte de la mini-columna del PRODUCTO, s10) → builds: [] (la estación sólo PRUEBA).
      # UN analizador general por DATA cubre TRES ejes: alcanzabilidad de auth (toda op con `security` en el
      # contrato está dentro del guard) + topología (set de rutas == contrato) + RBAC (R2/FSK-S13: cada
      # escritura con x-required-roles registrada con ESE set de roles — autorización por rol, opt-in). El
      # contrato openapi.yaml es la FUENTE de "qué está protegido / qué rol exige" (DES-6). Eje DISTINTO de
      # s2/s3/s4 (calidad/frescura/seguridad-de-cadena): acá RUTAS. Diente NEGATIVO EMBEBIDO (no-decorativo, cada
      # corrida): el MISMO analizador sobre fixtures sucios (probe/routes/phantom.kt con una ruta sin contrato;
      # probe/routes/unguarded.kt con un POST fuera del guard; probe/routes/wrong_roles.kt con un set de roles
