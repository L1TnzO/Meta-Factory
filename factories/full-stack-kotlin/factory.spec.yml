      # = declared-deferred (s7 pirámide / s9 observabilidad), mismo shape que el feed-vivo diferido de s4.
      proof_checks:
        - { name: auth_reachability, cmd: "route_check.py (auth) exige que toda op con `security` en el contrato esté dentro de authenticated{}; un POST fuera del guard → UNGUARDED; sobre probe/routes/unguarded.kt DEBE morder (UNGUARDED) o decorativo→rojo", runs_in: product_env, toolchain: "route-analyzer", status: built }
        - { name: route_topology, cmd: "route_check.py (topology) exige set(rutas Kotlin) == set(contrato openapi.yaml); ruta sin contrato → EXTRA / contrato sin ruta → MISSING; sobre probe/routes/phantom.kt DEBE morder (EXTRA) o decorativo→rojo", runs_in: product_env, toolchain: "route-analyzer", status: built }
        - { name: rbac_enforced, cmd: "route_check.py (rbac, RBAC/FSK-S13) exige que cada op con x-required-roles esté registrada en el RouteTable con ESE set de roles; un set distinto → ROLE_MISMATCH; sobre probe/routes/wrong_roles.kt DEBE morder (ROLE_MISMATCH) o decorativo→rojo. Opt-in: un producto sin roles → 0 ops, verde (FSK-S5 intacto)", runs_in: product_env, toolchain: "route-analyzer", status: built }
        - { name: ownership_enforced, cmd: "route_check.py (ownership, FSK-S14) exige que cada entidad con x-owned-by esté registrada en OwnershipPolicy con ESE campo dueño; un campo distinto → OWNER_MISMATCH; sobre probe/routes/wrong_owner.kt DEBE morder (OWNER_MISMATCH) o decorativo→rojo. Opt-in: un producto sin owned_by → 0 entidades, verde (FSK-S13 intacto)", runs_in: product_env, toolchain: "route-analyzer", status: built }
      builds: []
      checks:
        - name: auth_reachability
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "python3 tools/route_check.py auth openapi.yaml src/main/kotlin || exit 1; out=$(python3 tools/route_check.py auth openapi.yaml probe/routes/unguarded.kt 2>&1); echo \"$out\" | grep -q UNGUARDED || { echo FSK_AUTH_DECORATIVE; exit 1; }; echo FSK_AUTH_OK"]
        - name: route_topology
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "python3 tools/route_check.py topology openapi.yaml src/main/kotlin || exit 1; out=$(python3 tools/route_check.py topology openapi.yaml probe/routes/phantom.kt 2>&1); echo \"$out\" | grep -q EXTRA || { echo FSK_TOPOLOGY_DECORATIVE; exit 1; }; echo FSK_TOPOLOGY_OK"]
        - name: rbac_enforced
          kind: product_env
          workdir: build/product
          bootstrap: []
          cmd: ["sh", "-c", "python3 tools/route_check.py rbac openapi.yaml src/main/kotlin || exit 1; if [ -f probe/routes/wrong_roles.kt ]; then out=$(python3 tools/route_check.py rbac openapi.yaml probe/routes/wrong_roles.kt 2>&1); echo \"$out\" | grep -q ROLE_MISMATCH || { echo FSK_RBAC_DECORATIVE; exit 1; }; fi; echo FSK_RBAC_OK"]
