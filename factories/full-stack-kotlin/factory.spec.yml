    - id: REQ-F-010
      statement: "el producto EMITE observabilidad verificada contra un server HTTP VIVO: una request produce un trace OTel con correlation-id + un log estructurado con ese cid, y /health·/ready responden (DES-5)"
      acceptance: "observability_live verde: el server levanta y el proof verifica que la request emite span + log con el correlation-id; server caído → rojo (diente nativo de infra_up); quitar la instrumentación → el cid no se emite → rojo. Ktor completo + e2e (Playwright) + Lighthouse quedan declared-deferred (ADR-012)"
      satisfied_by: [s9]
      verified_by: [observability_live]
      capability: observabilidad_producto
    - id: REQ-F-011
      statement: "un campo enum con ciclo de vida declara su máquina de estado (initial + transitions) y un guard DETERMINISTA la enforza: una transición declarada es válida, una no declarada se rechaza por construcción (workflow, DES-3, R2/FSK-S12)"
      acceptance: "workflow_enforced verde: gradle workflowTest ejercita el guard canTransition con un diente de DOS lados (transición declarada VÁLIDA pasa ✓ / no-declarada rechazada ✗); romper el guard (aceptar todo → falla el lado inválido; rechazar todo → falla el válido) → rojo; tamper del `enum:` del contrato → el guard type-bound no compila (DES-6). Opt-in: un enum sin transitions no emite guard (FSK-S11 intacto)"
      satisfied_by: [s7]
      verified_by: [workflow_enforced]
      capability: workflow_enforced
    - id: REQ-F-012
      statement: "una operación de escritura declara qué roles la pueden ejecutar (write_roles) y un guard DETERMINISTA lo enforza: un rol autorizado escribe, uno no-autorizado se rechaza por construcción — autorización por rol encima de la autenticación de s5 (RBAC, DES-3, R2/FSK-S13)"
      acceptance: "rbac_enforced verde: route_check.py (rbac) exige que cada op con x-required-roles esté registrada en el RouteTable con ESE set de roles; un set distinto (tamper del contrato sin tocar el Kotlin, o viceversa) → ROLE_MISMATCH (rojo); el probe sucio embebido (wrong_roles.kt) DEBE morder (ROLE_MISMATCH) o decorativo→rojo. El test de dos lados (RoleGuardTest, tier unit) ejercita el guard en runtime: rol permitido ✓ / no-permitido ✗; romper RoleGuard → rojo. Opt-in: una entidad sin write_roles (o un producto sin roles) → sólo autenticación (FSK-S5 intacto)"
      satisfied_by: [s5]
      verified_by: [rbac_enforced]
      capability: rbac_enforced
    - id: REQ-F-013
      statement: "una entidad declara qué campo identifica al dueño de cada fila (owned_by) y un guard DETERMINISTA lo enforza: un actor no-privilegiado sólo modifica las filas que le pertenecen (su principal == el dueño), un rol de owner_bypass_roles bypassa — autorización a nivel de FILA (ownership / ABAC acotado) encima del RBAC de s5 (DES-3, R2/FSK-S14)"
      acceptance: "ownership_enforced verde: route_check.py (ownership) exige que cada entidad con x-owned-by esté registrada en OwnershipPolicy con ESE campo; un campo distinto (tamper del contrato sin tocar el Kotlin, o viceversa) → OWNER_MISMATCH (rojo); el probe sucio embebido (wrong_owner.kt) DEBE morder (OWNER_MISMATCH) o decorativo→rojo. El test de dos+ lados (OwnershipGuardTest, tier unit) ejercita el guard en runtime: el dueño modifica ✓ / un no-dueño es rechazado ✗ / un rol de bypass bypassa ✓; romper OwnershipGuard → rojo. Opt-in: una entidad sin owned_by → sólo RBAC (FSK-S13 intacto)"
      satisfied_by: [s5]
      verified_by: [ownership_enforced]
      capability: ownership_enforced
    - id: REQ-F-014
      statement: "el control de acceso se ENFORZA a RUNTIME: un server HTTP vivo monta las rutas del contrato para la entidad con dueño e INVOCA los guards generados (auth → RBAC → ownership) + persiste/lee contra la PostgreSQL viva (Repository); ninguna request real saltea el control (endpoints vivos, DES-3, R2/FSK-S15)"
      acceptance: "access_control_live verde (infra_up: PG viva + server vivo): el proof client hace requests REALES y exige POST rol prohibido → 403 / permitido → 201 · PUT fila ajena por no-dueño → 403 / por dueño → 200 / por rol de bypass → 200; saboteá un guard (autorizar todo) → el 403 se vuelve 200 → el proof falla; server caído → el proof no conecta → rojo (diente nativo de infra_up). JWT/identidad real + frontend que consume (React) + e2e Playwright = declared-deferred (token estático Bearer <rol>:<principal>). Opt-in: sin owned_by no se emite el server (FSK-S14 intacto)"
      satisfied_by: [s9]
      verified_by: [access_control_live]
      capability: control_acceso_runtime
    - id: REQ-F-015
      statement: "el server vivo MUTA columnas reales bajo el control de acceso ya enforzado: POST inserta una fila (jOOQ tipado, dueño = el principal del actor), PUT actualiza una columna escalar, DELETE la borra — todo type-bound al schema (DES-12) y observable e2e; el diente deja de ser sólo el veredicto y pasa a ser el round-trip (el dato apareció / cambió / se fue) (CRUD-mutación real, DES-3, R2/FSK-S16)"
      acceptance: "access_control_live verde con el ROUND-TRIP de mutación: POST rol permitido (dueño sembrado) → count == N+1 · PUT por el dueño → GET /<plural>/{id} devuelve el valor nuevo · DELETE por el dueño → count == N y GET /{id} → 404; los dientes de acceso siguen (rol prohibido → 403 y count NO cambia; no-dueño → 403 y la fila NO cambia); un 201/200 que no muta → el round-trip falla (verificado vivo: UPDATE que matchea 0 filas → value-check rojo). El body-parsing JSON real ya NO es deferral: lo cubre REQ-F-016 (entrada_tipada_runtime). CRUD de entidades sin dueño ya NO es deferral total: la 1ª ownerless servible lo cubre REQ-F-019 (RBAC-only); el resto + refs-en-el-body = declared-deferred. Opt-in: sin owned_by no se emite el server (FSK-S15 intacto)"
      satisfied_by: [s9]
      verified_by: [access_control_live]
      capability: crud_mutacion_runtime
    - id: REQ-F-016
      statement: "el server vivo acepta el CUERPO REAL del request y lo persiste type-coerced por el schema: POST inserta con los valores del body (no samples fijos), GET /<plural>/{id} devuelve la fila completa type-correct, PUT actualiza la columna del body (PATCH-like); body malformado / tipo equivocado / required ausente → 400 — fail-closed, sin tragar (entrada tipada a runtime, DES-12, FSK-CRUD-BODY-PARSING)"
      acceptance: "access_control_live verde con el ROUND-TRIP del CUERPO: POST {valores DISTINTOS de los samples, type-correct} → GET /<plural>/{id} trae EXACTAMENTE esos valores (un int es int, un string es string); un server que ignora el body mete samples ≠ lo posteado → rojo (verificado vivo: saboteado UN campo → 'esperaba ready, obtuvo pending', los demás campos siguen verdes → diente preciso y de dos lados); body JSON inválido / tipo equivocado → 400 (no 201, no 500); PUT con el body → GET ve ese valor; + los dientes de FSK-S16 (count round-trip) y de acceso (403 sin mutar) intactos. Refs requeridos no-dueño en el body + PUT-total + UNIQUE→409 = declared-deferred. Opt-in: sin owned_by no se emite el server (FSK-S16 intacto)"
      satisfied_by: [s9]
      verified_by: [access_control_live]
      capability: entrada_tipada_runtime
    - id: REQ-F-017
      statement: "el frontend CONSUME el backend vivo: el cliente TS GENERADO hace fetch REAL contra el AppServer (PG viva detrás) y el round-trip e2e (create<E> POST → get<E> GET → aseverar) cruza el MISMO protocolo de cable que el server generado, a través del CÓDIGO DE CLIENTE real — el frontend deja de ser funciones puras que nunca llaman al server (capa cliente que consume, DES-6, FSK-FRONTEND-CONSUME)"
      acceptance: "frontend_consume_live verde (infra_up: PG viva + AppServer en puerto/PG propios): el cliente generado create<E>(body DISTINTO de los samples) POSTea → get<E>(id) GETea → cada campo posteado vuelve EXACTO y type-correct (un cliente que devuelve un literal / ignora la respuesta → mismatch → rojo, verificado vivo); un body de tipo equivocado → 400 → el cliente lo propaga (un cliente que no chequea res.ok lo traga → rojo); server caído → fetch tira → rojo (diente nativo de infra_up). El tooth DES-6 vive en client.ts (Pick del contrato → un drift rompe tsc --strict en s2). El render de la lista viva lo cubre REQ-F-018; render EN BROWSER (mount/eventos) + el form que postea + deploy + e2e Playwright = declared-deferred. Opt-in: sin owned_by no se emite el cliente vivo (FSK-S15 intacto)"
      satisfied_by: [s9]
      verified_by: [frontend_consume_live]
      capability: frontend_consume_live
    - id: REQ-F-018
      statement: "la UI RENDERIZA la lista VIVA: el server LISTA las filas (GET /<plural> → {count,rows[]}, backward-compat), el cliente generado las TRAE (list<E>) y el render generado (render<E>List) las renderiza a markup que refleja la colección viva — el render deja de ser una función pura que nadie alimenta con datos del server (capa de render de datos vivos, DES-6, FSK-FRONTEND-RENDER-LIST)"
      acceptance: "frontend_consume_live verde (el MISMO check infra_up, extendido): tras create<E>→get<E>, el consumer hace list<E>(base) → render<E>List(rows) y asevera que el html refleja la LISTA VIVA — la fila recién creada aparece en la lista traída (list<E> truncado/stale → rojo) y el markup contiene el campo renderizado de CADA fila viva (render que dropea/garbla/hardcodea filas → html ≠ lista viva → rojo, verificado vivo); server caído → fetch tira → rojo. El tooth DES-6 vive en client.ts (list<E> type-bound al contrato → drift rompe tsc --strict en s2). Render EN BROWSER (mount/eventos) + el form que postea + deploy + e2e Playwright = declared-deferred. Opt-in: sin owned_by no se emite"
      satisfied_by: [s9]
      verified_by: [frontend_consume_live]
      capability: frontend_render_live
    - id: REQ-F-019
      statement: "la capa VIVA deja de ser opt-in a `owned_by`: una entidad SIN dueño obtiene CRUD vivo gobernado por RBAC-only — el server monta una 2ª entidad (la 1ª ownerless servible) y un rol prohibido → 403 sin INSERT mientras un permitido → 201 + INSERT del cuerpo; el DOMINIO ENTERO (no sólo la entidad con dueño) empieza a ser usable a runtime (CRUD ownerless RBAC-only, DES-3, FSK-CRUD-OWNERLESS)"
      acceptance: "access_control_live verde con el bloque OWNERLESS de DOS lados: POST rol PROHIBIDO → 403 y count NO cambia / rol PERMITIDO → 201 + count+1; round-trip del cuerpo (POST {valores ≠ samples} → GET /<plural>/{id} type-correct); body tipo equivocado → 400; DELETE rol prohibido → 403 (sin borrar) / permitido → 200 y GET /{id} → 404. Saboteá el guard RBAC ownerless (que un rol prohibido pase) → SÓLO access_control_live rojo, hermanos s9 (frontend_consume_live, observability_live) verdes (verificado vivo); server caído → rojo (diente nativo). Refs requeridos en el body + PUT/update ownerless + CRUD de TODAS las ownerless = declared-deferred. Opt-in: un producto sin entidad ownerless servible no monta esta capa"
      satisfied_by: [s9]
      verified_by: [access_control_live]
      capability: crud_ownerless_runtime
