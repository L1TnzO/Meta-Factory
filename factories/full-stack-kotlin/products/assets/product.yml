# Blueprint de instancia R1 (lifecycle 1:N, ADR-015) para la fábrica full-stack-kotlin.
# Vocabulario de campos DISTINTO del demo (Snipe-IT-lite): ejercita TODO el vocabulario R2 (FSK-S11) —
# int/number/date/enum + opcionalidad — Y un WORKFLOW de ciclo de vida (FSK-S12) sobre Asset.status, en una
# topología propia. Es DATA: `meta product new` lo instala como products/assets/product.yml y la fábrica
# re-deriva el spec efectivo (base ⊕ product.yml).

# s6 (lógica de dominio generada por LLM vivo, `claude -p`) se DIFIERE keyless para esta instancia
# (activation:off, la opción que el propio gate sanciona, doctrina R1): la instancia prueba que el
# VOCABULARIO de tipos R2 fluye por las estaciones deterministas (s0–s5, s7–s10). Summary.kt vive en
# domain_gen/ desacoplado de build/product → no bloquea el compile ni el fan-in de s10. Deferral VISIBLE.
station_activation:
  s6: off

package_name: webapp
api_title: "Asset Tracker API"
# RBAC (R2/FSK-S13, DES-3) con un vocabulario de roles DISTINTO del demo (admin/editor/viewer): el caso
# Snipe-IT usa admin/manager/auditor, y una POLÍTICA por-entidad distinta — sólo `admin` da de alta a los
# responsables (Holder), pero un `manager` SÍ administra activos (Asset). `auditor` es read-only (audita,
# no escribe ninguna entidad). Co-validación ADR-014: el enum Role + RoleGuard se generan del product.yml
# (DATA) y la instancia re-deriva == su pin, aislada. Es una topología de autorización propia, no la del demo.
roles: [admin, manager, auditor]
# ownership / autorización a nivel de FILA (R2/FSK-S14, DES-3) con una política DISTINTA del demo (demo: Project
# owned_by owner_id → User). Acá el dueño de un Asset es su responsable (Holder) vía holder_id, y sólo `admin`
# bypassa: un manager administra activos pero, salvo bypass, sólo toca los SUYOS (su principal == el holder de
# la fila). Topología de ownership propia (entidad Asset / principal Holder), co-validación ADR-014.
owner_bypass_roles: [admin]
entities:
  - name: Holder
    write_roles: [admin]
    fields:
      - { name: email, type: string, unique: true }
      - { name: department, type: enum, values: [it, ops, sales, support] }
  - name: Asset
    write_roles: [admin, manager]
    owned_by: holder_id           # el dueño de la fila es el Holder que holder_id referencia (ownership)
    fields:
      - { name: serial, type: string, unique: true }
      - { name: quantity, type: int }
      - { name: cost, type: number }
      - { name: purchased, type: date }
      # WORKFLOW de ciclo de vida del activo (R2/FSK-S12, DES-3) — DISTINTO del demo (Task.priority es
      # stepwise simétrico sin terminal; éste tiene un estado TERMINAL `archived` y fan-out asimétrico, el
      # caso Snipe-IT: un activo archivado no vuelve). Guard canTransition determinista, type-bound al enum.
      - name: status
        type: enum
        values: [deployed, ready, archived, broken]
        initial: ready
        transitions:
          ready: [deployed, broken]
          deployed: [ready, broken, archived]
          broken: [ready, archived]
          archived: []
      # holder_id es REQUERIDO (FSK-S14): ownership obligatorio ⇒ toda fila tiene un dueño no-nulo (row.holderId:
      # Long no-opcional, type-bound en OwnershipGuardTest). `notes` queda opcional → la opcionalidad R2 (FSK-S11)
      # sigue ejercida.
      - { name: holder_id, type: ref, to: Holder, required: true }
      - { name: notes, type: string, required: false }
