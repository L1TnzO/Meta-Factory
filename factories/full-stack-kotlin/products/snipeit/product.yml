# ============================================================================
# Snipe-IT — blueprint de instancia R1 (lifecycle 1:N, ADR-015) de full-stack-kotlin.
# ============================================================================
# Réplica FIEL del dominio de Snipe-IT (gestión de activos de TI de grado-producción,
# github.com/grokability/snipe-it v8.6.3, Laravel/PHP) expresada en la GRAMÁTICA de FSK.
# NO es un port del código PHP: se cosechó el DOMINIO (modelo de datos + reglas) y se
# mapeó a Kotlin/TS/PostgreSQL. La derivación completa + las decisiones de mapeo
# (inclusiones y deferrals HONESTOS) viven en docs/reference/SNIPEIT-DOMAIN.md.
#
# Es DATA: la fábrica re-deriva el spec efectivo (base ⊕ product.yml) + la línea s0–s10.
# `git diff src/metafactory/ + seed/` = 0 (el producto no toca el sustrato; ADR-012).
#
# ── RESTRICCIONES DE FSK que ordenan este archivo (probadas leyendo el codegen) ─────────
# 1. ORDEN TOPOLÓGICO (relajado por FSK-XENTITY-CYCLES): un ref BACKWARD/self emite la FK inline
#    `REFERENCES` en orden de declaración; un ref FORWARD (target declarado DESPUÉS, p.ej. el ciclo
#    Location↔User vía Location.manager_id→User) emite la FK como constraint DIFERIDA (ALTER TABLE
#    tras crear ambas tablas) + seed NULL-then-UPDATE → el forward DEBE ser opcional. Los ciclos de
#    Snipe-IT (Location↔User, User↔Department) están RESTAURADOS (ver SNIPEIT-DOMAIN.md §3 deferral 6).
# 2. OWNER REQUERIDO: el campo `owned_by` de Asset DEBE ser `required: true` — el guard
#    `OwnershipGuard.canModify(rowOwnerId: Long)` es no-nullable. En Snipe-IT un asset RTD
#    está SIN asignar (dueño nulo); acá la asignación es obligatoria → gap documentado.
# 3. SEED TRANSITIVO (FSK-OWNED-REQUIRED-REFS): la entidad CON DUEÑO ya puede tener refs REQUERIDOS
#    no-dueño — el server vivo (s9) los siembra TOPOLÓGICAMENTE (Category→AssetModel→Asset) y /seed
#    expone la FK para el POST. Por eso `Asset.model_id` es `required: true` (faithful). PENDIENTE: User
#    (el dueño) sigue sin refs requeridos; un ref requerido que cierre CICLO sigue diferido (deferral 6).
# ============================================================================

package_name: snipeit
api_title: "Snipe-IT Asset Management API"

# s6 (lógica de dominio generada por LLM vivo, `claude -p`) se DIFIERE keyless para esta
# instancia (activation:off, la opción que el propio gate sanciona — doctrina R1, igual que
# `assets`): la instancia prueba que el dominio fluye por las estaciones DETERMINISTAS
# (s0–s5, s7–s10). Deferral VISIBLE, no over-claim. Ver SNIPEIT-DOMAIN.md.
station_activation:
  s6: off

# ── RBAC (FSK-S13) ──────────────────────────────────────────────────────────
# Snipe-IT NO tiene roles fijos: usa GRUPOS con un blob JSON de permisos granulares tri-state
# (grant/deny/inherit) + dos superflags (is_superuser, admin) + permisos self.* de auto-servicio.
# Eso es inexpresable en la gramática FSK (roles fijos). Se mapea a una aproximación tratable de
# 4 roles fijos (derivada en 03-permissions.md / SNIPEIT-DOMAIN.md §RBAC):
#   superadmin → is_superuser: todo, sin scoping de compañía.
#   admin      → admin flag: gestiona todo (org + reference data + usuarios).
#   manager    → gestiona ENTIDADES OPERATIVAS (activos/licencias/accesorios/...), sólo las SUYAS
#                (ownership de fila), no usuarios ni reference data.
#   auditor    → read-only (audita): en NINGÚN write_roles ⇒ no escribe nada.
roles: [superadmin, admin, manager, auditor]
# Ownership a nivel de FILA (FSK-S14): superadmin/admin IGNORAN ownership (bypass); un manager,
# salvo bypass, sólo toca las filas cuyo dueño es su principal. Componer sobre RBAC (fail-closed).
owner_bypass_roles: [superadmin, admin]
# Company-scoping / multi-tenancy (FSK-COMPANY-SCOPING, deferral 8). En Snipe-IT con FMCS
# (full_multiple_companies_support) un actor no-superadmin sólo VE/EDITA las filas de SU compañía
# (company_id). superadmin (y admin, que administra toda la org) IGNORAN el scope (bypass). Es el 1er
# eje que agrega FILTRADO DE LECTURA (la lista se acota a la compañía del actor) además del de escritura.
company_scope_bypass_roles: [superadmin, admin]

entities:
  # ══ REFERENCE / LOOKUP (sin refs — declaradas primero) ════════════════════
  - name: Company           # multi-tenancy: en Snipe-IT toda entidad lleva company_id (scoping). FSK
    write_roles: [superadmin, admin]   # no enforza el scoping transversal → company_id se modela como ref
    fields:                            # opcional pero el FILTRO por compañía es un gap (SNIPEIT-DOMAIN §gaps).
      - { name: name, type: string, unique: true }
      - { name: email, type: string, required: false }
      - { name: phone, type: string, required: false }

  - name: Manufacturer
    write_roles: [superadmin, admin]
    fields:
      - { name: name, type: string, unique: true }
      - { name: url, type: string, required: false }
      - { name: support_email, type: string, required: false }
      - { name: support_phone, type: string, required: false }

  - name: Supplier
    write_roles: [superadmin, admin]
    fields:
      - { name: name, type: string }
      - { name: contact, type: string, required: false }
      - { name: email, type: string, required: false }
      - { name: phone, type: string, required: false }
      - { name: city, type: string, required: false }
      - { name: country, type: string, required: false }

  - name: Depreciation       # esquema de depreciación lineal. El CÁLCULO del valor actual
    write_roles: [superadmin, admin]   # (straight-line sobre `months` desde la compra, con piso) es
    fields:                            # lógica derivada → gap (necesita s6 o campos computados).
      - { name: name, type: string }
      - { name: months, type: int }    # período de depreciación en meses
      - { name: depreciation_min, type: number, required: false }   # piso (monto o %)
      - name: depreciation_type        # enum cerrado (no workflow): cómo interpretar el piso
        type: enum
        values: [amount, percentage]

  - name: Category           # categoriza activos/accesorios/consumibles/componentes/licencias
    write_roles: [superadmin, admin]
    fields:
      - { name: name, type: string }
      - name: category_type            # enum cerrado (no workflow): el tipo de ítem que agrupa
        type: enum
        values: [asset, accessory, consumable, component, license]
      - { name: require_acceptance, type: boolean, required: false }
      - { name: use_default_eula, type: boolean, required: false }

  - name: Location           # En Snipe-IT Location tiene parent_id→Location (jerarquía) y manager_id→User.
    write_roles: [superadmin, admin]   # parent_id (self-ref) RE-HABILITADO (FSK-SELF-REF); manager_id→User
    fields:                            # RE-HABILITADO (FSK-XENTITY-CYCLES): cierra el ciclo Location↔User
      - { name: name, type: string }   # (User.location_id→Location). User se declara DESPUÉS → ref FORWARD →
      - { name: city, type: string, required: false }     # FK como constraint DIFERIDA (ALTER) + seed NULL-then-UPDATE;
      - { name: state, type: string, required: false }    # forward DEBE ser opcional (un lado del ciclo sin orden de seed).
      - { name: country, type: string, required: false }
      - { name: zip, type: string, required: false }
      - { name: parent_id, type: ref, to: Location, required: false }   # self-ref: jerarquía de ubicaciones (FSK-SELF-REF)
      - { name: manager_id, type: ref, to: User, required: false }      # forward/cíclico → User (FSK-XENTITY-CYCLES)

  - name: Department         # En Snipe-IT Department tiene manager_id→User: RE-HABILITADO (FSK-XENTITY-CYCLES)
    write_roles: [superadmin, admin]   # — cierra el ciclo User↔Department (User.department_id→Department). User se
    fields:                            # declara DESPUÉS → ref FORWARD → FK DIFERIDA (ALTER) + seed NULL-then-UPDATE.
      - { name: name, type: string }
      - { name: company_id, type: ref, to: Company, required: false }
      - { name: location_id, type: ref, to: Location, required: false }
      - { name: manager_id, type: ref, to: User, required: false }      # forward/cíclico → User (FSK-XENTITY-CYCLES)

  - name: User               # DUEÑO de los activos (principal de ownership, FSK-S14/S15). Por la
    write_roles: [superadmin, admin]   # restricción de seed del server vivo, NO tiene refs REQUERIDOS.
    fields:                            # Campos de auth (password, 2FA, activation) se omiten (no-dominio).
      - { name: first_name, type: string }
      - { name: last_name, type: string, required: false }
      - { name: username, type: string, unique: true }
      - { name: email, type: string, required: false }
      - { name: jobtitle, type: string, required: false }
      - { name: employee_num, type: string, required: false }
      - { name: phone, type: string, required: false }
      - { name: vip, type: boolean, required: false }
      - { name: company_id, type: ref, to: Company, required: false }
      - { name: location_id, type: ref, to: Location, required: false }
      - { name: department_id, type: ref, to: Department, required: false }
      - { name: manager_id, type: ref, to: User, required: false }   # self-ref: cadena de management (FSK-SELF-REF; optional → seed s9 lo saltea)

  - name: AssetModel         # plantilla make/model de un activo. category_id REQUERIDO (Snipe-IT) —
    write_roles: [superadmin, admin]   # OK: NO es entidad del server vivo, el roundtrip encadena el FK.
    fields:
      - { name: name, type: string }
      - { name: model_number, type: string, required: false }
      - { name: category_id, type: ref, to: Category }                 # requerido (faithful)
      - { name: manufacturer_id, type: ref, to: Manufacturer, required: false }
      - { name: depreciation_id, type: ref, to: Depreciation, required: false }
      - { name: eol, type: int, required: false }                      # meses hasta End-of-Life
      # FSK-XENTITY-COMPUTED: el período de depreciación VIVE EN EL MODELO (todos los activos de un modelo se
      # deprecian sobre el MISMO período), no en el activo individual. Antes estaba SIMPLIFICADO como un campo del
      # propio Asset (same-entity); ahora vive acá y `Asset.current_value` lo lee CROSS-ENTITY (resuelve model_id →
      # JOIN a AssetModel → lee esta columna). REQUERIDO (1er-cut: ref+campo requeridos → el valor es observable).
      - { name: depreciation_months, type: int }                       # meses de vida útil (faithful: per-MODELO)

  # ══ ASSET — la entidad central, con WORKFLOW (FSK-S12) + OWNERSHIP (FSK-S14/S15) ══
  - name: Asset
    write_roles: [superadmin, admin, manager]   # un manager administra activos…
    owned_by: assigned_user_id                   # …pero sólo los SUYOS (su principal == el asignado), salvo bypass
    company_scoped: company_id                   # …y SÓLO los de su COMPAÑÍA (multi-tenancy/FMCS), salvo bypass (FSK-COMPANY-SCOPING)
    soft_delete: true                            # BORRADO LÓGICO (FSK-SOFT-DELETES, deferral 12): Snipe-IT NUNCA hard-deletea
    #                                              (Laravel SoftDeletes) — DELETE → papelera (deleted_at), las lecturas filtran,
    #                                              y `restore` recupera. Compone el read-filter de company-scope + IS NULL.
    # Verbos de DOMINIO (FSK-DOMAIN-OPS) + ASSIGNS POLIMÓRFICO (FSK-POLY-ASSIGNS): checkout/checkin — las operaciones
    # CENTRALES de Snipe-IT. NO son un PUT genérico: son transiciones NOMBRADAS del workflow `status` con efecto sobre
    # un ref, que el server vivo enforza componiendo RBAC + ownership + la precondición de WORKFLOW (canTransition,
    # antes sólo-UNIT en s7, ahora VIVA a runtime). En Snipe-IT el target del checkout es POLIMÓRFICO — un activo se
    # asigna a un User|Location|Asset (assets.assigned_type+assigned_to). Eso se modela FAITHFUL con FSK-POLY-ASSIGNS:
    # checkout ASIGNA a `checkout_target` (ref polimórfico) → el server setea checkout_target_type (discriminador ∈ la
    # unión, fail-closed) + checkout_target_id del cuerpo; checkin lo LIBERA (clears → ambas sub-columnas NULL = RTD).
    # status: ready→deployed (checkout) / deployed→ready (checkin). Un verbo sobre un estado inválido → 409. El `assigns`
    # NO toca el `owned_by` (assigned_user_id): el ownership de fila cruza un Long ÚNICO (wrinkle #3 de poly: un target
    # de una unión no es un principal) → el polimórfico vive en un campo NO-dueño (checkout_target ≠ assigned_user_id).
    # Cierra el deferral 2 de la cara BEHAVIORAL (el checkout polimórfico faithful); la primitiva DATA ya vivía en Accessory.
    operations:
      - { name: checkout, field: status, from: ready,    to: deployed, assigns: checkout_target }
      - { name: checkin,  field: status, from: deployed, to: ready,    clears:  checkout_target }
    fields:
      - { name: asset_tag, type: string, unique: true }   # etiqueta única del activo (asset_tag, faithful)
      - { name: name, type: string, required: false }
      - { name: serial, type: string, required: false }   # Snipe: unique condicional (setting); acá opcional
      - { name: purchase_date, type: date, required: false }
      # FSK-COMPUTED-FIELDS (deferral 7) + FSK-XENTITY-COMPUTED: el VALOR ACTUAL de un activo NO se almacena — se
      # COMPUTA por depreciación straight-line desde la compra (la dimensión de VALORES DERIVADOS). Snipe-IT deriva
      # el período de depreciación del MODELO (AssetModel), no del activo individual. El 1er-cut de FSK-COMPUTED-FIELDS
      # lo SIMPLIFICÓ a un campo del propio Asset (same-entity); FSK-XENTITY-COMPUTED lo hace FAITHFUL: el período
      # (`depreciation_months`) vive en `AssetModel` y `current_value` lo lee CROSS-ENTITY — resuelve `model_id` →
      # LEFT JOIN a AssetModel → lee su columna (la fórmula como AST determinista). `purchase_cost` (same-entity) +
      # `model_id.depreciation_months` (cross-entity) son REQUERIDOS → el valor es OBSERVABLE en el GET. (Refinamiento
      # DIFERIDO: el período REAL vive en `Depreciation` vía `AssetModel.depreciation_id` —depth-2— + el tiempo
      # transcurrido; este 1er-cut cross-entity es depth-1: el ref DIRECTO del Asset a su modelo.)
      - { name: purchase_cost, type: number }                  # REQUERIDO (fuente same-entity del valor derivado)
      # `current_value` = max(purchase_cost - purchase_cost/model_id.depreciation_months, 0): el valor tras una
      # depreciación straight-line de un período, con piso 0 (max) y guard de div-por-cero (safeDiv). NO se guarda:
      # 0 columnas, read-only, computado a read-time en rowJson tras el JOIN. AST: operadores del set cerrado (`- / max`);
      # `model_id.depreciation_months` = el operando CROSS-ENTITY (un ref REQUERIDO `.` un campo numérico del target).
      - name: current_value
        type: number
        computed:
          op: max
          args:
            - op: "-"
              args:
                - purchase_cost
                - { op: "/", args: [purchase_cost, model_id.depreciation_months] }
            - 0
      - { name: order_number, type: string, required: false }
      - { name: warranty_months, type: int, required: false }
      - { name: asset_eol_date, type: date, required: false }
      - { name: requestable, type: boolean, required: false }
      - { name: byod, type: boolean, required: false }
      - { name: notes, type: string, required: false }
      # CUSTOM FIELD con FORMAT (FSK-CUSTOM-FIELDS, Avenue A). En Snipe-IT un admin define campos personalizados por
      # modelo (CustomField + CustomFieldset), cada uno con un TIPO + un FORMAT (regla de validación: MAC/IP/EMAIL/
      # URL/NUMERIC/ALPHA). El caso canónico es "MAC Address" (format MAC). Acá el campo se DECLARA en el blueprint
      # (no se crea a runtime — el EAV dinámico, definición-a-runtime, sigue diferido, Avenue B/deferral 1): el aporte
      # NUEVO sobre un string normal es la REGLA — `format: mac` → el server vivo VALIDA el valor a runtime (un valor
      # que no matchea el patrón MAC → 400, fail-closed, vía el codec strFmt). Requerido (un custom field requerido es
      # expresable en Snipe-IT) para que el server vivo lo lea del cuerpo (_input_fields) y el diente lo ejercite.
      - { name: mac_address, type: string, format: mac }
      # WORKFLOW de ciclo de vida (FSK-S12). En Snipe-IT el estado efectivo es (StatusLabel.type ×
      # asignación); StatusLabel es una entidad customizable (defer, ver §gaps). Acá se modela el
      # CICLO canónico como enum-workflow sobre Asset.status: `archived` es TERMINAL (un activo
      # archivado no vuelve), `broken` se repara a `ready`. Guard canTransition determinista.
      - name: status
        type: enum
        values: [pending, ready, deployed, archived, broken]
        initial: ready
        transitions:
          ready:    [deployed, pending, broken, archived]   # RTD → checkout/pending/avería/archivo
          deployed: [ready, pending, broken, archived]       # checkin → ready; etc.
          pending:  [ready, deployed, broken, archived]
          broken:   [ready, archived]                        # reparado → ready, o se archiva
          archived: []                                       # TERMINAL
      # Dueño de la fila (ownership). OPCIONAL: un activo Ready-To-Deploy está SIN asignar (dueño NULL) — el
      # caso NORMAL de Snipe-IT (FSK-OWNERSHIP-OPTIONAL: canModify acepta Long?; sólo bypass modifica un RTD).
      # Es el PRINCIPAL de ownership (Long único): el manager responsable del activo, fijado al crearlo desde el
      # token. DISTINTO del target polimórfico del checkout (`checkout_target`): el ownership cruza un Long, no una unión.
      - { name: assigned_user_id, type: ref, to: User, required: false }
      # FSK-POLY-ASSIGNS: el TARGET POLIMÓRFICO del checkout — a quién está asignado/prestado el activo (User|Location|
      # Asset), la cara faithful de assets.assigned_type+assigned_to de Snipe-IT. Ref a una UNIÓN → DOS sub-columnas
      # checkout_target_type (discriminador, enum cerrado de los targets) + checkout_target_id (id, BIGINT sin FK,
      # wrinkle #1). OPCIONAL: un activo RTD está sin checkout (ambas NULL). El verbo `checkout` lo ASIGNA (assigns) y
      # `checkin` lo LIBERA (clears) — el server vivo round-trippea (tipo, id) y el GET los devuelve EXACTOS. Es un
      # campo NO-dueño (≠ assigned_user_id): el polimórfico no puede ser owned_by (wrinkle #3). Ver SNIPEIT-DOMAIN §3 deferral 2.
      - { name: checkout_target, type: ref, to: [User, Location, Asset], required: false }
      - { name: model_id, type: ref, to: AssetModel, required: true }   # Snipe: REQUERIDO (faithful) — el server vivo lo siembra TRANSITIVAMENTE (Category→AssetModel→Asset), FSK-OWNED-REQUIRED-REFS

      - { name: company_id, type: ref, to: Company, required: false }
      - { name: location_id, type: ref, to: Location, required: false }
      - { name: rtd_location_id, type: ref, to: Location, required: false }   # ubicación "ready to deploy"
      - { name: supplier_id, type: ref, to: Supplier, required: false }

  # ══ LICENCIAS (con asientos) ══════════════════════════════════════════════
  - name: License
    write_roles: [superadmin, admin, manager]
    fields:
      - { name: name, type: string }
      - { name: serial, type: string, required: false }   # product key
      - { name: seats, type: int }                         # total de asientos
      - { name: license_name, type: string, required: false }   # nombre del licenciatario
      - { name: license_email, type: string, required: false }
      - { name: purchase_date, type: date, required: false }
      - { name: purchase_cost, type: number, required: false }
      - { name: expiration_date, type: date, required: false }
      - { name: termination_date, type: date, required: false }
      - { name: min_amt, type: int, required: false }
      - { name: category_id, type: ref, to: Category }     # requerido (faithful)
      - { name: company_id, type: ref, to: Company, required: false }
      - { name: manufacturer_id, type: ref, to: Manufacturer, required: false }
      - { name: supplier_id, type: ref, to: Supplier, required: false }
      - { name: depreciation_id, type: ref, to: Depreciation, required: false }

  - name: LicenseSeat        # el pivot license_seats modelado como ENTIDAD (FSK no tiene M:N): un
    write_roles: [superadmin, admin, manager]   # asiento se asigna a un User O a un Asset (ambos opcionales).
    fields:
      - { name: license_id, type: ref, to: License }       # requerido
      - { name: assigned_user_id, type: ref, to: User, required: false }
      - { name: asset_id, type: ref, to: Asset, required: false }
      - { name: unreassignable_seat, type: boolean, required: false }

  # ══ ACCESORIOS (qty, checkout a user) ═════════════════════════════════════
  - name: Accessory
    write_roles: [superadmin, admin, manager]
    operations:   # FSK-QTY-OPERATIONS: el checkout de un accesorio DECREMENTA el stock (qty) con guard
      - { name: checkout, decrements: qty }   # out-of-stock; verbo sobre entidad SIN dueño (RBAC-only)
    fields:
      - { name: name, type: string }
      - { name: qty, type: int }                           # cantidad total
      - { name: min_amt, type: int, required: false }
      - { name: model_number, type: string, required: false }
      - { name: purchase_date, type: date, required: false }
      - { name: purchase_cost, type: number, required: false }
      - { name: requestable, type: boolean, required: false }
      - { name: category_id, type: ref, to: Category }     # requerido (faithful)
      - { name: company_id, type: ref, to: Company, required: false }
      - { name: location_id, type: ref, to: Location, required: false }
      - { name: manufacturer_id, type: ref, to: Manufacturer, required: false }
      - { name: supplier_id, type: ref, to: Supplier, required: false }
      # REF POLIMÓRFICO (FSK-POLYMORPHIC-REFS, deferral 2): el TARGET de un checkout en Snipe-IT es POLIMÓRFICO —
      # se asigna a un User O una Location O un Asset (la entidad accessories_checkout lleva assigned_type +
      # assigned_to). Acá se modela esa primitiva sobre el ACCESSORY servido (la entidad with_ref viva, donde el
      # round-trip a runtime es observable): `to` es una LISTA → el campo se materializa como DOS columnas
      # `checkout_target_type` (discriminador, enum cerrado de los targets) + `checkout_target_id` (id, BIGINT SIN
      # FK — no hay integridad a una unión, wrinkle #1). El server vivo round-trippea (tipo, id) y el GET los
      # devuelve EXACTOS, distinguiendo el target. Requerido para que entre al cuerpo del POST (el diente VIVO).
      # Lo faithful pleno (el `assigns` polimórfico del verbo checkout + el assigned_to polimórfico de Asset —que ES
      # su owner, wrinkle #3—) sigue diferido (1er-cut = la primitiva sola). Ver SNIPEIT-DOMAIN.md §3 deferral 2.
      - { name: checkout_target, type: ref, to: [User, Location, Asset] }

  - name: AccessoryCheckout  # el pivot accessories_checkout como ENTIDAD. En Snipe-IT el target es
    write_roles: [superadmin, admin, manager]   # polimórfico (User|Location|Asset) → acá se simplifica a User (gap).
    fields:
      - { name: accessory_id, type: ref, to: Accessory }   # requerido
      - { name: assigned_user_id, type: ref, to: User, required: false }
      - { name: note, type: string, required: false }

  # ══ CONSUMIBLES (se consumen: checkout sin checkin) ═══════════════════════
  - name: Consumable
    write_roles: [superadmin, admin, manager]
    fields:
      - { name: name, type: string }
      - { name: qty, type: int }
      - { name: min_amt, type: int, required: false }
      - { name: model_number, type: string, required: false }
      - { name: item_no, type: string, required: false }
      - { name: purchase_date, type: date, required: false }
      - { name: purchase_cost, type: number, required: false }
      - { name: category_id, type: ref, to: Category }     # requerido (faithful)
      - { name: company_id, type: ref, to: Company, required: false }
      - { name: location_id, type: ref, to: Location, required: false }
      - { name: manufacturer_id, type: ref, to: Manufacturer, required: false }
      - { name: supplier_id, type: ref, to: Supplier, required: false }

  - name: ConsumableAssignment   # pivot consumables_users como ENTIDAD. Consumo PERMANENTE (sin checkin).
    write_roles: [superadmin, admin, manager]
    fields:
      - { name: consumable_id, type: ref, to: Consumable }   # requerido
      - { name: assigned_user_id, type: ref, to: User }      # requerido (se consume a un user)
      - { name: note, type: string, required: false }

  # ══ COMPONENTES (qty asignada a assets) ═══════════════════════════════════
  - name: Component
    write_roles: [superadmin, admin, manager]
    fields:
      - { name: name, type: string }
      - { name: qty, type: int }
      - { name: min_amt, type: int, required: false }
      - { name: serial_number, type: string, required: false }
      - { name: purchase_date, type: date, required: false }
      - { name: purchase_cost, type: number, required: false }
      - { name: category_id, type: ref, to: Category }     # requerido (faithful)
      - { name: company_id, type: ref, to: Company, required: false }
      - { name: location_id, type: ref, to: Location, required: false }
      - { name: manufacturer_id, type: ref, to: Manufacturer, required: false }
      - { name: supplier_id, type: ref, to: Supplier, required: false }

  - name: ComponentAssignment    # pivot components_assets como ENTIDAD: cantidad asignada a un asset.
    write_roles: [superadmin, admin, manager]
    fields:
      - { name: component_id, type: ref, to: Component }   # requerido
      - { name: asset_id, type: ref, to: Asset }           # requerido (se asigna a un asset)
      - { name: assigned_qty, type: int }                  # cantidad asignada
      - { name: note, type: string, required: false }

  # ══ MANTENIMIENTOS (registros por asset) ══════════════════════════════════
  - name: Maintenance
    write_roles: [superadmin, admin, manager]
    fields:
      - { name: asset_id, type: ref, to: Asset }           # requerido
      - { name: name, type: string }
      - name: maintenance_type         # enum cerrado (no workflow): los 8 tipos built-in de Snipe-IT
        type: enum
        values: [maintenance, repair, upgrade, pat_test, calibration, software_support, hardware_support, configuration_change]
      - { name: is_warranty, type: boolean, required: false }
      - { name: start_date, type: date }                   # requerido
      - { name: completion_date, type: date, required: false }
      - { name: cost, type: number, required: false }
      - { name: supplier_id, type: ref, to: Supplier, required: false }
