id: s4
name: 'seguridad de la cadena de suministro: SBOM + oráculo de advisories pineado
  + scanner determinista (sin red, sin LLM) — DES-13'
activation: always
requires_prev: s3
tier: harden
builds: []
checks:
- name: supply_chain_gate
  kind: product_env
  workdir: build/product
  bootstrap: []
  cmd:
  - sh
  - -c
  - python3 tools/supply_chain_scan.py deps sbom.json || exit 1; python3 tools/supply_chain_scan.py
    secrets src/main/kotlin frontend/src || exit 1; dout=$(python3 tools/supply_chain_scan.py
    deps probe/security/vuln-sbom.json 2>&1); echo "$dout" | grep -q lodash || { echo
    FSK_SUPPLYCHAIN_DECORATIVE_DEPS; exit 1; }; sout=$(python3 tools/supply_chain_scan.py
    secrets probe/security 2>&1); echo "$sout" | grep -q aws-access-key || { echo
    FSK_SUPPLYCHAIN_DECORATIVE_SECRETS; exit 1; }; echo FSK_SUPPLYCHAIN_OK
