id: s5
name: 'auth no-salteable + topología de rutas: guard (DES-3) + AST de rutas vs contrato
  (DES-2), estático sin levantar server'
activation: always
requires_prev: s4
builds: []
checks:
- name: auth_reachability
  kind: product_env
  workdir: build/product
  bootstrap: []
  cmd:
  - sh
  - -c
  - python3 tools/route_check.py auth openapi.yaml src/main/kotlin || exit 1; out=$(python3
    tools/route_check.py auth openapi.yaml probe/routes/unguarded.kt 2>&1); echo "$out"
    | grep -q UNGUARDED || { echo FSK_AUTH_DECORATIVE; exit 1; }; echo FSK_AUTH_OK
- name: route_topology
  kind: product_env
  workdir: build/product
  bootstrap: []
  cmd:
  - sh
  - -c
  - python3 tools/route_check.py topology openapi.yaml src/main/kotlin || exit 1;
    out=$(python3 tools/route_check.py topology openapi.yaml probe/routes/phantom.kt
    2>&1); echo "$out" | grep -q EXTRA || { echo FSK_TOPOLOGY_DECORATIVE; exit 1;
    }; echo FSK_TOPOLOGY_OK
- name: rbac_enforced
  kind: product_env
  workdir: build/product
  bootstrap: []
  cmd:
  - sh
  - -c
  - python3 tools/route_check.py rbac openapi.yaml src/main/kotlin || exit 1; if [
    -f probe/routes/wrong_roles.kt ]; then out=$(python3 tools/route_check.py rbac
    openapi.yaml probe/routes/wrong_roles.kt 2>&1); echo "$out" | grep -q ROLE_MISMATCH
    || { echo FSK_RBAC_DECORATIVE; exit 1; }; fi; echo FSK_RBAC_OK
- name: ownership_enforced
  kind: product_env
  workdir: build/product
  bootstrap: []
  cmd:
  - sh
  - -c
  - python3 tools/route_check.py ownership openapi.yaml src/main/kotlin || exit 1;
    if [ -f probe/routes/wrong_owner.kt ]; then out=$(python3 tools/route_check.py
    ownership openapi.yaml probe/routes/wrong_owner.kt 2>&1); echo "$out" | grep -q
    OWNER_MISMATCH || { echo FSK_OWNERSHIP_DECORATIVE; exit 1; }; fi; echo FSK_OWNERSHIP_OK
- name: mutability_enforced
  kind: product_env
  workdir: build/product
  bootstrap: []
  cmd:
  - sh
  - -c
  - python3 tools/route_check.py mutability openapi.yaml src/main/kotlin || exit 1;
    if [ -f probe/mutability/wrong_mutability.kt ]; then out=$(python3 tools/route_check.py
    mutability openapi.yaml probe/mutability/wrong_mutability.kt 2>&1); echo "$out"
    | grep -q MUTABLE_MISMATCH || { echo FSK_MUTABILITY_DECORATIVE; exit 1; }; fi;
    echo FSK_MUTABILITY_OK
