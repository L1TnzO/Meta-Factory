id: s6
name: lógica de dominio GENERADA por claude -p (LLM vivo) bajo contract test Kotlin
  — DES-8 (patrón MAT-2)
activation: always
requires_prev: s5
# D-2 (COUNCIL-360 §5 / ADR-022): el YAML orquesta (secuencia+checks); el CONTENIDO vive como
# archivos reales en stations/templates/s6/ (highlighting, lint, diffs legibles — la regla
# multi-archivo aplicada a estaciones). `render` == `write` en semántica (misma render_text);
# migración byte-idéntica probada por extracción con aserción + ci --rederive == pin.
builds:
- action: render
  src: factories/full-stack-kotlin/stations/templates/s6/settings.gradle.kts
  dest: domain_gen/settings.gradle.kts
- action: render
  src: factories/full-stack-kotlin/stations/templates/s6/build.gradle.kts
  dest: domain_gen/build.gradle.kts
- action: render
  src: factories/full-stack-kotlin/stations/templates/s6/Model.kt
  dest: domain_gen/src/main/kotlin/domain/Model.kt
- action: render
  src: factories/full-stack-kotlin/stations/templates/s6/SummaryContract.kt
  dest: domain_gen/src/main/kotlin/domain/SummaryContract.kt
- action: generate
  dest: domain_gen/src/main/kotlin/domain/Summary.kt
  skip_if_exists: true
  brief: "Generá UN archivo Kotlin (package `domain`) con la lógica de resumen de\
    \ avance de un proyecto.\nNO redefinas los tipos: el archivo Model.kt (mismo package\
    \ `domain`) YA define, y los usás tal cual:\n  data class Task(val title: String,\
    \ val done: Boolean)\n  sealed interface ProjectStatus { data object NotStarted;\
    \ data object InProgress; data object Completed }\n  data class ProjectSummary(val\
    \ total: Int, val done: Int, val pending: List<String>, val status: ProjectStatus)\n\
    Implementá EXACTAMENTE esta función pública (misma firma):\n  fun summarize(tasks:\
    \ List<Task>): ProjectSummary\nContrato (cumplilo al pie):\n  - total   = cantidad\
    \ total de tareas.\n  - done    = cantidad de tareas con done == true.\n  - pending\
    \ = los `title` de las tareas con done == false, EN EL ORDEN de entrada.\n  -\
    \ status  = ProjectStatus.NotStarted  si done == 0\n              ProjectStatus.Completed\
    \   si total > 0 && done == total\n              ProjectStatus.InProgress  en\
    \ cualquier otro caso\nRequisitos del código:\n  - La PRIMERA línea debe ser exactamente:\
    \ package domain\n  - Sin imports externos ni dependencias; Kotlin idiomático\
    \ que compile con `kotlinc -Werror`\n    (sin warnings, sin imports ni variables\
    \ sin usar, sin `when` no-exhaustivo).\n  - Referenciá ProjectStatus.NotStarted\
    \ / InProgress / Completed por su nombre completo.\nSalida: SOLO el código Kotlin\
    \ del archivo. NADA de explicaciones ni fences markdown.\n"
  via:
  - python3
  - codegen/gen_llm.py
checks:
- name: domain_logic_contract
  kind: product_env
  workdir: domain_gen
  bootstrap: []
  cmd:
  - sh
  - -c
  - JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) ./gradlew run
    -q --console=plain || exit 1; echo FSK_DOMAIN_OK
