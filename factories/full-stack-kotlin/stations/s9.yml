id: s9
name: 'observabilidad del producto: server HTTP vivo + tracing OTel + logs estructurados
  con correlation-id (DES-5)'
activation: always
requires_prev: s8
builds: []
checks:
- name: observability_live
  kind: infra_up
  workdir: build/product
  bootstrap:
  - sh
  - -c
  - JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) exec ./gradlew
    installDist -q --console=plain
  up:
  - sh
  - -c
  - JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))) exec ./build/install/webapp/bin/webapp
  proof:
  - python3
  - tools/obs_check.py
  - http://127.0.0.1:18593
  - obs/spans.jsonl
  - obs/access.jsonl
  - fsk-trace-001
  down: []
  timeout: 120
- name: access_control_live
  kind: infra_up
  workdir: build/product
  bootstrap:
  - sh
  - -c
  - set -e; export JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac))));
    ./gradlew installDist -q --console=plain; docker rm -f fsk_s9_ac_pg >/dev/null
    2>&1 || true; docker run -d --name fsk_s9_ac_pg -e POSTGRES_PASSWORD=metafactory
    -p 5436:5432 postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    >/dev/null
  up:
  - sh
  - -c
  - JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))); exec "$JAVA_HOME/bin/java"
    -cp 'build/install/webapp/lib/*' webapp.endpoints.AppServerKt
  proof:
  - python3
  - tools/access_control_check.py
  - http://127.0.0.1:18594
  down:
  - docker
  - rm
  - -f
  - fsk_s9_ac_pg
  timeout: 120
- name: frontend_consume_live
  kind: infra_up
  workdir: build/product
  bootstrap:
  - sh
  - -c
  - set -e; export JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac))));
    ./gradlew installDist -q --console=plain; docker rm -f fsk_s9_fe_pg >/dev/null
    2>&1 || true; docker run -d --name fsk_s9_fe_pg -e POSTGRES_PASSWORD=metafactory
    -p 5437:5432 postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    >/dev/null
  up:
  - sh
  - -c
  - JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))); export FSK_AC_PORT=18595
    FSK_PG_URL=jdbc:postgresql://localhost:5437/postgres; exec "$JAVA_HOME/bin/java"
    -cp 'build/install/webapp/lib/*' webapp.endpoints.AppServerKt
  proof:
  - sh
  - -c
  - cd frontend && exec node --experimental-strip-types --disable-warning=ExperimentalWarning
    consume_check.ts http://127.0.0.1:18595
  down:
  - docker
  - rm
  - -f
  - fsk_s9_fe_pg
  timeout: 120
- name: frontend_browser_live
  kind: infra_up
  workdir: build/product
  bootstrap:
  - sh
  - -c
  - set -e; export JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac))));
    ./gradlew installDist -q --console=plain; (cd frontend && npm install --no-audit
    --no-fund --loglevel=error && node build_bundle.mjs); docker rm -f fsk_s9_br_pg
    >/dev/null 2>&1 || true; docker run -d --name fsk_s9_br_pg -e POSTGRES_PASSWORD=metafactory
    -p 5438:5432 postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    >/dev/null
  up:
  - sh
  - -c
  - JAVA_HOME=$(dirname $(dirname $(readlink -f $(command -v javac)))); export FSK_AC_PORT=18597
    FSK_PG_URL=jdbc:postgresql://localhost:5438/postgres FSK_WEB_DIR=frontend/dist;
    exec "$JAVA_HOME/bin/java" -cp 'build/install/webapp/lib/*' webapp.endpoints.AppServerKt
  proof:
  - sh
  - -c
  - cd frontend && exec node --experimental-strip-types --disable-warning=ExperimentalWarning
    browser_check.ts http://127.0.0.1:18597
  down:
  - docker
  - rm
  - -f
  - fsk_s9_br_pg
  timeout: 120
