id: s2
name: 'el PRODUCTO contra la DB relacional VIVA: integración node:test → server node:sqlite
  (E1, M8 del producto) — DES-4/DES-9'
activation: always
requires_prev: s1
builds:
- action: emit_infra
checks:
- name: db_round_trip
  kind: infra_up
  workdir: build/product
  bootstrap:
  - npm
  - install
  - --no-audit
  - --no-fund
  - --loglevel=error
  up:
  - node
  - --experimental-strip-types
  - --disable-warning=ExperimentalWarning
  - ../infra/dbserver.ts
  - db.sock
  proof:
  - node
  - --experimental-strip-types
  - --disable-warning=ExperimentalWarning
  - --test
  - test/db_integration.test.ts
  down: []
  timeout: 15
