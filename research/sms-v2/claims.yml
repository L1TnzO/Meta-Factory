- id: clMFwrite
  pregunta: "Prevalencia confirmada de la faceta WRITE"
  derivacion: "sum(1 for r in extraction if 'WRITE' in facets(r,'F'))"
  unidad: int
- id: clMFcosto
  pregunta: "Prevalencia confirmada de la faceta COSTO"
  derivacion: "sum(1 for r in extraction if 'COSTO' in facets(r,'F'))"
  unidad: int
- id: clMFconsolidacion
  pregunta: "Prevalencia confirmada de la faceta CONSOLIDACION"
  derivacion: "sum(1 for r in extraction if 'CONSOLIDACION' in facets(r,'F'))"
  unidad: int
- id: clMFnegativo
  pregunta: "Prevalencia confirmada de la faceta NEGATIVO (conocimiento negativo)"
  derivacion: "sum(1 for r in extraction if 'NEGATIVO' in facets(r,'F'))"
  unidad: int
- id: clMFmultiagente
  pregunta: "Prevalencia confirmada de la faceta MULTIAGENTE"
  derivacion: "sum(1 for r in extraction if 'MULTIAGENTE' in facets(r,'F'))"
  unidad: int
- id: clMFprocedimental
  pregunta: "Prevalencia confirmada de la faceta PROCEDIMENTAL"
  derivacion: "sum(1 for r in extraction if 'PROCEDIMENTAL' in facets(r,'F'))"
  unidad: int
- id: clMFdocsVersionado
  pregunta: "Prevalencia confirmada de la faceta DOCS-VERSIONADO (memoria como archivos versionados)"
  derivacion: "sum(1 for r in extraction if 'DOCS-VERSIONADO' in facets(r,'F'))"
  unidad: int
  glosa: "la faceta MÁS escasa — y es exactamente el Tier 1 de Meta-Factory"
- id: clMFdocsVersionadoPct
  pregunta: "¿Qué tan rara es la memoria como documentos versionados?"
  derivacion: "pct(sum(1 for r in extraction if 'DOCS-VERSIONADO' in facets(r,'F')), len(digest))"
  unidad: pct1

# ---------------------------------------------------------------- lente Meta-Factory (§7.4)
- id: clMFentradas
  pregunta: "¿Cuántos mapeos paper→necesidad-de-Meta-Factory produjo la digestión?"
  derivacion: "len([a for r in digest for a in r['mf_aplicabilidad']])"
  unidad: int
- id: clMFconfirma
  pregunta: "¿Cuántos mapeos CONFIRMAN una decisión de Meta-Factory?"
  derivacion: "sum(1 for r in digest for a in r['mf_aplicabilidad'] if a['postura'] == 'CONFIRMA')"
  unidad: int
- id: clMFextiende
  pregunta: "¿Cuántos la EXTIENDEN?"
  derivacion: "sum(1 for r in digest for a in r['mf_aplicabilidad'] if a['postura'] == 'EXTIENDE')"
  unidad: int
- id: clMFneutral
  pregunta: "¿Cuántos son NEUTRALES?"
  derivacion: "sum(1 for r in digest for a in r['mf_aplicabilidad'] if a['postura'] == 'NEUTRAL')"
  unidad: int
- id: clMFrefuta
  pregunta: "¿Cuántos mapeos REFUTAN una decisión congelada de Meta-Factory?"
  derivacion: "sum(1 for r in digest for a in r['mf_aplicabilidad'] if a['postura'] == 'REFUTA')"
  unidad: int
  glosa: "la señal de más valor del estudio: evidencia externa contra una decisión propia"
- id: clMFrefutaPapers
  pregunta: "¿Cuántos estudios distintos aportan al menos una refutación?"
  derivacion: "len(set(r['key'] for r in digest if any(a['postura']=='REFUTA' for a in r['mf_aplicabilidad'])))"
  unidad: int
- id: clMFrefutaGMdos
  pregunta: "¿Cuántas refutaciones apuntan a G-M2 (retrieval medido)?"
  derivacion: "sum(1 for r in digest for a in r['mf_aplicabilidad'] if a['postura']=='REFUTA' and a['ancla']=='G-M2')"
  unidad: int
  glosa: "la tensión central del estudio contra ADR-019"
- id: clMFrefutaGMdosPct
  pregunta: "¿Qué proporción de toda la refutación se concentra en G-M2?"
  derivacion: "pct(sum(1 for r in digest for a in r['mf_aplicabilidad'] if a['postura']=='REFUTA' and a['ancla']=='G-M2'), sum(1 for r in digest for a in r['mf_aplicabilidad'] if a['postura']=='REFUTA'))"
  unidad: pct1
- id: clMFrefutaNegativo
  pregunta: "¿Cuántas refutaciones apuntan al conocimiento negativo?"
  derivacion: "sum(1 for r in digest for a in r['mf_aplicabilidad'] if a['postura']=='REFUTA' and a['ancla']=='NEGATIVO')"
  unidad: int
- id: clMFanclaCosto
  pregunta: "¿Cuántos mapeos tocan la economía de contexto?"
  derivacion: "sum(1 for r in digest for a in r['mf_aplicabilidad'] if a['ancla'] == 'COSTO')"
  unidad: int
- id: clMFanclaGMdos
  pregunta: "¿Cuántos mapeos tocan G-M2 en cualquier postura?"
  derivacion: "sum(1 for r in digest for a in r['mf_aplicabilidad'] if a['ancla'] == 'G-M2')"
  unidad: int
- id: clMFanclaTierDocs
  pregunta: "¿Cuántos mapeos tocan el Tier de documentos?"
  derivacion: "sum(1 for r in digest for a in r['mf_aplicabilidad'] if a['ancla'] == 'TIER-DOCS')"
  unidad: int

# ---------------------------------------------------------------- calidad del corpus
- id: clCalReconsiderarExt
  pregunta: "¿Cuántos registros marcó la extracción como de calidad dudosa?"
  derivacion: "sum(1 for r in extraction if 'RECONSIDERAR' in (r['notes'] or ''))"
  unidad: int
- id: clCalReconsiderarDig
  pregunta: "¿Cuántos marcó la digestión, ya con el texto completo a la vista?"
  derivacion: "sum(1 for r in digest if 'RECONSIDERAR' in (r.get('notes') or ''))"
  unidad: int
- id: clCalReconsiderarDigPct
  pregunta: "¿Qué proporción del corpus analizado levanta una señal de calidad?"
  derivacion: "pct(sum(1 for r in digest if 'RECONSIDERAR' in (r.get('notes') or '')), len(digest))"
  unidad: pct1
  glosa: "leer el texto completo detecta más del doble de problemas que leer campos"
- id: clCalDuplicados
  pregunta: "¿Cuántos pares casi-duplicados detectó el escaneo de integridad?"
  derivacion: "len(duplicados)"
  unidad: int
- id: clCalArtefactos
  pregunta: "¿Cuántos registros resultaron ser herramientas o artefactos y no estudios?"
  derivacion: "len(artifacts)"
  unidad: int

# ---------------------------------------------------------------- taxonomía G-M2 (§ discusión)
# Los conteos salen de gmdos-taxonomy.yml, cuya cobertura el gate exige == al conjunto REFUTA∧G-M2.
- id: clGMdosTotal
  pregunta: "¿Cuántas refutaciones sobre retrieval medido se clasificaron por dirección?"
  derivacion: "len(gmdos)"
  unidad: int
- id: clGMdosMenos
  pregunta: "¿Cuántas miden que AÑADIR una capa de recuperación no ayuda o perjudica?"
  derivacion: "sum(1 for t in gmdos if t['direccion'] == 'MENOS-MAQUINARIA')"
  unidad: int
  glosa: "contexto largo, documento completo o un scorer simple igualan o superan al índice"
- id: clGMdosMas
  pregunta: "¿Cuántas miden que la similitud PURA es insuficiente?"
  derivacion: "sum(1 for t in gmdos if t['direccion'] == 'MAS-MAQUINARIA')"
  unidad: int
  glosa: "hace falta híbrido, estructura, grafo o recuperación agéntica multi-salto"
- id: clGMdosCalidad
  pregunta: "¿Cuántas no discuten recuperación sino la solidez del número reportado?"
  derivacion: "sum(1 for t in gmdos if t['direccion'] == 'CALIDAD')"
  unidad: int

# ---------------------------------------------------------------- amenazas a la validez
- id: clAmeSinTextoPreprint
  pregunta: "De los incluidos sin texto completo, ¿cuántos son preprints de arXiv?"
  derivacion: "sum(1 for r in extraction if r['pdf_status'] != 'ok' and not r['key'].startswith('W'))"
  unidad: int
  glosa: "cero: el material inaccesible es íntegramente de venues con DOI de editorial"
- id: clAmeAnalizadosPreprint
  pregunta: "¿Qué proporción de los analizados son preprints de arXiv?"
  derivacion: "pct(sum(1 for r in extraction if r['pdf_status']=='ok' and not r['key'].startswith('W')), sum(1 for r in extraction if r['pdf_status']=='ok'))"
  unidad: pct1

