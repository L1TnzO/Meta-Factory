# ---------------------------------------------------------------- post-SPI (denominadores tras aplicar
# la segunda pasada — SMS-V2-CLAIMS-CONTRACT.md §2/§4; corolario §9.3: corpus_v2 es el flujo, digest_v2
# es el ÚNICO denominador de resultado, nunca intercambiables)
- id: clPostDigest
  pasada: post
  pregunta: "¿Sobre cuántos estudios se computa todo resultado tras aplicar la SPI?"
  derivacion: "len(digest_v2)"
  unidad: int
  glosa: "denominador de §5 en adelante (corolario §9.3) — nunca corpus_v2"
- id: clPostCorpus
  pasada: post
  pregunta: "¿Cuál es el corpus admitido (nivel PRISMA) tras aplicar la SPI?"
  derivacion: "len(corpus_v2)"
  unidad: int
  glosa: "denominador del flujo (§4.4); admite sin exigir texto completo — corolario §9.3"
- id: clPostDegradados
  pasada: post
  pregunta: "¿Cuántos estudios degradó la SPI por fallo de procedencia?"
  derivacion: "len({r['key'] for r in applied['membership_delta'] if r['effect'] == 'DEGRADED'} - corpus_v2)"
  unidad: int
  glosa: "siguen en digest.jsonl (nada se borra, §3.3); se restan por derivación, nunca por edición — amenaza declarada"
- id: clPostFusiones
  pasada: post
  pregunta: "¿Cuántos pares de registros resultaron ser el mismo estudio?"
  derivacion: "sum(1 for p in applied['merged_into'] if p['into'] in corpus_v2)"
  unidad: int
  glosa: "una fusión colapsa identidad, no evidencia (§2)"
- id: clPostAdmitidosSpi
  pasada: post
  pregunta: "¿Cuántos estudios admitió la SPI que la pasada 1 no había incluido?"
  derivacion: "len({r['key'] for r in applied['membership_delta'] if r['effect'] == 'ADD_INCLUIR'} & corpus_v2)"
  unidad: int
- id: clPostExcluidosSpi
  pasada: post
  pregunta: "¿Cuántos estudios excluyó la SPI que la pasada 1 había incluido?"
  derivacion: "len({r['key'] for r in applied['membership_delta'] if r['effect'] == 'ADD_EXCLUIR'} - corpus_v2)"
  unidad: int
- id: clPostBloqueadosSinTexto
  pasada: post
  pregunta: "¿Cuántos estudios admitidos al corpus quedaron sin texto completo para digerir?"
  derivacion: "len(set(applied['digest_blocked_no_fulltext']) - digest_v2)"
  unidad: int
  glosa: "admitir al corpus ≠ admitir al digest (§1) — amenaza declarada de cobertura/accesibilidad"
- id: clPostPendientesDigest
  pasada: post
  pregunta: "¿Cuántos estudios elegibles siguen sin digerir?"
  derivacion: "len({k for k in applied['digest_eligible'] if k not in digest_v2})"
  unidad: int
  glosa: "13 al cerrar la SPI, 0 al cerrar la ola B del digest — obligatoria de citar sólo mientras sea > 0 (I-7)"
- id: clPostExclusionesSoloTitulo
  pasada: post
  pregunta: "¿Cuántas exclusiones de la SPI se decidieron con sólo el título a la vista?"
  derivacion: "len({r['key'] for r in applied['membership_delta'] if r['effect'] == 'ADD_EXCLUIR' and r.get('evidence_grade') == 'title-only'} - corpus_v2)"
  unidad: int
  glosa: "amenaza declarada: la cobertura de accesibilidad no es uniforme"

# ---------------------------------------------------------------- fiabilidad de la SPI (segunda pasada
# como objeto de estudio, §4.7 — SMS-V2-CLAIMS-CONTRACT.md §4; κ se deriva de los veredictos crudos,
# nunca se copia de AGREEMENT.md, §5.2)
- id: clFiaKappaColapsado
  pasada: spi
  pregunta: "¿Cuál es el acuerdo entre la pasada 1 y la SPI, colapsado a IN/OUT/HUMANO?"
  derivacion: "cohen_kappa([(collapse(a), collapse(b)) for a, b in spi_pairs(spi)])"
  unidad: float3
  glosa: "responde «¿el paper entra al estudio?»; sólo estratos VERIFICACION, muestra aleatoria pre-registrada"
- id: clFiaKappaExacto
  pasada: spi
  pregunta: "¿Cuál es el acuerdo entre la pasada 1 y la SPI exigiendo coincidir también en el subtipo?"
  derivacion: "cohen_kappa(spi_pairs(spi))"
  unidad: float3
  glosa: "distinción de subtipo de exclusión que no cambia el corpus"
- id: clFiaColaHumanaFilas
  pasada: spi
  pregunta: "¿Cuántas filas quedaron marcadas HUMAN_QUEUE al aplicar la SPI?"
  derivacion: "sum(1 for r in applied['membership_delta'] if r['effect'] == 'HUMAN_QUEUE')"
  unidad: int
  glosa: "filas, no estudios — incluye los re-enrutados por título (§2)"
- id: clFiaColaHumana
  pasada: spi
  pregunta: "¿Cuántos estudios distintos componen la cola humana que derivó la SPI?"
  derivacion: "len({r['key'] for r in applied['membership_delta'] if r['effect'] == 'HUMAN_QUEUE'})"
  unidad: int
  glosa: "claves únicas; no es el mismo conjunto que CONFLICTOS.csv (§2: dos poblaciones, no una)"
- id: clFiaConflictosFilas
  pasada: spi
  pregunta: "¿Cuántas filas de desacuerdo registró el cierre de la fase A?"
  derivacion: "len(conflicts)"
  unidad: int
  glosa: "CONFLICTOS.csv; no coincide 1:1 con la cola HUMAN_QUEUE (§2)"
