# Taxonomía de las refutaciones sobre G-M2 (retrieval medido) — ACTO ANALÍTICO DECLARADO.
#
# Por qué existe este archivo: el agregado «REFUTA se concentra en G-M2» se leyó, en la bitácora de
# la digestión, como «el corpus refuta ADR-019». Al LEER las 23 notas una por una esa lectura no se
# sostiene: las refutaciones apuntan en DOS direcciones opuestas y casi se empatan. Contar sin leer
# habría producido un hallazgo falso en el paper.
#
# Este archivo es la clasificación, hecha a mano, de cada refutación en su dirección. Es un juicio,
# no una medición — por eso vive aparte, con su evidencia citada, y los conteos del paper se derivan
# DE AQUÍ (claims.yml) en vez de afirmarse en prosa. Cualquiera puede abrir el digest y discutir una
# asignación; eso es exactamente lo que debe poder hacerse con un juicio.
#
# Direcciones:
#   MENOS-MAQUINARIA — mide que añadir una capa de retrieval NO ayuda (o perjudica): contexto largo,
#                      documento completo o un scorer simple igualan o superan al índice.
#   MAS-MAQUINARIA   — mide que la similitud PURA es insuficiente: hace falta híbrido, estructura,
#                      grafo o recuperación agéntica multi-salto.
#   CALIDAD          — no discute retrieval: señala que el número reportado no se sostiene contra la
#                      propia tabla del trabajo (relevante para RQ6 y para la lectura del corpus).

