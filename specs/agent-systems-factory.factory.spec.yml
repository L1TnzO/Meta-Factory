# agent-systems-factory.factory.spec.yml — ASF descrito COMPLETO en la gramática v2 (A2).
# BLUEPRINT (target) del ASF pineado @ b1fcb1f (reference/ASF-PROVENANCE.md). Describe, NO genera:
# la línea S0–S8 real y las 7 capacidades quedan `declared-deferred` (su codegen es F1 del ROADMAP).
# DIVERGE a propósito de la fábrica REGISTRADA factories/agent-systems-factory/ (proxy s00, cerrada en
# ASF-REGEN): aquélla corre hoy; ésta es el target completo. El mapeo capacidad→primitiva es JUICIO
# (provisional hasta el skill B1); el validator sólo exige la FORMA (tech⇒DES-N), nunca el nombre de tech.

# ── L0 · identidad ──
factory:
  name: "Agent Systems Factory"
  slug: agent-systems-factory
  maturity: regenerated

# ── L1 · dominio: las 7 capacidades de producción, cada una con la primitiva DES que requiere y la
#       tecnología que el plan eligió para proveerla (ADR-012). status declared-deferred (codegen = F1).
domain:
  produces: "una fábrica de sistemas de agentes LangGraph de grado-producción (línea S0–S8): topología verificable, estado durable, linaje, anclaje, atribución, HITL no-salteable y evaluación con compuertas"
  target_framework: { name: langgraph, provider_agnostic: true }   # ADR-002: productos sobre LangGraph; el producto llama al modelo vía ChatModel de LangChain, nunca importa el SDK de un proveedor
  capabilities:
    # Fuente: ARCHITECTURE.md §1.3 (tabla canónica) + PRODUCTION-CAPABILITIES.md §3 (patrones e invariantes)
    - id: observabilidad
      invariant: "árbol de trazas inspeccionable de toda decisión: un procesador de spans (generado) inyecta los atributos semánticos de provenance en cada span del producto; el invariante no depende de ningún nodo del agente"
      primitive: DES-5            # Procedencia / trazabilidad
      tech: "OpenTelemetry GenAI semconv + export OTLP (Langfuse/Phoenix)"
      artifact: "observability/span_processor.py"
      proof: "un árbol de spans con atributos provenance.* en InMemorySpanExporter"
      status: declared-deferred
    - id: trazabilidad_y_linaje
      invariant: "recorrido bidireccional salida↔evidencia sobre grafo W3C PROV+PAV en Neo4j; todo nodo de linaje estampa la clave de unión (trace_id, span_id, checkpoint_id)"
      primitive: DES-5
      tech: "Neo4j + modelo W3C PROV+PAV"
      artifact: "lineage/graph.py"
      proof: "recorridos backward (salida→evidencia) y forward (fuente→influidos) con la clave de unión presente"
      status: declared-deferred
    - id: estado_durable_y_recuperacion
      invariant: "la máquina de estados es checkpointeada; un fallo de nodo no reejecuta lo completado — el ciclo es resumible desde el último checkpoint"
      primitive: DES-4            # Estado durable / resumible
      tech: "LangGraph AsyncPostgresSaver (langgraph-checkpoint-postgres)"
      artifact: "state/checkpointer.py"
      proof: "prueba de fallo inyectado: los nodos completados no se reejecutan; el grafo resume"
      status: declared-deferred
    - id: anclaje_de_fuentes
      invariant: "retrieval trazable por construcción: tabla de evidencia inmutable (append-only), segmentación consciente de fronteras, interfaz retrieve() que retorna ProvenancePayload no opcional"
      primitive: DES-6            # Contratos tipados en fronteras (el retrieve() tipado es el invariante exigible)
      tech: "tabla de evidencia append-only + interfaz tipada retrieve()→tuple[str, ProvenancePayload]"
      artifact: "grounding/retrieve.py"
      proof: "mypy --strict sobre la firma + segmentación consciente de fronteras"
      status: declared-deferred
    - id: atribucion_y_fundamentacion
      invariant: "bandera grounded/inferred con confianza calibrada por ítem: un ítem sin fragmento de soporte se fuerza a grounded=false; la escalera de atribución (ContextCite/MiniCheck/NLI) corre como nodos del grafo, no interna a un nodo del agente"
      primitive: DES-3            # Puntos de control no-salteables (la regla «sin soporte⇒grounded=false»); la escalera-como-nodos es DES-2
      tech: "escalera de atribución (NLI/MiniCheck/ContextCite) como nodos del grafo"
      artifact: "attribution/ladder.py"
      proof: "regla 'sin soporte ⇒ grounded=false' + presencia de bandera+confianza en cada ítem"
      status: declared-deferred
    - id: control_y_supervision_humana
      invariant: "techo de autonomía imposible de saltear: ninguna ruta de finalización evita el interrupt() de LangGraph; toda edición humana en el resume crea una versión nueva con pav:curatedBy; la salida lleva etiqueta DRAFT; no existe ruta de auto-aprobación"
      primitive: DES-3            # Puntos de control no-salteables (interrupt() es la primitiva canónica)
      tech: "interrupt()/resume de LangGraph + versionado PAV"
      artifact: "hitl/review.py"
      proof: "alcanzabilidad sobre el grafo compilado get_graph(): ninguna ruta de finalización evita interrupt()"
      status: declared-deferred
    - id: evaluabilidad
      invariant: "calidad medida con compuertas que bloquean: el CI termina con error si una métrica cae bajo su umbral (ej. faithfulness ≥ 0.7, recall crítico ≥ 0.9, parametrizados desde el spec); el gold set provisional queda etiquetado y la acción requerida documentada"
      primitive: DES-7            # Evaluabilidad con compuertas
      tech: "DeepEval/RAGAS/Phoenix Evals con gates de umbral en CI"
      artifact: "eval/harness.py"
      proof: "el CI termina con error ante un caso failing bajo umbral"
      status: declared-deferred

  # ── L2 · línea: la secuencia S0–S8 real del ASF como stations v2 (depends_on + proof_checks).
  #       Fuente: ARCHITECTURE.md §10 (tabla canónica de estaciones). status declared-deferred (codegen F1).
  #       Activación: las estaciones condicionales del ASF (linaje/anclaje/atribución/HITL) son `optional`.
  station_sequence:
    - id: s0
      name: "Contrato de especificación (Definition of Ready)"
      activation: always
      status: declared-deferred
      proof_checks:
        - { name: spec_admission, cmd: "validar spec contra schema+completitud+refs cruzadas", runs_in: factory_env, toolchain: metafactory, status: declared-deferred }
    - id: s1
      name: "Sustrato de observabilidad"
      activation: always
      depends_on: [s0]
      status: declared-deferred
      proof_checks:
        - { name: span_tree_provenance, cmd: "pytest tests/test_observability.py", runs_in: product_env, toolchain: pytest, status: declared-deferred }
    - id: s2
      name: "Sustrato de trazabilidad/linaje"
      activation: optional        # condicionada por profundidad de linaje en el spec
      depends_on: [s1, s3]        # la clave de unión del linaje incluye checkpoint_id (de S3, estado durable); PRODUCTION-CAPABILITIES S2
      status: declared-deferred
      proof_checks:
        - { name: lineage_join_key, cmd: "pytest tests/test_lineage.py", runs_in: product_env, toolchain: pytest, status: declared-deferred }
    - id: s3
      name: "Estado durable y recuperación"
      activation: always
      depends_on: [s0]
      status: declared-deferred
      proof_checks:
        - { name: resume_no_reexec, cmd: "pytest tests/test_checkpoint_resume.py", runs_in: product_env, toolchain: pytest, status: declared-deferred }
    - id: s4
      name: "Núcleo agéntico (topología del StateGraph)"
      activation: always
      depends_on: [s1, s3]
      status: declared-deferred
      proof_checks:
        - { name: topology_compiles, cmd: "pytest tests/test_topology.py", runs_in: product_env, toolchain: pytest, status: declared-deferred }
        - { name: typed_blackboard, cmd: "mypy --strict src/", runs_in: product_env, toolchain: mypy, status: declared-deferred }
    - id: s5
      name: "Anclaje de fuentes"
      activation: optional        # condicionada por source_grounded en el spec
      depends_on: [s4]
      status: declared-deferred
      proof_checks:
        - { name: typed_retrieve, cmd: "mypy --strict src/grounding/", runs_in: product_env, toolchain: mypy, status: declared-deferred }
    - id: s6
      name: "Atribución y fundamentación"
      activation: optional        # condicionada por 'hace aserciones' en el spec
      depends_on: [s5]
      status: declared-deferred
      proof_checks:
        - { name: no_support_ungrounded, cmd: "pytest tests/test_attribution.py", runs_in: product_env, toolchain: pytest, status: declared-deferred }
    - id: s7
      name: "Control y supervisión humana"
      activation: optional        # condicionada por nivel de autonomía en el spec
      depends_on: [s4]
      status: declared-deferred
      proof_checks:
        - { name: interrupt_unbypassable, cmd: "pytest tests/test_hitl_reachability.py", runs_in: product_env, toolchain: pytest, status: declared-deferred }
    - id: s8
      name: "Sustrato de evaluabilidad"
      activation: always
      depends_on: [s4]
      status: declared-deferred
      proof_checks:
        - { name: eval_threshold_gate, cmd: "pytest tests/test_eval_gates.py", runs_in: product_env, toolchain: pytest, status: declared-deferred }

  provision_modes: [prompt, integration, custom]   # ARCHITECTURE.md §11.2: prompt→Nivel A · integration→Nivel B/C · custom→reductor de canal
  hitl: { non_skippable_interrupt: true }           # §1.3 + §10 S7 + ADR-015: verificado por alcanzabilidad sobre get_graph()
  product:
    product_module: agent_system
    greet_fn: assemble
    marker: AGENT_SYSTEM_OK

# ── L3 · maquinaria: lo que el PLAN eligió (DATO, no opinado por el sustrato; ADR-012) ──
machinery:
  harness:
    tech: "agents (roles S0–S8) + hooks (columna) + commands + MCP tipado"
    primitive: DES-1              # Andamiaje regenerable (el harness se genera del spec)
    status: declared-deferred
  mcp:
    tech: "MCP de la fábrica: tools tipadas (validate/station/rtm) que el orquestador invoca"
    primitive: DES-6              # Contratos tipados en fronteras
    status: declared-deferred
  infra:
    tech: "Postgres (checkpointer) + Neo4j (linaje), levantados en sandbox por compose"
    primitive: DES-4              # Estado durable / resumible
    status: declared-deferred

# ── L4 · sustrato estandarizado por el Meta-Factory (existencia no negociable) ──
factory_substrate:
  anti_rubber_stamp_column: true
  verdict_bus: { max_lines: 10 }
  generated_domain_boundary: true
  memory_schema: adr021
  rtm: { required: true }
  two_verifier_ci: { rederive: true, pinned_verdict: true }
  placement_law: true
  context_budget: { claude_md_max_lines: 120 }

# ── L5 · requisitos (espina SDD): satisfied_by → estaciones; verified_by → proof_checks reales ──
requirements:
  functional:
    - id: REQ-F-001
      statement: "el núcleo agéntico compila su topología (get_graph()) y ninguna ruta de finalización evita el interrupt() (HITL no-salteable)"
      acceptance: "topology_compiles verde Y la alcanzabilidad demuestra que toda terminación pasa por interrupt()"
      satisfied_by: [s4, s7]
      verified_by: [topology_compiles, interrupt_unbypassable]
    - id: REQ-F-002
      statement: "un fallo de nodo no reejecuta lo completado: el ciclo resume desde el último checkpoint"
      acceptance: "resume_no_reexec verde con un fallo inyectado a mitad de la línea"
      satisfied_by: [s3]
      verified_by: [resume_no_reexec]
    - id: REQ-F-003
      statement: "un ítem de salida sin fragmento de soporte se fuerza a grounded=false (atribución honesta)"
      acceptance: "no_support_ungrounded verde: ningún ítem sin soporte queda grounded=true"
      satisfied_by: [s6]
      verified_by: [no_support_ungrounded]
  nonfunctional:
    - id: REQ-NF-001
      statement: "la calidad se mide con compuertas que BLOQUEAN: el CI termina con error si una métrica cae bajo su umbral"
      acceptance: "eval_threshold_gate hace fallar el CI ante un caso bajo umbral (faithfulness < 0.7)"
      satisfied_by: [s8]
      verified_by: [eval_threshold_gate]
