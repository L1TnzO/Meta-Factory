id: m01
name: "Seed & columna anti-sello"
activation: always
# M1 instala el kernel de confianza de la fábrica nueva: el seed (verbatim) + las sombras
# de la columna (.claude). La gate exige la PRUEBA DE BLOQUEO en miniatura en DOS niveles:
# la librería del seed recién instalada debe RECHAZAR un veredicto tampereado (column_selftest),
# y los HOOKS heredados cableados (commit_guard C2 + stop_proof C3, D1) deben BLOQUEAR ese veredicto
# cuando se invocan como el harness los invoca y PASAR el verde-limpio (column_full) — la columna
# completa, autocontenida en el seed de la fábrica, que la defiende sola.
builds:
  - { action: copy_seed }                                  # seed/verifier.py + column.md + external_ci.yml
  - { action: render_tree, src: "template/factory/harness", dest: "." }   # .claude/ hooks + permissions.deny
checks:
  - { name: seed_present, kind: artifact_contains, file: "seed/verifier.py", marker: "recompute_passed" }
  - { name: column_blocks, kind: column_selftest }
  - { name: column_wired, kind: column_full }
