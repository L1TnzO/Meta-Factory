id: m02
name: "Engine & estaciones-como-dato"
activation: always
# M2 materializa la línea de PRODUCTO de la fábrica como DATO (I-2): el YAML de su secuencia. El
# CÓDIGO de dominio que fabrica el producto lo instala M4 (frontera generado/dominio). La gate exige
# que la secuencia parsee y sea DETERMINISTA (mismo orden entre corridas) y que la estación s00 exista.
builds:
  - { action: render, src: "template/factory/product/stations/s00.yml", dest: "stations/s00.yml" }
checks:
  - name: stations_parse
    kind: import_runs
    code: "from metafactory.engine import load_sequence; a=load_sequence('stations'); b=load_sequence('stations'); assert a.ids()==b.ids() and a.ids(), 'secuencia vacía o no determinista'; assert 's00' in a.ids(), 'falta la estación de producto s00'"
